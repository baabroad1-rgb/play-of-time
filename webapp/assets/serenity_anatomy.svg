<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Roboto, Arial, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="curve-grad" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0526f"/>
      <stop offset="35%" stop-color="#e0526f"/>
      <stop offset="50%" stop-color="#7fe667"/>
      <stop offset="65%" stop-color="#35a9c9"/>
      <stop offset="100%" stop-color="#35a9c9"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2d38"/>
      <stop offset="100%" stop-color="#1c1e26"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#15171e"/>

  <!-- Title -->
  <text x="600" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#f5f5f7">
    Anatomy of Serenity: Balance as a Conscious Skill
  </text>
  <text x="600" y="96" text-anchor="middle" font-size="18" fill="#b7b9c3">
    The main lever of self-control is the balance between excitation and inhibition.
  </text>

  <!-- Column labels -->
  <text x="185" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#e0526f">EXCESS EXCITATION</text>
  <text x="185" y="184" text-anchor="middle" font-size="19" font-weight="600" fill="#c7c9d1">Leads to premature pressing. Excess</text>
  <text x="185" y="209" text-anchor="middle" font-size="19" font-weight="600" fill="#c7c9d1">uncontrolled energy that pushes you</text>
  <text x="185" y="234" text-anchor="middle" font-size="19" font-weight="600" fill="#c7c9d1">to act too soon.</text>

  <text x="600" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#7fe667">THE "SERENITY" ZONE</text>
  <text x="600" y="184" text-anchor="middle" font-size="19" font-weight="600" fill="#c7c9d1">The ideal working balance. Enough energy</text>
  <text x="600" y="209" text-anchor="middle" font-size="19" font-weight="600" fill="#c7c9d1">to act immediately, and enough restraint</text>
  <text x="600" y="234" text-anchor="middle" font-size="19" font-weight="600" fill="#c7c9d1">for absolute precision.</text>

  <text x="1015" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#35a9c9">EXCESS INHIBITION</text>
  <text x="1015" y="184" text-anchor="middle" font-size="19" font-weight="600" fill="#c7c9d1">Leads to delayed pressing. Excess</text>
  <text x="1015" y="209" text-anchor="middle" font-size="19" font-weight="600" fill="#c7c9d1">restraint that blocks a timely</text>
  <text x="1015" y="234" text-anchor="middle" font-size="19" font-weight="600" fill="#c7c9d1">reaction.</text>

  <!-- Leader lines from labels to curve -->
  <line x1="255" y1="244" x2="400" y2="392" stroke="#e0526f" stroke-width="1.2" opacity="0.7"/>
  <line x1="945" y1="244" x2="800" y2="392" stroke="#35a9c9" stroke-width="1.2" opacity="0.7"/>

  <!-- Fill under the curve, one continuous gradient -->
  <path d="M80,517.8 L120,515.5 L160,511.6 L200,504.9 L240,494.5 L280,479.1 L320,458.1 L360,431.4
           L400,399.9 L440,365.9 L480,332.9 L520,305.2 L560,286.6 L600,280 L640,286.6 L680,305.2
           L720,332.9 L760,365.9 L800,399.9 L840,431.4 L880,458.1 L920,479.1 L960,494.5 L1000,504.9
           L1040,511.6 L1080,515.5 L1120,517.8 L1120,520 L80,520 Z" fill="url(#curve-grad)" opacity="0.16"/>

  <!-- Curve stroke, one continuous gradient -->
  <path d="M80,517.8 L120,515.5 L160,511.6 L200,504.9 L240,494.5 L280,479.1 L320,458.1 L360,431.4
           L400,399.9 L440,365.9 L480,332.9 L520,305.2 L560,286.6 L600,280 L640,286.6 L680,305.2
           L720,332.9 L760,365.9 L800,399.9 L840,431.4 L880,458.1 L920,479.1 L960,494.5 L1000,504.9
           L1040,511.6 L1080,515.5 L1120,517.8"
        fill="none" stroke="url(#curve-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Scatter dots tracing the curve -->
  <g fill="url(#curve-grad)">
    <circle cx="80" cy="517.8" r="3"/><circle cx="120" cy="515.5" r="3"/><circle cx="160" cy="511.6" r="3"/>
    <circle cx="200" cy="504.9" r="3"/><circle cx="240" cy="494.5" r="3"/><circle cx="280" cy="479.1" r="3"/>
    <circle cx="320" cy="458.1" r="3"/><circle cx="360" cy="431.4" r="3"/><circle cx="400" cy="399.9" r="3"/>
    <circle cx="440" cy="365.9" r="3"/><circle cx="480" cy="332.9" r="3"/><circle cx="520" cy="305.2" r="3"/>
    <circle cx="560" cy="286.6" r="3"/><circle cx="640" cy="286.6" r="3"/><circle cx="680" cy="305.2" r="3"/>
    <circle cx="720" cy="332.9" r="3"/><circle cx="760" cy="365.9" r="3"/><circle cx="800" cy="399.9" r="3"/>
    <circle cx="840" cy="431.4" r="3"/><circle cx="880" cy="458.1" r="3"/><circle cx="920" cy="479.1" r="3"/>
    <circle cx="960" cy="494.5" r="3"/><circle cx="1000" cy="504.9" r="3"/><circle cx="1040" cy="511.6" r="3"/>
    <circle cx="1080" cy="515.5" r="3"/><circle cx="1120" cy="517.8" r="3"/>
  </g>

  <!-- Vertical tick lines at the three marker points -->
  <line x1="400" y1="399.9" x2="400" y2="520" stroke="#e0526f" stroke-width="1.2" opacity="0.55"/>
  <line x1="600" y1="280" x2="600" y2="520" stroke="#7fe667" stroke-width="2" opacity="0.9" filter="url(#soft-glow)"/>
  <line x1="800" y1="399.9" x2="800" y2="520" stroke="#35a9c9" stroke-width="1.2" opacity="0.55"/>

  <!-- Glowing marker dots -->
  <circle cx="400" cy="399.9" r="5" fill="#e0526f" filter="url(#soft-glow)"/>
  <circle cx="600" cy="280" r="6" fill="#7fe667" filter="url(#soft-glow)"/>
  <circle cx="800" cy="399.9" r="5" fill="#35a9c9" filter="url(#soft-glow)"/>

  <!-- Baseline -->
  <line x1="60" y1="520" x2="1140" y2="520" stroke="#33374a" stroke-width="1"/>

  <!-- Bottom stat box -->
  <rect x="40" y="600" width="1120" height="120" rx="16" fill="url(#box-grad)" stroke="#3a3d4a" stroke-width="1"/>
  <text x="600" y="644" text-anchor="middle" font-size="21" font-weight="800" fill="#f5f5f7">
    Serenity Coins: The Measure of Control
  </text>
  <text x="600" y="678" text-anchor="middle" font-size="19" font-weight="600" fill="#c7c9d1">
    The game rewards stability. Serenity Coins aren't a trophy for a lucky one-off —
  </text>
  <text x="600" y="704" text-anchor="middle" font-size="19" font-weight="600" fill="#c7c9d1">
    they're a precise measure of your repeatable control over your own state.
  </text>
</svg>
