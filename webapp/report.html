// Real attempt count for an exact date range (Alex 2026-09-16: "пользователь
// не должен иметь возможности выбрать день где не было попыток или
// недостаточно попыток"). playerBounds() only bounds the OUTER min/max dates
// a player has ever played — individual days/weeks/months inside that span
// can still be empty (a skipped day, a short first week of a new level).
// The popover's own preset menu already checked this per-option (see
// openPeriodPopover()'s noAttempts check, Alex 2026-09-14); this is the same
// check exposed for the ‹›pager and the custom-date form, neither of which
// had it — the pager only checked calendar bounds, so it could still step
// onto an empty day/week/month even though the menu's own defaults couldn't.
function attemptsCountInRange(from, to){
  return filterByDate(DATA[state.player].attempts, from, to).length;
}

function setDefaultRanges(){
  const b = playerBounds();
  // A defaults to Today — but if today genuinely has zero attempts yet,
  // walk backward to the nearest day that DOES (Alex 2026-09-18: "сделай
  // органически... две морды всегда", "убери эту подпись об отсутствии
  // периода" — Face A should never land on the "no attempts" placeholder
  // by default; it should just show the closest real day instead, same
  // as the Day-picker's own fallback already does, but automatically on
  // load rather than requiring a manual "Day" pick first). The label
  // stays honest — dayOffset feeds describeSelection() same as the Day
  // picker, so this reads as "Yesterday"/"3 days ago"/etc., never a lie
  // that a non-today day is "Today".
  let day = REAL_TODAY, offset = 0;
  while (attemptsCountInRange(day, day) === 0 && day >= b.min){
    offset += 1;
    day = daysAgoDate(REAL_TODAY, offset);
  }
  state.aFrom = day; state.aTo = day;
  state.aSel = offset === 0 ? {type:"today"} : {type:"day", dayOffset: offset};
  // B по умолчанию — ДЕНЬ ПЕРЕД A (Alex 2026-09-28: «по умолчанию поставь
  // слева кнопку сегодня а справа кнопку вчера»). Раньше здесь была неделя,
  // и пара читалась как «сегодня против недели» — сравнение разнородных
  // отрезков. День против дня сравнивает сопоставимое.
  //
  // Тот же проход по пустым дням назад, что и у A выше, и по той же причине:
  // морды должно быть две, а не одна и заглушка. Тип day (а не пресет
  // yesterday) выбран сознательно — он honest в подписи через dayOffset
  // («Вчера», «Позавчера», дальше просто дата) и приносит листалку ‹›, так
  // что соседние дни листаются без захода в меню.
  let bOffset = offset + 1, bDay = daysAgoDate(REAL_TODAY, bOffset);
  while (bDay >= b.min && attemptsCountInRange(bDay, bDay) === 0){
    bOffset += 1;
    bDay = daysAgoDate(REAL_TODAY, bOffset);
  }
  if (bDay >= b.min){
    state.bFrom = bDay; state.bTo = bDay;
    state.bSel = {type:"day", dayOffset: bOffset};
  } else {
    // Раньше дня A ни одного дня с попытками нет — сравнивать по дням не с
    // чем, остаётся прежнее умолчание «неделя».
    // Clamp to the level boundary (Alex 2026-09-11) — a "week" preset's from-date
    // is computed purely by calendar math and doesn't know DATA only contains
    // the current tier; for a player with a short current-level history the
    // naive "week" window can reach earlier than any same-tier attempt exists.
    const refB = daysAgoDate(b.max, 1);
    const bb = presetRangeFrom("week", refB, b.min);
    state.bFrom = bb.from < b.min ? b.min : bb.from; state.bTo = bb.to;
    state.bSel = {type:"week"};
  }
}

// ---------- Popover: клик по слову-периоду в заголовке предложения ----------
const popover = document.getElementById("periodPopover");

function closePopover(){ popover.classList.remove("show"); }

// Exact label for whatever was actually picked (Alex 2026-09-14: "в
// название над мордой выводить ровно то что выбрано") — replaces the old
// approximate "about a week ago" style guessing from raw dates with the
// real selection state (state.aSel/bSel), which every apply-path above now
// records alongside the dates themselves.
function describeSelection(which, lang){
  const sel = (which === "A" ? state.aSel : state.bSel) || {type:"custom"};
  const from = which === "A" ? state.aFrom : state.bFrom;
  const to = which === "A" ? state.aTo : state.bTo;
  if (sel.type === "today") return lang === "en" ? "Today" : "Сегодня";
  if (sel.type === "yesterday") return lang === "en" ? "Yesterday" : "Вчера";
  if (sel.type === "daybefore") return lang === "en" ? "Day before yesterday" : "Позавчера";
  // "Day" (Alex 2026-09-15) — the merged, steppable Today/Yesterday/further-
  // back entry. dayOffset 0/1/2 reuse the exact same words the old separate
  // presets used, so a viewer sees no difference once they land on one of
  // those three; anything further back is just the actual date.
  if (sel.type === "day"){
    if (sel.dayOffset === 0) return lang === "en" ? "Today" : "Сегодня";
    if (sel.dayOffset === 1) return lang === "en" ? "Yesterday" : "Вчера";
    if (sel.dayOffset === 2) return lang === "en" ? "Day before yesterday" : "Позавчера";
    return fmtDayMonthShort(from, lang);
  }
  if (sel.type === "week") return (lang === "en" ? "Week — " : "Неделя — ") + fmtRangeShort(from, to, lang);
  if (sel.type === "month") return fmtMonthYear(sel.monthStart || from, lang);
  return fmtRangeShort(from, to, lang); // custom
}

// Both sides anchor to the SAME reference point (b.max = today) — Alex
// 2026-09-14: "одинаковые периоды, очевидно должны давать одинаковые лица".
// B used to anchor to "the day before A" instead, so picking the SAME
// preset label (e.g. "Today") on both sides silently produced two
// different dates — the labels lied about what was actually selected. The
// staggered "B = the stretch right before A" default is still exactly what
// a first-time viewer sees (setDefaultRanges() computes that independently,
// once, before either popover is ever opened) — this only changes what
// happens when the popover itself is used afterward, so an explicit pick
// means exactly what its label says.
function applyInlinePreset(which, key){
  const b = playerBounds();
  const r = presetRangeFrom(key, b.max, b.min);
  if (which === "A"){ state.aFrom = r.from; state.aTo = r.to; state.aSel = {type:key}; }
  else { state.bFrom = r.from; state.bTo = r.to; state.bSel = {type:key}; }
  render();
}

function showCustomDateForm(which){
  popover.innerHTML = "";
  const b = playerBounds();
  const row = document.createElement("div");
  row.className = "custom-row";
  const fromInput = document.createElement("input"); fromInput.type = "date";
  const toInput = document.createElement("input"); toInput.type = "date";
  // Same level-boundary rule as the preset menu (Alex 2026-09-11): the
  // custom-range picker can't reach earlier than the current tier's own
  // earliest attempt either — DATA itself is already server-filtered to one
  // accuracy tier (report_data.php), so b.min IS "when this level started."
  // Upper bound was missing entirely (Alex 2026-09-14: "custom dates не
  // работает вообще") — without max=b.max nothing stopped picking a future
  // date past the player's own last attempt, silently yielding an empty face.
  fromInput.min = b.min; toInput.min = b.min;
  fromInput.max = b.max; toInput.max = b.max;
  fromInput.value = which === "A" ? state.aFrom : state.bFrom;
  toInput.value   = which === "A" ? state.aTo   : state.bTo;
  row.appendChild(fromInput); row.appendChild(toInput);
  popover.appendChild(row);
  const applyBtn = document.createElement("button");
  applyBtn.className = "apply-btn"; applyBtn.textContent = t().apply;
  applyBtn.onclick = () => {
    // "to" before "from" used to apply silently and just show nothing
    // sensible — swap them instead of accepting an inverted range.
    let from = fromInput.value, to = toInput.value;
    if (!from || !to) return;
    if (from > to){ const tmp = from; from = to; to = tmp; }
    // Same "no empty periods" rule as the preset menu/pager (Alex
    // 2026-09-16) — a custom range's min/max only bound it to the current
    // tier, they don't guarantee any attempt actually falls inside it.
    // Refuse silently applying an empty range; show the same hint text the
    // disabled preset options already use, and leave the form open so the
    // dates stay editable instead of just closing on a no-op.
    if (attemptsCountInRange(from, to) === 0){
      let err = popover.querySelector(".custom-err");
      if (!err){
        err = document.createElement("div");
        err.className = "custom-err";
        err.style.cssText = "padding:4px 8px 2px; font-size:12px; color:var(--text-muted);";
        popover.insertBefore(err, applyBtn);
      }
      err.textContent = t().noAttemptsHint;
      return;
    }
    if (which === "A"){ state.aFrom = from; state.aTo = to; state.aSel = {type:"custom"}; }
    else { state.bFrom = from; state.bTo = to; state.bSel = {type:"custom"}; }
    render();
    closePopover();
  };
  popover.appendChild(applyBtn);
}

// "Month"/"Week" apply the most recent calendar month / trailing week
// immediately and close the popover, exactly like every other preset — Alex
// 2026-09-15: "то ни одной листалки то сразу две... убери первую, оставь
// только ту которая в заголовке морды остается". Until today, picking
// "Month" here opened a SECOND prev/next+Apply picker inside the popover
// (showMonthPicker(), same for showWeekPicker()) — genuinely redundant with
// the persistent ‹›pager that already lives on the face's own label
// (periodNavArrow()/stepPeriod() below), added in an earlier pass without
// noticing the two now did the same job two different ways. Only the label
// pager survives; this just lands on the latest month/week and the label's
// own arrows take it from there.
function applyMonthOrWeek(which, key){
  const b = playerBounds();
  if (key === "month"){
    const monthStart = startOfMonth(b.max);
    const from = monthStart < b.min ? b.min : monthStart;
    const to = endOfMonth(monthStart) > b.max ? b.max : endOfMonth(monthStart);
    const sel = {type:"month", monthStart};
    if (which === "A"){ state.aFrom = from; state.aTo = to; state.aSel = sel; }
    else { state.bFrom = from; state.bTo = to; state.bSel = sel; }
  } else { // week
    const shownEnd = b.max;
    const from = daysAgoDate(shownEnd, 6);
    const sel = {type:"week"};
    if (which === "A"){ state.aFrom = from; state.aTo = shownEnd; state.aSel = sel; }
    else { state.bFrom = from; state.bTo = shownEnd; state.bSel = sel; }
  }
  render();
}

// "Day" (side A only) — merges the old separate "Today"/"Yesterday" rows
// into one steppable entry (Alex 2026-09-15), landing on Yesterday by
// default ("первое значение будет не число а yesterday") rather than Today.
// dayOffset counts days back from the player's own most recent attempt
// (0 = today, 1 = yesterday, 2 = day before yesterday, 3+ = an actual date)
// — periodNavArrow()/stepPeriod() below step this ±1 the same way they step
// a month or a week.
function applyDefaultDay(which){
  const from = daysAgoDate(REAL_TODAY, 1);
  const sel = {type:"day", dayOffset:1};
  if (which === "A"){ state.aFrom = from; state.aTo = from; state.aSel = sel; }
  else { state.bFrom = from; state.bTo = from; state.bSel = sel; }
  render();
}

function openPeriodPopover(anchorEl, which){
  popover.innerHTML = "";
  // Comparisons must stay inside ONE precision level (Alex 2026-09-11,
  // restating/enforcing D13 at the menu level too — DATA is already
  // server-filtered to the player's current accuracy tier only, so b.min is
  // literally "the first attempt at this level"). A preset whose nominal
  // range would need to reach earlier than that is disabled outright rather
  // than silently clipped — picking "Month" a week into a new level should
  // read as unavailable, not quietly show a shrunk, mislabeled window.
  const b = playerBounds();
  const player = DATA[state.player];
  // Side A only ever offers Today (+ Custom below) — side B carries every
  // historical-reference preset (Alex 2026-09-14, see PERIOD_OPTIONS_A/B).
  const options = which === "A" ? PERIOD_OPTIONS_A : PERIOD_OPTIONS_B;
  // Same reference point (today) for BOTH sides — see applyInlinePreset()'s
  // comment: a preset picked here must mean exactly what its label says,
  // not something silently offset by which side's popover it was opened from.
  options.forEach(opt => {
    const range = presetRangeFrom(opt.key, b.max, b.min);
    const wrongLevel = range.from < b.min;
    // Alex 2026-09-14: "выбор периода не может приводить к тому что
    // 'недостаточно попыток... уточните период'. Все такие периоды должны
    // быть задизейблены" — a preset can stay inside the current tier
    // (passing the wrongLevel check above) and STILL land on zero attempts
    // (e.g. "Yesterday" when nothing was played yesterday); check the real
    // attempt count for this exact range, not just the tier boundary.
    // "Week"/"Month" no longer get an exemption here (Alex 2026-09-15
    // removed their own internal pager — see applyMonthOrWeek()'s own
    // comment) — they apply a single concrete range immediately now, same
    // as every other preset, so the same check applies the same way.
    const noAttempts = !wrongLevel && filterByDate(player.attempts, range.from, range.to).length === 0;
    const disabled = wrongLevel || noAttempts;
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = state.lang === "en" ? opt.label_en : opt.label;
    btn.disabled = disabled;
    // Alex 2026-09-13: "подсказку про то что сравниваются только результаты
    // одного уровня можно приделать к задизейбленным периодам" — a hover
    // hint explaining WHY, right on the greyed-out option, instead of a
    // standing sentence on the page that only matters for these few cases.
    if (wrongLevel) btn.title = t().sameLevelHint;
    else if (noAttempts) btn.title = t().noAttemptsHint;
    if (!disabled){
      if (opt.key === "month" || opt.key === "week") btn.onclick = () => { applyMonthOrWeek(which, opt.key); closePopover(); };
      else if (opt.key === "day") btn.onclick = () => { applyDefaultDay(which); closePopover(); };
      else btn.onclick = () => { applyInlinePreset(which, opt.key); closePopover(); };
    }
    popover.appendChild(btn);
  });
  const divider = document.createElement("div");
  divider.className = "pdivider";
  popover.appendChild(divider);
  const customBtn = document.createElement("button");
  customBtn.className = "opt"; customBtn.textContent = t().customDates;
  // stopPropagation is load-bearing here (Alex 2026-09-14: "custum day так
  // и не работает... тупо не реагирует") — showCustomDateForm() replaces
  // the popover's own content (popover.innerHTML = "") SYNCHRONOUSLY inside
  // this same click, which detaches customBtn from the DOM before the click
  // event finishes bubbling. The document-level "click outside closes the
  // popover" listener below then sees a target that's no longer contained
  // in the popover (because it's now an orphaned node, not because the
  // click was actually outside) and closes the popover we just repopulated
  // — a real event-bubbling race, reproduced by clicking through the real
  // UI, not a guess.
  customBtn.onclick = (e) => { e.stopPropagation(); showCustomDateForm(which); };
  popover.appendChild(customBtn);

  const r = anchorEl.getBoundingClientRect();
  popover.style.left = Math.min(r.left, window.innerWidth - 220) + "px";
  popover.style.top = (r.bottom + 6) + "px";
  popover.classList.add("show");
}

document.addEventListener("click", e => {
  if (popover.classList.contains("show") && !popover.contains(e.target) && !e.target.classList.contains("pword-inline")){
    closePopover();
  }
});

function pctLabel(v){ return (v>0?"+":"") + v.toFixed(1) + "%"; }

// Legend merged into the narrative (Alex 2026-09-15): a single shared
// tap-tooltip reused by both the metric name (shows the parameter-meaning
// half) and the "мордочка" icon (shows the full legend sentence). A tap
// tooltip rather than the native `title` attribute — this page runs inside
// a touch-only WebView with no hover state, so `title` would never show.
const metricTooltip = document.getElementById("metricTooltip");
// clickEvent is optional — when given (a face tap), the anchor RECT is the
// tapped feature's own <svg> (the whole face), not just the tapped point,
// so the box clears the entire face and can't land on a neighbouring
// feature; the metric-name/мордочка callers in the narrative pass no click
// event and anchor to their own element's rect, as before.
// Flexible above/below placement (Alex 2026-09-16: "надписи перекрывают
// объект который они объясняют" — the old rule always clamped to
// window-top when there wasn't room above, which is exactly what let the
// box land ON the thing it explains; superseded here, not the earlier
// "prefer above" rule itself, which still wins whenever it actually fits).
// Real measured space, not a guess: place above when it fits; else below
// when THAT fits; only when neither does (a very short viewport) pick
// whichever side has more room and accept the smaller residual overlap —
// height is read via offsetHeight after the real text is already in the
// box, since length varies a lot row to row and a fixed guess would be
// wrong about as often as it was right.
function showMetricTooltip(anchorEl, text, clickEvent){
  metricTooltip.textContent = text;
  metricTooltip.hidden = false;
  const h = metricTooltip.offsetHeight;
  const rect = clickEvent
    ? (anchorEl.closest("svg") || anchorEl).getBoundingClientRect()
    : anchorEl.getBoundingClientRect();
  const gap = 8;
  const left = Math.max(6, Math.min(
    clickEvent ? clickEvent.clientX : rect.left,
    window.innerWidth - 330
  ));
  const spaceAbove = rect.top - gap;
  const spaceBelow = window.innerHeight - rect.bottom - gap;
  let top;
  if (spaceAbove >= h) top = rect.top - h - gap;
  else if (spaceBelow >= h) top = rect.bottom + gap;
  else top = (spaceAbove >= spaceBelow)
    ? Math.max(6, rect.top - h - gap)
    : Math.min(window.innerHeight - h - 6, rect.bottom + gap);
  metricTooltip.style.left = left + "px";
  metricTooltip.style.top = top + "px";
}
document.addEventListener("click", e => {
  if (!metricTooltip.hidden && !metricTooltip.contains(e.target) && !e.target.closest(".metric-name, .feature-icon, [data-feature]")){
    metricTooltip.hidden = true;
  }
});

// Chernoff-face profile (replaces buildRadar() above, 2026-09-13 — see
// scratchpad/chernoff_full_v4.py for the full derivation/road-test history:
// a self-referential diffScale bug on early/late, a "size only" legibility
// complaint fixed by switching eye-openness/nose to shape/angle channels, a
// left/right symmetry rework so each side reacts to its OWN metric
// (early->left, late->right) via the same norm() every other feature uses
// instead of a relative skew ratio, and a geometry-safety clamp layer so
// amplifying the response range can't make a brow line cross into an eye).
// CH_FEATURES/CH_SYMMETRIC is a config table on purpose (Alex 2026-09-12:
// "чтобы в последствии было просто переназначать черты лица конкретным
// переменным, и отдельно изменять коэффициенты для каждой из черт") —
// reassign a feature to a different metric by changing its "metric" field;
// change how strongly ONE feature reacts by changing its own "amp", without
// touching any other feature.
const CH_FAV = {}; METRICS.forEach(m => { CH_FAV[m.key] = m.favorable; });
// earlyMode/lateMode aren't among the 9 METRICS (they're derived straight
// from the raw errors — see modeOfSide() above), so they need their own
// favorable-direction entries here: smaller = closer to a clean three = better.
CH_FAV.earlyMode = "down";
CH_FAV.lateMode = "down";
// "down" here isn't a real value-judgment on which side you lean toward —
// it's just the internal convention that makes chSym()'s bad=1-chNorm(...)
// math point the right direction (higher share -> more strain on that
// side's eye-openness). See CH_SYMMETRIC.eyeOpen below.
CH_FAV.earlyShare = "down";
CH_FAV.lateShare = "down";
CH_FAV.earlyCV = "down";
CH_FAV.lateCV = "down";
CH_FAV.earlyTail = "down";
CH_FAV.lateTail = "down";

// Fixed, absolute theoretical scale for a metric's raw value — decided
// 2026-09-16 for early/late: "норма" (n=0, undrawn) is the 2.500-3.500s
// window around the 3.000s aim, and 500ms is the edge of it ("если человек
// более-менее нормален, полсекунды он точно способен различить" — beyond
// that the deviation reads as unambiguous, n=1, clamped). Replaces chNorm()'s
// default RELATIVE scale (sized off whatever the two currently-compared
// periods happen to contain) for exactly the keys listed here; every other
// key not yet given a theoretical bound still uses the relative fallback.
// Theoretical geometric CV of pure zero-mean Gaussian motor noise, with NO
// systematic bias and no outliers — i.e. the ceiling for "just hand tremor,
// nothing structured" (Alex 2026-09-16: "чистый шум это абсолютный минимум
// т.е. экстремальное состояние черты, которое должно случаться крайне
// редко" — confirmed as the EXTREME/n=1 end, not the neutral middle: real
// players correct/control at least somewhat, so hitting genuine pure-noise
// scatter should be rare). Derivation: for X = σ·|Z| (Z standard normal,
// any σ), Var(ln X) = Var(ln|Z|) — σ drops out entirely, so this is a
// universal constant, independent of precision level. Z² ~ χ²(1), and for a
// χ²(k) variable Var(ln X) = trigamma(k/2); at k=1, trigamma(1/2) = π²/2,
// so Var(ln|Z|) = π²/8, std = π/(2√2) ≈ 1.1107, and
// GCV = (e^std − 1) × 100 ≈ 203.65%.
const CH_GEOM_CV_PURE_NOISE = (Math.exp(Math.sqrt(Math.PI*Math.PI/8)) - 1) * 100;

const CH_THEORY_MAX = {
  early:     500, // ms
  late:      500, // ms
  // Same physical quantity as early/late (signed ms deviation from the
  // 3.000s aim) — just the near-worst single miss (P3/P97) instead of the
  // typical one — so the same 500ms "reliably distinguishable" edge applies.
  earlyTail: 500, // ms
  lateTail:  500, // ms
  // modeOfSide() picks the most frequent rounded |error| on that side —
  // still the same signed-ms-from-aim quantity, just "most common" instead
  // of "typical"/"near-worst". Same 500ms edge.
  earlyMode: 500, // ms
  lateMode:  500, // ms
  // See CH_GEOM_CV_PURE_NOISE above — same formula, gcv just isn't split by
  // side (early+late combined).
  earlyCV: CH_GEOM_CV_PURE_NOISE, // %
  lateCV:  CH_GEOM_CV_PURE_NOISE, // %
  gcv:     CH_GEOM_CV_PURE_NOISE, // %
  // earlyShare/lateShare/focus/consist/hit/eff are all count/total ratios —
  // bounded 0-1 (or 0-100, depending which unit metricsFor() stores them
  // in) by construction, no theoretical DECISION needed the way early/late
  // or the CV family needed one (Alex 2026-09-16: "если в процентах...
  // вопрос отпадает" — true for an actual proportion, unlike CV/gcv, which
  // are ALSO percent-valued but are a coefficient of variation, not a
  // share). Originally left OUT of this table on the assumption that
  // chNorm()'s relative fallback (divide by max(before,after)*1.15) would
  // behave the same as a real fixed bound "in the typical case" — checked
  // that live and it's WRONG: the relative fallback divides by the
  // player's own HISTORICAL max for that metric, which is very often well
  // under 1/100, so the same raw value reads as a much bigger fraction on
  // the relative scale than it would on the true 0-1/0-100 scale. Added
  // here for real, now that the gap is actually confirmed, not assumed.
  earlyShare: 1,   // fraction, 0-1
  lateShare:  1,   // fraction, 0-1
  focus:      100, // %
  consist:    100, // %
  hit:        100, // %
  eff:        100, // %
};
function chNorm(key, set_, before, after){
  let f;
  if (CH_THEORY_MAX[key] != null){
    f = (set_[key]||0) / CH_THEORY_MAX[key];
  } else {
    const mx = Math.max(before[key]||0, after[key]||0, 1e-9) * 1.15;
    f = (set_[key]||0) / mx;
  }
  if (CH_FAV[key] === "down") f = 1 - f;
  return Math.max(0, Math.min(1, f));
}
function chOverall(set_, before, after){
  const keys = Object.keys(CH_FAV);
  return keys.reduce((s,k) => s + chNorm(k, set_, before, after), 0) / keys.length;
}

const CH_AMP = 2.2; // road-tested amplitude multiplier (Alex 2026-09-13: "сильнее меняй... расширь диапазон на 20")
// pupilR removed from here (Alex 2026-09-14: pupils now need their OWN
// left/right values, not one shared number — see CH_SYMMETRIC.pupil below).
// smile moved off "__overall__" onto "lucky" directly (Alex 2026-09-14:
// "коэфициент удачи жестко закрепляю за ртом. чем выше коэфициент тем
// сильнеей улыбка").
const CH_FEATURES = {
  eyeDx:       {metric:"focus",       mode:"centered",        base:20.0, amp:11   * CH_AMP},
  noseTilt:    {metric:"consist",     mode:"inverted_direct", base:0.0,  amp:22   * CH_AMP},
  scaleFactor: {metric:"gcv",         mode:"centered",        base:1.0,  amp:0.30 * CH_AMP},
  // eccFactor used to be range_span — that's now split into earlyTail/
  // lateTail on the ears instead (Alex 2026-09-14: range_span was already
  // computed as P3+P97, i.e. two side-specific numbers just summed together
  // — un-summing them gives ears a real paired statistic for free, no new
  // math invented). Head roundness picks up hit instead, freed by that move.
  eccFactor:   {metric:"hit",         mode:"centered",        base:1.0,  amp:0.30 * CH_AMP},
  mouthLen:    {metric:"eff",         mode:"centered",        base:20.0, amp:16   * CH_AMP},
  smile:       {metric:"lucky",       mode:"centered",        base:0.0,  amp:44   * CH_AMP},
};
// Symmetric features: left half reacts to metricL, right half to metricR —
// each independently, via the SAME chNorm() used everywhere else (not a
// relative skew between the two) — so "how far off is early" and "how far
// off is late" each show up on their own side of the face.
// pupil (Alex 2026-09-14): left pupil <- earlyMode (most frequent early
// error), right pupil <- lateMode (most frequent late error) — closer to
// zero (a clean three) on that side = bigger pupil on that side, a POSITIVE
// read ("bigger = better, more adapted to your own quirks" — his words).
// mode:"div_inverse" is deliberately NOT the same linear base-bad*amp
// formula brow/eyeOpen use — Alex explicitly asked for DIVISION ("С
// ДЕЛЕНИЕМ!!!!"): 1/(x+eps) so a mode that's genuinely near zero produces a
// much sharper jump in size than the same absolute improvement further from
// zero would, instead of scaling flat. See chDivCurve() below.
// eyeOpen reacts to earlyShare/lateShare (how OFTEN each side happens), NOT
// early/late (how BIG it is) — that used to be the SAME pair brow uses,
// meaning one parameter (early/late magnitude) drove two different facial
// features at once. eyeWidth reacts to earlyCV/lateCV (Alex 2026-09-14: eye
// width is a PAIRED feature — two eyes — so it needs its OWN paired
// early/late statistic, not the single "hit" value it briefly had; hit is
// a single number applied identically to both eyes, which breaks "paired
// feature needs a paired parameter"). Four distinct statistics now cover
// all five paired features: magnitude (brow), frequency (eyeOpen), spread
// (eyeWidth), worst case (ears), mode (pupil) — each row in CH_LEGEND maps
// to exactly one feature, each feature to exactly one parameter.
// ears (new, real Chernoff-methodology feature — the original 1973 face has
// ~18 possible parameters, ears among them, we just hadn't drawn them):
// left ear <- earlyTail (your single worst miss caused by rushing), right
// <- lateTail (worst miss caused by over-relaxing). "bad_direct" like brow —
// bigger tail magnitude = worse = bigger ear (unlike pupils, where bigger
// is deliberately the GOOD direction — ears follow the same polarity as
// brow/eyeWidth instead: bigger/more prominent = worse control).
const CH_SYMMETRIC = {
  brow:     {metricL:"early",      metricR:"late",     mode:"bad_direct",  base:0.0,  amp:14  * CH_AMP},
  eyeOpen:  {metricL:"earlyShare", metricR:"lateShare", mode:"bad_inverse", base:13.0, amp:9   * CH_AMP},
  eyeWidth: {metricL:"earlyCV",    metricR:"lateCV",    mode:"bad_inverse", base:11.5 + 3.5*CH_AMP, amp:7 * CH_AMP},
  ears:     {metricL:"earlyTail",  metricR:"lateTail",  mode:"bad_direct",  base:5.0,  amp:6   * CH_AMP},
  pupil:    {metricL:"earlyMode",  metricR:"lateMode",  mode:"div_inverse", base:2.6,  amp:3.2 * CH_AMP},
};
// Eye-openness floor (Alex 2026-09-15: "размер зрачка а стало быть и глаза
// надо ограничить нижним порогом... зрачок вроде расширяется но слишком
// мелок чтобы оценить"). Pupils are STRICTLY capped at openL/R-1.5 (never
// bigger than the eye — see chFaceGeometry below), so if the eye is allowed
// to squint all the way down to its old floor (2.5), the pupil's own
// natural range (2.6-9.64, from CH_SYMMETRIC.pupil above) gets crushed into
// a sliver too small to actually see moving. Raising the floor here leaves
// enough headroom (floor-1.5 = 6.0) for the pupil demo to stay legible even
// at the eye's own worst squint — a bit less dramatic for eyeOpen's OWN
// extreme, but that's the accepted trade so pupils are always readable too.
const CH_EYE_OPEN_FLOOR = 7.5;
// Sharpness of the pupil's division curve — smaller = more dramatic spike
// as the mode approaches zero. Not yet visually tuned against a real
// player's data; revisit once Alex looks at it live.
const CH_PUPIL_DIV_EPS = 0.18;
// Canvas-boundary safety for the head ellipse + ears (Alex 2026-09-15:
// "мордочки сделай чуть побольше, но так чтобы даже в самом раздутом
// состоянии они не выходили за границы своей области"). Every chFaceSvg()/
// chApplySvgParams() call in this file uses a fixed cx=110 on the 220x220
// viewBox (chFaceParamsAt() itself never receives cx/cy, so this hardcodes
// that same fixed center horizontally — if a future caller ever draws a
// face off-center, this clamp would need cx threaded through instead). cy
// is NO LONGER fixed — see CH_HEAD_BOTTOM_Y below — but CH_CANVAS_HALF is
// kept as the horizontal half-canvas constant since cx still uses it.
// CH_FACE_MARGIN leaves a hairline before the actual edge so the ellipse's
// own stroke width doesn't touch it. Found while sizing this up: the OLD
// formula's own worst case (scaleFactor and eccFactor pushed to their
// independent extremes at once — real, since they come from different
// metrics) already computed a head radius of ~101 with ears out to ~119,
// well past the 110-unit half-canvas — silently clipped by the SVG's
// default overflow:hidden, just never large enough for it to be obvious.
const CH_CANVAS_HALF = 110;
const CH_FACE_MARGIN = 4;
// Bottom (chin) edge of the head is pinned to this SAME y on every render,
// regardless of headH — RESTORED 2026-09-18 (a same-day round-trip: briefly
// flipped to a top-pin, see the dead-end reasoning that used to live here,
// then reverted hard — Alex: "морда должны быть выровнены по нижнему,
// блядь, краю... я тебе пятисотый раз уже это говорю" — bottom-alignment
// between the two side-by-side faces is the settled, repeatedly-stated
// rule, not up for renegotiating). The "gap above/below the head must be
// minimal AND constant" ask that motivated the brief top-pin detour is now
// solved a different way instead — see the dynamic square/viewBox sizing
// in chFaceSvg()/chApplySvgParams() below, which crops each face's own
// canvas snugly around whatever its CURRENT head actually is, rather than
// moving the anchor. Set to the canvas's own bottom margin
// (2*CH_CANVAS_HALF - CH_FACE_MARGIN = 216): verified analytically, at
// headH's own ceiling (106) this reproduces cy=110 exactly, the SAME
// center the old symmetric system used at its own worst case (safe,
// 2026-09-15) — every smaller headH only pushes cy further DOWN, away from
// the top edge, never closer to it.
const CH_HEAD_BOTTOM_Y = 2*CH_CANVAS_HALF - CH_FACE_MARGIN;
function chHeadCy(headH){ return CH_HEAD_BOTTOM_Y - headH; }
// headH's own floor, from chFaceParamsAt's `Math.max(CH_HEAD_H_FLOOR, ...)` —
// named just so both the clamp and any future code that needs the same
// worst-case value can't silently drift apart via two separate "45"s.
const CH_HEAD_H_FLOOR = 45;

// Кадр безопасной области. Пунктирный прямоугольник вокруг морды БОЛЬШЕ НЕ
// РИСУЕТСЯ — снят 28.09.2026 по прямому требованию Алекса: «убери нахуй
// пунктирный прямоугольник в который вписывается морда. все остается как
// есть только без прямоугольника». Геометрия при этом не тронута: кадр
// по-прежнему считается и по-прежнему задаёт viewBox, так что размер и
// положение морды на странице ровно те же, что и с рамкой. Убрана только
// сама линия.
//
// Зачем эти границы вообще были введены (Alex 2026-09-18: «морды ни при
// каких условиях не должны выходить за пределы... расстояние до сторон
// квадрата должно быть минимальным в ситуации когда морды раздуты на
// максимум»): [CH_FACE_MARGIN, CH_HEAD_BOTTOM_Y] по обеим осям — не
// догадка, а точная наихудшая граница, которую клампы этого файла уже
// обеспечивают. headW зажат в CH_CANVAS_HALF-CH_FACE_MARGIN минус большее
// ухо (голова с ухом уходит от центра не дальше 106 в каждую сторону), низ
// головы приколот к CH_HEAD_BOTTOM_Y, верх зажат так же по вертикали.
// Остальные черты проверены отдельно: eyeDx на максимуме (~32) плюс
// максимальный радиус глаза (~19) дают всего cx±51, а рот и нос уже зажаты
// внутрь самой головы (блок безопасности рта в chFaceGeometry). То есть
// связывающее ограничение — голова с ушами, и на нём держится вся вертикаль
// ниже.

// Вертикальный размер кадра на каждый рендер — обжимает холст вплотную по
// фактической высоте ИМЕННО ЭТОЙ головы (Alex 2026-09-18: «квадрат
// уменьшить по высоте... расстояние до низа морды должно быть таким же как
// до верха»), вместо того чтобы всегда резервировать наихудшую высоту.
//
// Верх кадра совпадает с верхом головы (нулевой зазор) — то же свойство,
// что раньше выполнялось только на потолке headH, распространено на любую
// высоту. Низ всегда приколот к CH_HEAD_BOTTOM_Y, то есть к низу головы
// (chHeadCy() держит это при любом headH) — поэтому две морды рядом делят
// одну нижнюю линию, как бы ни расходились их высоты. Над верхом кадра
// остаётся тот же волосок CH_FACE_MARGIN, что был и раньше: он держит
// запас под обводку головы, чтобы та не обрезалась о границу viewBox.
function chFaceCanvasBox(headH){
  const headTop = CH_HEAD_BOTTOM_Y - 2 * headH;
  const viewBoxY = headTop - CH_FACE_MARGIN;
  const viewBoxH = (2 * CH_CANVAS_HALF) - viewBoxY; // canvas BOTTOM stays fixed at 220, same as always
  return { viewBoxY, viewBoxH };
}

// Invisible fat hit-targets for the three stroke-only, fill:none features
// (brow lines, nose lines, the mouth path) — real bug, found by testing
// live: a `fill="none"` line/path only has a clickable area on the drawn
// stroke itself (~2-3px wide); anywhere near it but not exactly ON it
// falls through to whatever's painted underneath, which for the WHOLE
// interior of the face is the head ellipse's own solid fill — so tapping
// slightly off the mouth or nose (easy to do, they're thin) actually
// tapped "headW headEcc" and fired the head-size demo instead (Alex
// 2026-09-16: "клик по носу или рту приводит к анимации размера лица" —
// reproduced by clicking the exact reported spot and reading the tooltip
// that came up: "Error Stability... the head's oval"). Each of these
// draws a second, invisible copy of the same line/path with a much wider
// transparent stroke (stroke="transparent" is still a "painted" value
// under the SVG default pointer-events, unlike stroke="none" — the
// standard trick for a generous invisible hit area) directly after its
// visible sibling, so it's on top for hit-testing at exactly the pixels
// the thin visible stroke doesn't cover. data-hit-overlay marks these so
// chApplySvgParams()'s existing brows[0]/[1] etc. index-based selectors
// (":not([data-hit-overlay])") keep matching exactly the 2 real elements
// they always expected, not 4.
const CH_HIT_STROKE_WIDTH = 16;
function chHitLine(x1, y1, x2, y2, feature){
  return `<line data-feature="${feature}" data-hit-overlay="" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="${CH_HIT_STROKE_WIDTH}" stroke-linecap="round"/>`;
}
function chHitPath(d, feature){
  return `<path data-feature="${feature}" data-hit-overlay="" d="${d}" fill="none" stroke="transparent" stroke-width="${CH_HIT_STROKE_WIDTH}" stroke-linecap="round"/>`;
}
function chDivCurve(badness, eps){
  const b = Math.max(0, Math.min(1, badness));
  const inv = 1/(b+eps) - 1/(1+eps);
  const invMax = 1/eps - 1/(1+eps);
  return invMax > 0 ? Math.max(0, Math.min(1, inv/invMax)) : 0;
}

function chSimpleAtN(cfg, n){
  if (cfg.mode === "centered") return cfg.base + (n-0.5)*cfg.amp;
  if (cfg.mode === "direct") return cfg.base + n*cfg.amp;
  if (cfg.mode === "inverted_direct") return cfg.base + (1-n)*cfg.amp;
}
function chSimple(cfg, set_, before, after){
  const n = cfg.metric === "__overall__" ? chOverall(set_, before, after) : chNorm(cfg.metric, set_, before, after);
  return chSimpleAtN(cfg, n);
}

// chFaceParamsAt(...,override) is the one true geometry function — plain
// rendering calls it with override=null; the legend's "show me how it
// moves" animation (chAnimateLegend() below) calls it every frame with the
// SAME function, override={feature:key,n} or {symmetric:["brow"],n}
// forcing just the one metric's normalized fraction (n, 0..1) to a chosen
// value while every other feature keeps reacting to the real data — so the
// demo can never drift from what real data would actually draw.
// A trait is "in the optimal zone" when its real (never-demo-overridden)
// goodness is within this much of the best possible reading (Alex
// 2026-09-16: "подкрашивать зеленым, когда черта находится в оптимальной
// зоне, скажем +-5% от максимального"). chNorm() already orients every
// metric so n=1 IS "best" (CH_FAV's up/down flip, verified against every
// metric currently in use), so this is just n >= threshold on that same
// scale — no per-metric direction logic needed here. Tightened top-5% ->
// top-3% (Alex 2026-09-18: "сделай так чтобы зеленела при 3%").
const CH_OPTIMAL_THRESHOLD = 0.97;

function chFaceParamsAt(set_, before, after, override){
  const v = {};
  const vReal = {}; // same as v, but NEVER honors override -- see below
  const realNByFeature = {};
  Object.keys(CH_FEATURES).forEach(name => {
    const cfg = CH_FEATURES[name];
    const realN = cfg.metric === "__overall__" ? chOverall(set_, before, after) : chNorm(cfg.metric, set_, before, after);
    const n = (override && override.feature === name) ? override.n : realN;
    v[name] = chSimpleAtN(cfg, n);
    vReal[name] = chSimpleAtN(cfg, realN);
    realNByFeature[name] = realN;
  });

  const forceSym = override && override.symmetric;
  const symBadReal = (metricSide) => 1 - chNorm(metricSide, set_, before, after);
  // side is "L"/"R" so a seesaw demo (see chAnimateLegend) can drive each
  // half with its OWN n instead of forcing both to the same value.
  const symBad = (key, metricSide, side) => (forceSym && forceSym.includes(key)) ? (1 - (side === "L" ? override.nL : override.nR)) : symBadReal(metricSide);
  const badBrowL = symBad("brow", CH_SYMMETRIC.brow.metricL, "L");
  const badBrowR = symBad("brow", CH_SYMMETRIC.brow.metricR, "R");
  const badEyeL = symBad("eyeOpen", CH_SYMMETRIC.eyeOpen.metricL, "L");
  const badEyeR = symBad("eyeOpen", CH_SYMMETRIC.eyeOpen.metricR, "R");
  const badWidthL = symBad("eyeWidth", CH_SYMMETRIC.eyeWidth.metricL, "L");
  const badWidthR = symBad("eyeWidth", CH_SYMMETRIC.eyeWidth.metricR, "R");
  const badPupilL = symBad("pupil", CH_SYMMETRIC.pupil.metricL, "L");
  const badPupilR = symBad("pupil", CH_SYMMETRIC.pupil.metricR, "R");
  const badEarL = symBad("ears", CH_SYMMETRIC.ears.metricL, "L");
  const badEarR = symBad("ears", CH_SYMMETRIC.ears.metricR, "R");
  const dropL_raw = CH_SYMMETRIC.brow.base + badBrowL * CH_SYMMETRIC.brow.amp;
  const dropR_raw = CH_SYMMETRIC.brow.base + badBrowR * CH_SYMMETRIC.brow.amp;
  let openL = CH_SYMMETRIC.eyeOpen.base - badEyeL * CH_SYMMETRIC.eyeOpen.amp;
  let openR = CH_SYMMETRIC.eyeOpen.base - badEyeR * CH_SYMMETRIC.eyeOpen.amp;
  openL = Math.max(CH_EYE_OPEN_FLOOR, openL); openR = Math.max(CH_EYE_OPEN_FLOOR, openR);
  const eyeRxL_raw = CH_SYMMETRIC.eyeWidth.base - badWidthL * CH_SYMMETRIC.eyeWidth.amp;
  const eyeRxR_raw = CH_SYMMETRIC.eyeWidth.base - badWidthR * CH_SYMMETRIC.eyeWidth.amp;
  const pupilRadL = CH_SYMMETRIC.pupil.base + chDivCurve(badPupilL, CH_PUPIL_DIV_EPS) * CH_SYMMETRIC.pupil.amp;
  const pupilRadR = CH_SYMMETRIC.pupil.base + chDivCurve(badPupilR, CH_PUPIL_DIV_EPS) * CH_SYMMETRIC.pupil.amp;
  const earRadL_raw = CH_SYMMETRIC.ears.base + badEarL * CH_SYMMETRIC.ears.amp;
  const earRadR_raw = CH_SYMMETRIC.ears.base + badEarR * CH_SYMMETRIC.ears.amp;

  // Real (never-overridden) anchors — used ONLY by another feature that
  // anatomically attaches to this one (brow sits above the eyes at the same
  // x-offset), so demoing "Eye spacing" can't visibly drag the brow along
  // with it and look like it controls two features at once (Alex 2026-09-14:
  // "какой-то другой параметр регулирует сразу две черты" — real bug, found
  // by literally diffing every row's own DOM footprint against every
  // other row's). The feature being demoed itself still uses the LIVE
  // (possibly overridden) value below, same as always — only the
  // BORROWING feature's math is pinned to reality. Ears are the ONE
  // exception to this pattern (Alex 2026-09-14: "уши должны разъезжаться-
  // съезжаться вместе с головой") — they stay attached to the LIVE headW
  // on purpose, so a "Head width" demo genuinely drags them along, the way
  // real ears would move with a real head.
  const realEyeDx = Math.max(vReal.eyeDx, 14);
  const realOpenL = Math.max(CH_EYE_OPEN_FLOOR, CH_SYMMETRIC.eyeOpen.base - symBadReal(CH_SYMMETRIC.eyeOpen.metricL) * CH_SYMMETRIC.eyeOpen.amp);
  const realOpenR = Math.max(CH_EYE_OPEN_FLOOR, CH_SYMMETRIC.eyeOpen.base - symBadReal(CH_SYMMETRIC.eyeOpen.metricR) * CH_SYMMETRIC.eyeOpen.amp);

  // Geometry-safety clamps (not part of the config -- these always apply,
  // independent of how CH_FEATURES/CH_SYMMETRIC get tuned, and independent
  // of whether the values above came from real data or a forced override):
  const eyeDx = Math.max(v.eyeDx, 14);              // eyes can't touch/cross
  const browHalf = Math.min(14, realEyeDx * 0.6);   // brow's OWN length -- real eyeDx, not live
  const eyeRxL = Math.min(eyeRxL_raw, eyeDx - 3);   // eye can't reach past the midline
  const eyeRxR = Math.min(eyeRxR_raw, eyeDx - 3);
  const dropL = Math.min(dropL_raw, Math.max(4.0, 22 - realOpenL)); // brow can't overlap the eye -- real openL
  const dropR = Math.min(dropR_raw, Math.max(4.0, 22 - realOpenR));
  const eccSafe = Math.max(0.3, v.eccFactor);
  const earRadL = Math.max(2.0, Math.min(earRadL_raw, 26)); // never vanishes, never dwarfs the head
  const earRadR = Math.max(2.0, Math.min(earRadR_raw, 26));
  // Base multipliers raised ~10% (62->68, 82->90) for the "chuть побольше"
  // ask, then clamped against the canvas so the bigger typical case is
  // real but the worst-case extreme stays inside the box instead of
  // growing the overflow further. earRadL/R already computed above -- the
  // clamp has to know the widest ear to keep the ear tip on-canvas too,
  // not just the ellipse itself.
  const headWRaw = Math.max(35, 68 * v.scaleFactor / Math.sqrt(eccSafe));
  const headHRaw = Math.max(CH_HEAD_H_FLOOR, 90 * v.scaleFactor * Math.sqrt(eccSafe));
  const headW = Math.min(headWRaw, CH_CANVAS_HALF - CH_FACE_MARGIN - Math.max(earRadL, earRadR));
  const headH = Math.min(headHRaw, CH_CANVAS_HALF - CH_FACE_MARGIN);

  // "In the optimal zone" flags — RANK-based, not a fixed absolute bar
  // (Alex 2026-09-18, correcting the CH_OPTIMAL_THRESHOLD version above:
  // "все что хуже чем три топ лучших параметров остаётся как есть, все что
  // входит зеленеет" — exactly the 3 BEST-scoring colorable features on
  // THIS face turn green, always exactly 3 of them (never more, never
  // fewer, regardless of how good or mediocre those 3 actually are — no
  // floor, a purely relative top-3). CH_OPTIMAL_THRESHOLD itself is now
  // unused for this (kept, harmless, in case an absolute bar is wanted
  // again later).
  //
  // Scored ALWAYS from the REAL, un-overridden goodness (realNByFeature /
  // chNorm(...) directly), never from the possibly-demo-forced v/symBad
  // values above, so a legend tap that sweeps a feature to its extreme
  // can't shuffle the ranking just because the demo momentarily forced
  // n=1 on the feature being tapped. A shape driven by more than one
  // metric (head: scaleFactor+eccFactor; mouth: mouthLen+lucky; each eye:
  // eyeOpen+eyeWidth) is scored by its WEAKER metric — same "whole shape,
  // not half of it" rule the old threshold version used, just feeding a
  // ranking instead of a yes/no. eyeDx has no shape of its own to color
  // (see chFaceSvg — nothing reads ink('eyeDx')), so it's left out of the
  // ranking pool entirely; its own flag stays around unused, in case a
  // future caller ever needs it.
  const slotScores = {
    noseTilt: realNByFeature.noseTilt,
    head:     Math.min(realNByFeature.scaleFactor, realNByFeature.eccFactor),
    mouth:    Math.min(realNByFeature.mouthLen, realNByFeature.smile),
    browL:    chNorm(CH_SYMMETRIC.brow.metricL, set_, before, after),
    browR:    chNorm(CH_SYMMETRIC.brow.metricR, set_, before, after),
    eyeL:     Math.min(chNorm(CH_SYMMETRIC.eyeOpen.metricL, set_, before, after), chNorm(CH_SYMMETRIC.eyeWidth.metricL, set_, before, after)),
    eyeR:     Math.min(chNorm(CH_SYMMETRIC.eyeOpen.metricR, set_, before, after), chNorm(CH_SYMMETRIC.eyeWidth.metricR, set_, before, after)),
    pupilL:   chNorm(CH_SYMMETRIC.pupil.metricL, set_, before, after),
    pupilR:   chNorm(CH_SYMMETRIC.pupil.metricR, set_, before, after),
    earL:     chNorm(CH_SYMMETRIC.ears.metricL, set_, before, after),
    earR:     chNorm(CH_SYMMETRIC.ears.metricR, set_, before, after),
  };
  const CH_OPTIMAL_TOP_N = 3;
  const topSlots = new Set(
    Object.keys(slotScores)
      .sort((a, b) => slotScores[b] - slotScores[a])
      .slice(0, CH_OPTIMAL_TOP_N)
  );
  const optimal = { eyeDx: realNByFeature.eyeDx >= CH_OPTIMAL_THRESHOLD };
  Object.keys(slotScores).forEach(k => { optimal[k] = topSlots.has(k); });

  return {
    dropL, dropR, openL, openR, eyeRxL, eyeRxR, eyeDx, browHalf,
    browDx: realEyeDx,     // brow lines' own x-anchor -- see comment above
    noseTilt: v.noseTilt,
    headW, headH,
    pupilRadL, pupilRadR,
    earRadL, earRadR,
    mouthLen: Math.max(6, v.mouthLen),
    smile: v.smile,
    optimal,
  };
}
function chFaceParams(set_, before, after){ return chFaceParamsAt(set_, before, after, null); }

// Shared geometry math between chFaceSvg() (builds the initial markup) and
// chApplySvgParams() (updates an already-rendered face frame-by-frame during
// the legend animation) -- one formula, so the two can't quietly drift apart.
function chFaceGeometry(p, cx, cy){
  const eyeY = cy - 14, base = cy - 40;
  // No numeric ceiling any more (Alex 2026-09-17: "если зрачок больше
  // глаза, то его очертания ограничиваются границами глаза, т.е. целиком
  // зрачок не показывается" -- when the pupil's true value is bigger than
  // the eye, don't shrink the VALUE down to fit (that used to flatten
  // every "too big" case into the same fixed-looking circle); draw it at
  // full size and let the eye's own shape clip it visually, so an extreme
  // value still reads as pressing against the eyelid instead of
  // collapsing to a same-size-every-time circle. The clip lives in
  // chFaceSvg/chApplySvgParams (a <clipPath> copy of the eye shape, kept
  // in sync with it every frame) -- this function just hands through the
  // real, unclamped radius.
  const pupilL = p.pupilRadL;
  const pupilRv = p.pupilRadR;
  const tilt = Math.max(-75, Math.min(75, p.noseTilt)) * Math.PI/180;
  const noseLen = 20;
  const ntx = cx, nty = cy + 6;
  const nbx = ntx + noseLen*Math.sin(tilt), nby = nty + noseLen*Math.cos(tilt);
  const fx = nbx + 7*Math.cos(tilt), fy = nby - 7*Math.sin(tilt);

  // Mouth geometry-safety clamps (Alex 2026-09-15: "нос не должен
  // пересекаться со ртом, рот не должен уезжать за границы лица и выше
  // носа"). mouthLen and smile come from their own independent metrics
  // (eff, lucky) with no built-in awareness of the head size (gcv/hit) or
  // nose tilt (consist) computed elsewhere in this same function — an
  // unlucky combination of otherwise-ordinary values (a small head + a
  // wide mouth, or a tilted nose + a deep frown) can push the mouth
  // outside the head ellipse or up into the nose. The mouth's corners sit
  // at a FIXED y (mouthBaseY below); its curve's peak/trough swing up to
  // ±smile/2 from there. Clamped here, once, using the REAL nose/head
  // numbers already computed above (nby/fy/p.headW/p.headH) — so this
  // reacts correctly even mid-demo, when the legend is animating a
  // DIFFERENT feature (e.g. sweeping "Nose tilt" while the mouth sits at
  // its real, non-demoed smile) — same "always live" reasoning the
  // eyeDx/dropL/eyeRxL clamps above already use for anatomically-attached
  // features, just applied to a genuine physical collision instead of a
  // shared-config one. Same approach, same tradeoff already accepted for
  // CH_EYE_OPEN_FLOOR: a bit less range at the extreme so nothing overlaps.
  const mouthBaseY = 40;
  const MOUTH_FACE_MARGIN = 3;   // clearance from the head's own outline
  const MOUTH_NOSE_GAP = 6;      // clearance from the nose's lowest point
  // (a) corners can't reach past the sides of the head at mouth height —
  // fit inside the head ellipse at y=mouthBaseY (headH has its own floor
  // of 45 elsewhere, always > mouthBaseY, so this never divides by ~0).
  const headHSafe = Math.max(p.headH, mouthBaseY + 5);
  const ellipseFrac = Math.max(0, 1 - (mouthBaseY*mouthBaseY)/(headHSafe*headHSafe));
  const maxHalfWidth = Math.max(4, p.headW * Math.sqrt(ellipseFrac) - MOUTH_FACE_MARGIN);
  const mouthLen = Math.min(p.mouthLen, maxHalfWidth * 2);
  // (b) curve can't dip below the chin when smiling big (smile > 0 moves
  // the midpoint DOWN, below the fixed corners — see chFaceParamsAt's own
  // comment on the smile sign convention).
  const maxSmileDown = Math.max(0, 2 * (p.headH - MOUTH_FACE_MARGIN - mouthBaseY));
  // (c) curve can't rise up into the nose when frowning hard (smile < 0
  // moves the midpoint UP, toward the fixed corners and past them) — use
  // the nose's own deepest reach, whichever of its two segments sits
  // lowest (that flips with tilt sign, see the nose-tilt geometry above).
  const noseBottomOffset = Math.max(nby, fy) - cy;
  const minSmileUp = 2 * (noseBottomOffset + MOUTH_NOSE_GAP - mouthBaseY);
  const smile = Math.max(minSmileUp, Math.min(maxSmileDown, p.smile));

  return {eyeY, base, pupilL, pupilRv, ntx, nty, nbx, nby, fx, fy, mouthBaseY, mouthLen, smile};
}

// "Laughing eye" shape for the optimal-zone highlight (Alex 2026-09-16,
// picked option "E" from a 3-way mockup: crescent close to the original "D"
// reference — level corners, mostly-flat bottom, but the outline itself
// FLICKS upward right at each tip, rather than raising the whole corner
// level (that was the rejected middle attempt) or a full symmetric lens
// (the first, over-full attempt)).
//
// Built from two CUBIC segments for the top edge (meeting at the peak,
// (cx, cy-ry) — each one starts at its own corner and curves up with an
// early "hook" tangent) plus one QUADRATIC for the shallow bottom edge.
// Corners sit at plain `cy` (not raised) — the "smiling" read comes purely
// from the hook tangent near each tip, matching "не уровень поднимать, а
// изгибать" (bend the stroke, don't raise the baseline).
//
// True vertical center, closed-form (verified against Python's own min/max-
// of-sampled-points check before landing on this, not assumed): the top
// edge's peak is exactly cy-ry (the two cubics' shared meeting point, and
// neither cubic overshoots past it since its control point sits closer to
// the corner than the endpoint does); the bottom edge never dips below the
// corners' own `cy` (it only bulges partway UP from them, by construction —
// same direction as the top, just shallower), so the shape's bottommost
// point is `cy` itself, at the two corner tips. True center = (cy-ry + cy)/2
// = cy - ry/2 — this is where the pupil has to sit, per Alex's correction
// ("центр это от края до края по вертикали... зрачок должен быть там"),
// not at the original `cy` the plain ellipse used.
const CH_EYE_HOOK_FRAC = 14/45; // tip-flick magnitude, relative to ry (from the approved mockup)
const CH_EYE_BOT_BULGE_FRAC = 0.25; // how far the shallow bottom edge bulges up from the corners, relative to ry
function chEyePupilCenterY(cy, ry){ return cy - ry / 2; }
function chEyeLensPath(cx, cy, rx, ry){
  const hook = CH_EYE_HOOK_FRAC * ry;
  const topPeakY = (cy - ry).toFixed(1);
  const topMidCtrlY = (cy - hook - ry * 0.3).toFixed(1);
  const left = (cx - rx).toFixed(1), right = (cx + rx).toFixed(1);
  const cyf = cy.toFixed(1), cxf = cx.toFixed(1);
  const leftMidX = (cx - rx * 0.6).toFixed(1), leftPeakX = (cx - rx * 0.3).toFixed(1);
  const rightMidX = (cx + rx * 0.6).toFixed(1), rightPeakX = (cx + rx * 0.3).toFixed(1);
  const botCtrlY = (cy - CH_EYE_BOT_BULGE_FRAC * ry).toFixed(1);
  return `M ${left} ${cyf} C ${leftMidX} ${topMidCtrlY}, ${leftPeakX} ${topPeakY}, ${cxf} ${topPeakY} `
       + `C ${rightPeakX} ${topPeakY}, ${rightMidX} ${topMidCtrlY}, ${right} ${cyf} `
       + `Q ${cxf} ${botCtrlY} ${left} ${cyf} Z`;
}

// opts.box — ОБЩИЙ кадр на обе морды (Alex 2026-09-27, шторка). Обычно кадр
// считается от высоты головы этой морды, и у двух периодов он разный: разная
// высота viewBox при одинаковой ширине на экране = разный масштаб и разное
// положение по вертикали. Пока морды стояли рядом, это было незаметно;
// наложенные друг на друга они бы разъехались, и шов показывал бы ступеньку
// вместо перехода. Поэтому buildFaces() считает кадр по БОЛЬШЕЙ из двух голов
// и передаёт его обеим. Кадр запоминается в data-vb-y, чтобы демо-прогон
// легенды (chApplySvgParams) его не пересчитал обратно.
function chFaceSvg(p, cx, faceId, opts){
  const cy = chHeadCy(p.headH);
  const box = (opts && opts.box) || chFaceCanvasBox(p.headH);
  const {eyeY, base, pupilL, pupilRv, ntx, nty, nbx, nby, fx, fy, mouthBaseY, mouthLen, smile} = chFaceGeometry(p, cx, cy);
  const bh = p.browHalf;
  const my = cy + mouthBaseY;
  // Green outline/fill when a trait's real data sits in its optimal zone
  // (p.optimal, see chFaceParamsAt — Alex 2026-09-16). p.optimal is ALWAYS
  // built from the REAL, never-demo-overridden goodness (chFaceParamsAt
  // computes it from realNByFeature/chNorm(...) directly, ignoring
  // `override`) — so it's present here AND on the `p` chAnimateLegend()
  // builds mid-sweep, but chApplySvgParams() (used during that sweep) never
  // touches stroke/fill at all, only position/size — so a legend demo that
  // forces a feature to n=1 moves/resizes the shape without recoloring it,
  // and the color stays correctly anchored to the real data throughout.
  const ink = key => (p.optimal && p.optimal[key]) ? "var(--good)" : "var(--text-primary)";
  // Optimal eyes get the sharp-cornered "lens" shape (chEyeLensPath) instead
  // of the plain ellipse — same rx/ry, so nothing downstream (the pupil
  // clip, chApplySvgParams' size updates below) needs to change, just the outline.
  const eyeShape = (side, cxEye, rxV, ryV) => (p.optimal && p.optimal[side])
    ? `<path data-feature="eyeWidth eyeOpen eyeDx" data-eye-rx="${rxV.toFixed(1)}" data-eye-ry="${ryV.toFixed(1)}" d="${chEyeLensPath(cxEye, eyeY, rxV, ryV)}" fill="#fff" stroke="${ink(side)}" stroke-width="2.2" stroke-linejoin="miter"/>`
    : `<ellipse data-feature="eyeWidth eyeOpen eyeDx" cx="${cxEye.toFixed(1)}" cy="${eyeY}" rx="${rxV.toFixed(1)}" ry="${ryV.toFixed(1)}" fill="#fff" stroke="${ink(side)}" stroke-width="2.2"/>`;
  // data-feature tokens let the legend's tap-to-animate (chAnimateLegend()
  // below) find the right element(s) — some elements carry more than one
  // token because they're the SAME geometry two different config entries
  // drive (e.g. one <ellipse> has both rx from "eyeWidth" and ry from "eyeOpen").
  // Un-stroked, un-filled copy of the same outline, used only as a
  // <clipPath> so an oversized pupil (see chFaceGeometry -- no more radius
  // clamp) gets visually cut off at the eyelid instead of shrunk to fit
  // (Alex 2026-09-17). data-clip-eye lets chApplySvgParams() resize these
  // in place during the legend's demo sweep, same as the visible eye
  // shape itself. IDs carry faceId because this page shows two faces
  // (before/after) at once, in the same document -- unqualified ids would
  // collide and one face's pupils would clip against the OTHER face's eyes.
  const eyeClipShape = (tag, side, cxEye, rxV, ryV) => (p.optimal && p.optimal[side])
    ? `<path data-clip-eye="${tag}" d="${chEyeLensPath(cxEye, eyeY, rxV, ryV)}"/>`
    : `<ellipse data-clip-eye="${tag}" cx="${cxEye.toFixed(1)}" cy="${eyeY}" rx="${rxV.toFixed(1)}" ry="${ryV.toFixed(1)}"/>`;
  const clipIdL = `chEyeClipL-${faceId}`, clipIdR = `chEyeClipR-${faceId}`;
  const browLX1 = (cx-p.browDx-bh).toFixed(1), browLY1 = base.toFixed(1), browLX2 = (cx-p.browDx+bh).toFixed(1), browLY2 = (base+p.dropL).toFixed(1);
  const browRX1 = (cx+p.browDx-bh).toFixed(1), browRY1 = (base+p.dropR).toFixed(1), browRX2 = (cx+p.browDx+bh).toFixed(1), browRY2 = base.toFixed(1);
  const noseBX2 = nbx.toFixed(1), noseBY2 = nby.toFixed(1);
  const mouthD = `M ${(cx-mouthLen/2).toFixed(1)} ${my} Q ${cx} ${(my+smile).toFixed(1)} ${(cx+mouthLen/2).toFixed(1)} ${my}`;
  const pinned = (opts && opts.box) ? ` data-vb-y="${box.viewBoxY.toFixed(1)}"` : "";
  return `<svg viewBox="0 ${box.viewBoxY.toFixed(1)} 220 ${box.viewBoxH.toFixed(1)}"${pinned} class="${(opts && opts.cls) || ""}" style="width:100%; height:auto; display:block;">
    <defs>
      <clipPath id="${clipIdL}">${eyeClipShape("L", "eyeL", cx-p.eyeDx, p.eyeRxL, p.openL)}</clipPath>
      <clipPath id="${clipIdR}">${eyeClipShape("R", "eyeR", cx+p.eyeDx, p.eyeRxR, p.openR)}</clipPath>
    </defs>
    <circle data-feature="ears" cx="${(cx-p.headW).toFixed(1)}" cy="${eyeY}" r="${p.earRadL.toFixed(1)}" fill="var(--surface)" stroke="${ink('earL')}" stroke-width="2"/>
    <circle data-feature="ears" cx="${(cx+p.headW).toFixed(1)}" cy="${eyeY}" r="${p.earRadR.toFixed(1)}" fill="var(--surface)" stroke="${ink('earR')}" stroke-width="2"/>
    <ellipse data-feature="headW headEcc" cx="${cx}" cy="${cy}" rx="${p.headW.toFixed(1)}" ry="${p.headH.toFixed(1)}" fill="var(--surface)" stroke="${ink('head')}" stroke-width="3"/>
    <line data-feature="brow" x1="${browLX1}" y1="${browLY1}" x2="${browLX2}" y2="${browLY2}" stroke="${ink('browL')}" stroke-width="3.4" stroke-linecap="round"/>
    ${chHitLine(browLX1, browLY1, browLX2, browLY2, "brow")}
    <line data-feature="brow" x1="${browRX1}" y1="${browRY1}" x2="${browRX2}" y2="${browRY2}" stroke="${ink('browR')}" stroke-width="3.4" stroke-linecap="round"/>
    ${chHitLine(browRX1, browRY1, browRX2, browRY2, "brow")}
    ${eyeShape('eyeL', cx-p.eyeDx, p.eyeRxL, p.openL)}
    ${eyeShape('eyeR', cx+p.eyeDx, p.eyeRxR, p.openR)}
    <circle data-feature="pupilR" clip-path="url(#${clipIdL})" cx="${(cx-p.eyeDx).toFixed(1)}" cy="${(p.optimal && p.optimal.eyeL ? chEyePupilCenterY(eyeY, p.openL) : eyeY).toFixed(1)}" r="${pupilL.toFixed(1)}" fill="${ink('pupilL')}"/>
    <circle data-feature="pupilR" clip-path="url(#${clipIdR})" cx="${(cx+p.eyeDx).toFixed(1)}" cy="${(p.optimal && p.optimal.eyeR ? chEyePupilCenterY(eyeY, p.openR) : eyeY).toFixed(1)}" r="${pupilRv.toFixed(1)}" fill="${ink('pupilR')}"/>
    <line data-feature="noseTilt" x1="${ntx}" y1="${nty}" x2="${nbx.toFixed(1)}" y2="${nby.toFixed(1)}" stroke="${ink('noseTilt')}" stroke-width="2" stroke-linecap="round"/>
    ${chHitLine(ntx, nty, noseBX2, noseBY2, "noseTilt")}
    <line data-feature="noseTilt" x1="${nbx.toFixed(1)}" y1="${nby.toFixed(1)}" x2="${fx.toFixed(1)}" y2="${fy.toFixed(1)}" stroke="${ink('noseTilt')}" stroke-width="2" stroke-linecap="round"/>
    ${chHitLine(noseBX2, noseBY2, fx.toFixed(1), fy.toFixed(1), "noseTilt")}
    <path data-feature="mouthLen smile" data-cx="${cx}" data-y="${my}" data-mouth-len="${mouthLen.toFixed(1)}" data-smile="${smile.toFixed(1)}" d="${mouthD}" fill="none" stroke="${ink('mouth')}" stroke-width="3.2" stroke-linecap="round"/>
    ${chHitPath(mouthD, "mouthLen smile")}
  </svg>`;
}
