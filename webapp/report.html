<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play of Time — Your Results</title>
<style>
  /* Single-theme cream page (Alex 2026-09-15: "убери жёлтую подложку, а
     кремовую раздвинь до границ экрана" — the darker amber #F2B70D page
     background from the 09-13 card redesign is gone; --page now equals
     --surface's own cream, so the reading area reaches the full screen edge
     to edge instead of floating as a bordered/shadowed box on a darker page.
     --border/--shadow-* stay as they were — a popover or tooltip floating
     ABOVE the (now uniformly cream) page still reads as distinct via its own
     border + real drop-shadow, not via a background-color difference. Still
     single-theme, still no dark-mode variant — that part of the 09-12
     instruction stands.) */
  .viz-root {
    color-scheme: light;
    --page:           #FBE7A6;
    --surface:        #FBE7A6;
    --text-primary:   #2A1E00;
    --text-secondary: rgba(42,30,0,0.72);
    --text-muted:     rgba(42,30,0,0.55);
    --gridline:       rgba(42,30,0,0.14);
    --baseline:       rgba(42,30,0,0.30);
    --border:         rgba(42,30,0,0.14);
    --shadow-sm:      0 1px 2px rgba(42,30,0,0.06);
    --shadow-lg:      0 14px 32px rgba(42,30,0,0.16);
    --good:           #1F7A3D;
    --critical:       #A6392C;
    /* Legend-row tap highlight on the faces — deliberately NOT good/critical
       (those mean favorable/unfavorable; this just means "look here"). */
    --ch-highlight:   #1D6FA8;
    /* Warm olive marker used only for the narrative h4 border-left accent
       now (the legend dots + radar profile shapes that used to share this
       color family were removed with buildRadar() on 2026-09-13, when the
       Chernoff-face profile replaced it). */
    --before-mark:    #9C8A3D;
    --chip-bg:        rgba(42,30,0,0.09);
    --chip-bg-active: #2A1E00;
    --chip-fg-active: #F2B70D;
  }

  * { box-sizing: border-box; }
  /* UA default body margin (8px) was never reset here -- inside the native
     WebView (transparent background, sits on a near-black dialog panel,
     see ReportDialog in LeaderboardScreen.kt) that stray margin let the
     black panel show through as a thin band above the cream page. Harmless
     in a real browser tab (just 8px of extra white), a real bug in-app. */
  html, body { margin: 0; }
  .viz-root {
    background: var(--page);
    color: var(--text-primary);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
    /* Alex 2026-09-15: "уменьши отступы бежевой плашки от краев экрана в
       два раза" -- halved on every edge (was 34px / clamp(14px,3vw,36px) /
       64px). */
    padding: 17px clamp(7px, 1.5vw, 18px) 32px;
  }
  /* Widened from 640px (Alex 2026-09-15: "за счёт этого в принципе расширь
     ширину" — freed up now that the card no longer needs to visually float
     as a bordered box on a darker page, see .card below). Still capped, not
     removed outright — this page's real, primary home is the in-app WebView
     popup (a phone-width Dialog, see ReportDialog in LeaderboardScreen.kt),
     where a max-width this size never actually binds; the cap only matters
     when the page is opened in a real desktop browser tab. */
  .wrap{ max-width: 880px; margin: 0 auto; }

  /* Title now spans the full row on its own line, lang toggle directly
     underneath it (Alex 2026-09-15: "заголовок... на всю ширину строки,
     спустив переключатель языков сразу под заглавие") — supersedes the
     2026-09-13 side-by-side layout this replaced. #langSeg itself is still
     only POPULATED once buildLangSeg() runs after load, this just fixes
     where that slot lives. */
  .title-row{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  /* Fluid, not fixed (Alex 2026-09-15: "пусть в первой строчке уместятся
     четыре слова your play of time results") — a flat 27px wrapped to two
     lines once the card's own horizontal padding was halved (below) and
     narrowed the content column on a phone-width viewport. clamp() scales
     with the viewport instead of a single breakpoint, so it keeps fitting
     on one line down to genuinely narrow widths instead of just the one
     size that happened to have been tested. */
  h1{ font-size: clamp(19px, 6.2vw, 27px); font-weight: 780; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
  .lede{ color: var(--text-secondary); font-size: 14.5px; max-width: 58ch; margin: 8px 0 4px; }
  .sample-note{ font-size: 12px; color: var(--text-muted); max-width: 58ch; margin: 6px 0 0; font-style: italic; }

  /* No longer a floating bordered/shadowed box (Alex 2026-09-15: "убери
     желтую подложку, а кремовую раздвинь до границ экрана") — page and card
     are now the same cream color (see --page/--surface above), so a card
     outline here would just draw an unwanted seam down the middle of an
     otherwise uniform background. Padding stays, for the same breathing
     room the content always had.
     2026-09-15: "плашку надо и расширить и повысить... по ширине уменьши
     поля в два раза" — horizontal padding halved (16-28px clamp → 8-14px)
     to use more of the available width; top padding also cut (18px → 10px,
     asymmetric — bottom keeps its own room) so the title sits higher,
     matching the same "use the available space" ask. */
  .card{
    padding: 10px clamp(8px, 2vw, 14px) 18px;
  }
  .card + .card{ margin-top: 12px; }

  .seg{ display:inline-flex; background:var(--chip-bg); border-radius:999px; padding:3px; gap:2px; flex:none; }
  .seg button{
    font: inherit; font-size: 13px; font-weight: 600; border: none; cursor: pointer;
    padding: 6px 16px; border-radius: 999px; background: transparent; color: var(--text-secondary);
  }
  .seg button.active{ background: var(--chip-bg-active); color: var(--chip-fg-active); }

  .periods{ display:grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  @media (max-width: 620px){ .periods{ grid-template-columns: 1fr; } }
  .period-box{ border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .period-box .ptitle{ font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 10px; }
  .presets{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom: 10px; }
  .chip{
    font: inherit; font-size: 12px; font-weight: 600; border: 1px solid var(--border); cursor: pointer;
    padding: 5px 11px; border-radius: 999px; background: var(--chip-bg); color: var(--text-secondary);
  }
  .chip.active{ background: var(--chip-bg-active); color: var(--chip-fg-active); border-color: transparent; }
  .date-row{ display:flex; align-items:center; gap:8px; }
  .date-row input[type=date]{
    font: inherit; font-size: 13px; color: var(--text-primary); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px;
    font-variant-numeric: tabular-nums;
  }
  .date-row .to{ color: var(--text-muted); font-size: 12px; }
  .range-summary{ margin-top: 8px; font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .range-summary b{ color: var(--text-secondary); font-weight: 600; }

  /* Кликабельные слова-периоды прямо в предложении — основной способ задать
     период; текст и график читаются на одном экране без переключения вкладок
     (Alex 2026-09-08). */
  .period-words{
    font-size: 15px; margin: 4px 0 18px; color: var(--text-secondary);
  }
  .pword{
    font: inherit; font-weight: 700; color: var(--text-primary); background: none;
    border: none; border-bottom: 2px solid transparent; cursor: pointer;
    padding: 0 1px; margin: 0 1px;
  }
  .pword:hover{ color: var(--good); }
  .pword.active{ color: var(--good); border-bottom-color: var(--good); }

  .advanced-toggle{
    font: inherit; font-size: 12px; color: var(--text-muted); background:none; border:none;
    cursor:pointer; text-decoration: underline; text-underline-offset: 2px; padding: 0;
  }
  .periods{ display:none; }
  .periods.show{ display:grid; }

  .narrative{
    font-size: 14.5px; line-height: 1.6; color: var(--text-secondary);
  }
  .narrative b{ color: var(--text-primary); }
  .narrative h4{
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin: 20px 0 8px; padding-left: 10px;
    border-left: 3px solid var(--before-mark);
  }
  .narrative h4:first-child{ margin-top: 0; }
  .narrative p{ margin: 0 0 8px; }
  .narrative .cross-link{
    display: block; margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed var(--border); color: var(--text-secondary); font-style: italic;
  }
  /* Заголовок — обычное предложение ("Игрок «n»: сегодня по сравнению с ...»),
     а не служебный ярлык — слова-периоды подчёркнуты и кликабельны прямо в
     тексте (Alex 2026-09-08: "не просто в заголовке пишешь... слова подчёркиваешь
     по тапу выводишь доступные периоды"). Redesign 2026-09-13: lives directly
     on the card now (was nested inside .narrative, which moved to the second
     card) — it's the control for BOTH cards' data, so it sits with the
     headline/tiles it visually governs, not buried in the deep-dive text. */
  /* Pinned header — just the faces now (Alex 2026-09-13, restructure: period
     pickers moved to live under each face as its own clickable label instead
     of a separate sentence above; see .face-label below). Negative margin +
     matching padding extends the background to cover the card's own
     left/right padding too, so scrolled content can't peek out from under
     the sides of the pinned bar. */
  .sticky-top{
    position: sticky; top: 0; z-index: 5;
    background: var(--surface);
    margin: 0 -24px; padding: 0 24px 6px;
  }
  /* Shared clickable-underline look for anything that opens the period
     popover — the two face-label buttons now (see .face-label below); kept
     as its own class since the popover's own outside-click-closes check
     (see "pword-inline" below in the script) still keys off it. */
  .pword-inline{
    font: inherit; font-weight: 700; color: var(--text-primary); background: none;
    border: none; cursor: pointer; padding: 0; margin:0;
    text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px;
  }
  .pword-inline:hover{ color: var(--good); }

  .popover{
    position: fixed; z-index: 40; display:none; min-width: 180px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,.2); padding: 6px;
  }
  .popover.show{ display:block; }
  .popover button.opt{
    display:block; width:100%; text-align:left; font: inherit; font-size: 13px;
    padding: 8px 10px; border:none; background:none; cursor:pointer; border-radius: 7px;
    color: var(--text-primary);
  }
  .popover button.opt:hover{ background: var(--chip-bg); }
  .popover button.opt:disabled{
    color: var(--text-muted); cursor: not-allowed; opacity: .5;
  }
  .popover button.opt:disabled:hover{ background: none; }
  .popover .pdivider{ height:1px; background:var(--gridline); margin:5px 2px; }
  .popover .custom-row{ display:flex; gap:6px; padding: 6px 8px 2px; }
  .popover .custom-row input[type=date]{
    font: inherit; font-size: 12.5px; color: var(--text-primary); background: var(--page);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; width: 100%;
  }
  .popover .apply-btn{
    display:block; width: calc(100% - 16px); margin: 6px 8px 2px; text-align:center;
    font: inherit; font-size: 12.5px; font-weight:700; color: var(--chip-fg-active);
    background: var(--chip-bg-active); border: none; border-radius: 7px; padding: 7px; cursor:pointer;
  }
  /* .month-nav is now ONLY the persistent header pager (periodNavArrow()) —
     the popover used to have its own internal prev/next+Apply picker here
     too (Alex 2026-09-14), removed 2026-09-15 as a redundant second pager
     duplicating the header one. */
  .month-nav{
    font: inherit; font-size: 15px; font-weight: 700; color: var(--text-primary);
    background: var(--chip-bg); border: none; border-radius: 6px; width: 28px; height: 28px; cursor: pointer;
  }
  .month-nav:disabled{ color: var(--text-muted); cursor: not-allowed; opacity: .5; }

  /* Chernoff-face profile — replaces the radar/profile chart entirely
     (Alex 2026-09-13: "да, конечно заменяют. графики убираем"). Each of the
     9 metrics drives one facial feature (see the CH_FEATURES/CH_SYMMETRIC
     config + chFaceParams()/chFaceSvg() in the script below) instead of a
     9-axis polygon — the whole point is that "better/worse overall" reads
     as a gestalt at a glance, no per-axis reading required. The exact
     feature<->metric mapping and its "How to read" text live in a collapsed
     <details> so returning users aren't forced to re-see it every time
     (same pattern as the "Show as table" toggle below), while first-time/
     curious users can expand it. */
  /* Enlarged + made genuinely responsive (Alex 2026-09-13: "уже мелковато, а
     при переносе на мобилку будет совсем сложно" — the faces are the whole
     point of this page, they need to actually be legible, not a fixed small
     pixel size that's cramped everywhere). flex:1 1 0 + min-width:0 splits
     the row evenly and lets each face's own width:100% SVG (see chFaceSvg)
     shrink to whatever a narrow phone actually has room for — never
     overflows — while the raised max-width lets it grow noticeably bigger
     on anything wider than a phone. */
  /* ИСТОРИЯ, БОЛЬШЕ НЕ ДЕЙСТВУЕТ (снято 27.09.2026 при переходе на шторку —
     столбцов .faces-row/.face-visual/.face-labels-row больше нет, морды лежат
     друг на друге в одном кадре с общим viewBox). Оставлено, чтобы было
     видно, какую задачу решала прежняя раскладка и почему её не надо
     возвращать по частям.
     2026-09-18: restructured into TWO separate flex rows — .faces-row (just
     the two SVGs) and .face-labels-row (just the two labels), instead of
     one row of [svg+label] columns. Needed because aligning the OLD
     combined columns by flex-end (tried first) aligned the columns'
     OVERALL bottoms — svg+label together — which over-corrected: a
     shorter square got pushed down by its own label-row's height
     difference too, on top of the square-height difference, breaking the
     "minimal gap above a small head" property this was supposed to
     preserve. Isolating the SVGs into their own row means flex-end there
     aligns ONLY the squares' own bottoms with each other — precisely
     "морда должны быть выровнены по нижнему краю" (Alex 2026-09-18) — with
     nothing else able to perturb that. #faces itself is now just a plain
     wrapper around both rows, no flex of its own.
     Trade-off, stated plainly (not hidden): when the two current heads are
     genuinely different sizes, the SMALLER one's own top-gap-to-caption
     will show some extra space proportional to how much smaller it is
     than its sibling THIS render — there's no way to have both squares'
     bottoms coincide AND both squares' tops sit at one single fixed
     distance from one shared caption line unless the two heads happen to
     be the same size. This is much smaller in practice than the old
     worst-case-sized gap (tens of px, not ~137px), and only shows up when
     the two periods being compared actually differ in head size. */
  .faces-wrap{ margin: 0; }
  /* ШТОРКА (Alex 2026-09-27: «сделать слайдер, который позволяет при помощи
     ручного свайпа как бы сдвигать занавеску»). Было: два столбца, в каждом
     своя морда, рядом. Стало: один кадр, обе морды друг на друге, между ними
     подвижная граница.
     Слой актуального периода лежит В ПОТОКЕ — он и задаёт высоту кадра;
     слой периода сравнения накрыт поверх него абсолютно. Порядок в DOM
     сохранён прежний (сначала A/актуальный, потом B/сравнение): по нему
     render() ключует state.lastFaces для анимации легенды, z-index решает
     видимость, а не порядок узлов.
     Обе морды рисуются в ОДНОМ viewBox (см. buildFaces) — иначе при разных
     размерах головы слои разъезжались бы по вертикали и масштабу, и на шве
     была бы ступенька вместо перехода. */
  .faces-stage{
    position: relative;
    width: min(300px, 100%);
    margin: 0 auto;
    touch-action: pan-y;          /* вертикальный скролл страницы живёт, горизонталь забираем себе */
    cursor: ew-resize;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Данных на одной из сторон нет — тянуть нечего. */
  .faces-stage.single{ cursor: default; }
  .face-layer{ display:block; width:100%; height:auto; }
  .face-layer.now{
    position: relative; z-index: 2;
    clip-path: inset(0 calc(100% - var(--curtain, 100%)) 0 0);
    /* НЕПРОЗРАЧНЫЙ фон обязателен. SVG сам по себе прозрачный, и без фона
       нижний слой просвечивал сквозь верхний: у двух периодов головы разного
       размера, поэтому было видно ДВА контура головы и по два уха — лицо
       выглядело двоящимся (Alex 2026-09-27). clip-path режет и фон тоже,
       так что закрашивается ровно та половина кадра, которую занимает
       верхний слой, а не весь кадр. */
    background: var(--surface);
  }
  .face-layer.past{ position:absolute; inset:0; width:100%; height:100%; z-index:1; }
  .faces-stage.single .face-layer.now{ clip-path: none; }
  /* Шов виден только когда он РАЗДЕЛЯЕТ две морды. У края разделять нечего:
     там он был просто вертикальной палкой по границе рамки (Alex 2026-09-27,
     по скриншоту). Поэтому на краях он гаснет, а ручка остаётся — она и есть
     подсказка, что кадр можно потянуть. */
  .face-seam{
    position:absolute; top:0; bottom:0; left: var(--curtain, 100%);
    width:2px; margin-left:-1px; background: var(--text-primary);
    z-index:3; pointer-events:none;
    opacity:1; transition: opacity .2s ease;
  }
  .faces-stage[data-edge="1"] .face-seam{ opacity:0; }
  /* Шов и ручка меняются местами, а не показываются вместе.
     В покое (шторка у края) видна ручка: она сбоку от лица и говорит, что
     кадр можно потянуть. Как только шторка пошла — ручка гаснет, потому что
     на полпути она оказывается ровно посреди лица и закрывает нос; вместо
     неё работает шов, а палец игрока и так на месте границы. */
  .face-grip{ opacity:1; transition: opacity .2s ease; }
  .faces-stage[data-edge="0"] .face-grip{ opacity:0; }
  /* clamp — ручка всегда целиком внутри кадра: на краю она прижимается
     к нему, а не свешивается половиной наружу. */
  .face-grip{
    position:absolute; top:50%;
    left: clamp(17px, var(--curtain, 100%), calc(100% - 17px));
    width:32px; height:32px; margin:-16px 0 0 -16px;
    border-radius:50%; background: var(--text-primary); color: var(--surface);
    display:grid; place-items:center; font-size:12px; line-height:1;
    box-shadow: var(--shadow-sm); z-index:4; pointer-events:none;
  }
  @media (prefers-reduced-motion: reduce){ .face-seam, .face-label-row{ transition:none; } }
  .faces-stage:focus-visible{ outline:2px solid var(--good); outline-offset:4px; border-radius:6px; }
  /* Fixed, deterministic width -- NOT flex:1 1 0's content-driven share
     (Alex 2026-09-17: "определи квадрат за пределы которого морды не
     выйдут... оставь место ровно для таких квадратов"). flex:1 1 0 already
     measured equal in every viewport this session checked directly, so
     that wasn't the actual mismatch -- explicit width just makes it
     impossible for a future longer label string on one side to ever throw
     the two columns out of sync with each other, on principle, rather than
     relying on flex distribution happening to land equal. min() caps at
     the old 240px on wide screens, halves the available width (minus the
     gap) on narrow ones -- same responsive behavior as before. */
  /* Подписи разъехались по краям кадра: слева период, который сейчас, справа
     тот, с которым сравниваем — концы, между которыми ходит шторка. */
  .face-ends{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; }
  /* Real button — opens that side's period popover. Sits BELOW its face
     (Alex 2026-09-17: "перенеси подписи под морды" — reverses the
     above-placement from 2026-09-14). Since the face is now the FIRST
     child in its column, both squares already start at y=0 with nothing
     above them to possibly mismatch — no min-height reservation trick
     needed the way the above-placed version required (that fix is gone,
     it'd just be dead weight/empty space now). Dotted underline + hover
     color matches every other clickable-period control on the page
     (.pword-inline). */
  /* Одинаковые кнопки вместо разнородных контролов (Alex 2026-09-27:
     «возможно их стоит реализовать одинаково как кнопку today»). Раньше это
     был подчёркнутый пунктиром текст, при том что рядом на экране такой же
     по смыслу выбор периода выглядел плашкой. Два одинаковых по назначению
     контрола должны выглядеть одинаково. Открывают они всё тот же
     openPeriodPopover(), поведение выбора не менялось.
     Приглушена та сторона, чьего лица сейчас в кадре меньше: у края иначе
     непонятно, на кого смотришь. */
  .face-label{
    font: inherit; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--surface); background: var(--text-primary);
    border: 1px solid var(--text-primary); border-radius: 999px;
    padding: 8px 13px; cursor: pointer;
  }
  /* Подсветка стороны — ТОЛЬКО пока шторка не у края (Alex 2026-09-28:
     «пропала подсветка даты при пробеге шторки»).
     История в двух шагах, и обе половины требования живы одновременно.
     27.09 приглушение висело ВСЕГДА, и в покое две кнопки выглядели как два
     разных контрола — чёрная плашка и оливковая; это ломало «одинаково как
     кнопку today», поэтому я снял его целиком. Вместе с ним пропало и то,
     ради чего оно было: на ходу шторки не видно, чей день сейчас в кадре.
     Теперь приглушение живёт ровно в движении: [data-edge="0"] ставится
     paint()-ом, пока шторка между краями. В покое кнопки снова
     неотличимы. */
  .faces-stage[data-edge="0"][data-side="A"] ~ .face-ends .face-label-row[data-which="B"],
  .faces-stage[data-edge="0"][data-side="B"] ~ .face-ends .face-label-row[data-which="A"]{
    opacity: .42;
  }
  /* Wraps the label + its optional ‹› pager (periodNavArrow(), only present
     when that side's selection is a week or month) so all three center as
     one unit below the face. margin-top (not the old margin-bottom) is
     the one gap between the two — no min-height, so a side with no pager
     (shorter row) doesn't reserve space it doesn't use. */
  /* Plain small top margin now (was margin-top:auto pinning to a
     stretched column's bottom — that mechanism is gone along with
     .faces-wrap's align-items:stretch, see its own comment; minimal
     total height wins over a shared bottom line now). */
  /* transition — приглушение гаснет и возвращается плавно, иначе на каждом
     пересечении середины кадра подписи дёргаются рывком. */
  .face-label-row{ display:flex; align-items:center; gap:4px; transition: opacity .18s ease; }
  .face-label-row .period-nav{ width:20px; height:20px; font-size:12px; }
  /* Stands in for chFaceSvg() on a side with no attempts (Alex 2026-09-17
     bug fix — see buildFaces()'s own comment: the label row, with the
     period button and ‹› pager, is what actually lets a viewer get OUT of
     this state, so it's never removed, only the face itself). The
     padding-top:103px "center on the real face's own middle" version was
     WRONG — Alex, precisely: "вот до этой последней строчки [...] data
     starts to show up after roughly 500 attempts at Level 2" — the gap
     from THAT line down to this text has to be minimal, full stop; a
     103px offset to vertically center the text is exactly the gap that
     breaks. No padding-top at all — this text starts flush against the
     sample-note paragraph, same as the real face's own top edge does. */
  .face-empty{
    display:flex; align-items:flex-start; justify-content:center;
    padding: 0 12px;
    font-size: 12px; line-height: 1.4; color: var(--text-muted);
  }
  .face-note{ text-align:center; font-size: 12.5px; color: var(--text-muted); margin: 0 0 18px; }
  /* Chernoff-faces credit footer (kept standalone — Alex 2026-09-15: the
     separate "How to read these faces" toggle + its row-by-row legend
     panel is GONE, merged entirely into "Here's how you're doing" below
     (see the .metric-name/.feature-icon/.feature-hint rules above) — this
     is just the small Wikipedia attribution line that used to sit at the
     bottom of that panel, now sitting under the faces on its own). */
  /* Divider flipped to border-BOTTOM (Alex 2026-09-18: "подними над
     чертой под которой он сейчас" — the credit text used to sit BELOW its
     own dividing line; now the line sits below the text instead, same
     DOM position, nothing else moved). */
  .fl-credit{
    margin: 10px 0 22px; padding-bottom: 10px; border-bottom: 1px solid var(--gridline);
    font-size: 10.5px; color: var(--text-muted); text-align: center;
  }
  .fl-credit a{ color: inherit; }

  /* "Cards written into the text" (Alex 2026-09-13) — replaces the tile
     grid entirely. The exact number now sits INSIDE the narrative sentence
     as a small pill, right before the metric name, instead of living next
     to the text in its own box — magazine-style inline data (the same
     device data journalism uses for an in-line stat inside a paragraph). */
  .inline-chip{
    display:inline-block; font-size: 12px; font-weight: 780; font-variant-numeric: tabular-nums;
    padding: 1px 8px; border-radius: 999px; margin-right: 7px; vertical-align: 1px;
  }
  .inline-chip.good{     color: var(--good);     background: rgba(31,122,61,0.14); }
  .inline-chip.critical{ color: var(--critical); background: rgba(166,57,44,0.14); }
  .inline-chip.flat{     color: var(--text-muted); background: rgba(42,30,0,0.08); }
  /* Absolute было/стало, packed into the SAME pill as the % (Alex
     2026-09-18, second try: "рядом с процентами, на одной плашке" — not a
     separate clause down in the sentence). Lighter weight/slightly
     smaller than the % itself so the pill still reads "percent first,
     absolute values as a footnote to it" at a glance. */
  .chip-vals{ font-weight: 500; opacity: .75; font-size: 11px; }

  .foot-row{ display:flex; justify-content: space-between; align-items:center; margin-top: 18px; }
  .foot-note{ font-size: 12px; color: var(--text-muted); max-width: 56ch; }
  .table-toggle{
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--text-secondary);
    background: none; border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 12px; cursor: pointer;
  }

  /* Committing to a narrow (640px) page (see .wrap above) means a 5-column
     table can genuinely be wider than the viewport on a phone — scroll the
     table itself sideways, never the page body (per this project's own
     "wide content gets its own overflow-x:auto container" rule). */
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; display:none; margin-top: 16px; }
  .table-scroll.show{ display:block; }
  table.data-table{ width:100%; min-width: 480px; border-collapse: collapse; font-size: 13px; }
  table.data-table th, table.data-table td{
    text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--gridline);
  }

  table.data-table td.num{ font-variant-numeric: tabular-nums; text-align: right; }
  table.data-table td.dir-good{ color: var(--good); font-weight: 600; }
  table.data-table td.dir-critical{ color: var(--critical); font-weight: 600; }
  table.data-table td.dir-flat{ color: var(--text-muted); }
  /* Merges the legend into the table (Alex 2026-09-14: "совместим
     объяснялку и саму таблицу") — this row sits directly under its data
     row, softer/smaller so it doesn't compete with the numbers, wrapping
     freely inside the table's own width rather than forcing extra
     horizontal scroll. */
  table.data-table tr.table-caption-row td{
    padding: 2px 10px 12px; border-bottom: 1px solid var(--gridline);
    font-size: 12px; line-height: 1.5; color: var(--text-secondary);
  }
  .table-caption-text{ margin-right: 8px; }
  .table-caption-note{ font-style: italic; color: var(--text-muted); }
  .table-show-btn{
    display: inline-block; margin-top: 4px; font: inherit; font-size: 11.5px; font-weight: 700;
    color: var(--chip-fg-active); background: var(--chip-bg-active); border: none;
    border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap;
  }
  .table-show-btn:hover{ opacity: 0.85; }

  /* Legend merged into "Here's how you're doing" (Alex 2026-09-15): the
     metric name gets a tap-tooltip sourced from the FIRST half of its
     legend sentence (what the parameter means); a "мордочка" icon + the
     SECOND half (how the facial feature reacts) follow the paragraph —
     tapping that text animates the feature, tapping the icon shows the
     FULL legend sentence in the same tooltip AND animates. A tap-triggered
     tooltip (not the native `title` attribute) is used throughout since
     this page is viewed inside a touch-only WebView with no hover state. */
  .metric-name{ cursor:pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
  .feature-icon{ cursor:pointer; margin-left: 4px; }
  /* Was plain --text-secondary (Alex 2026-09-15: "выдели в тексте элемент
     запускающий анимацию" — real bug, not just wording: --text-secondary is
     the SAME color as the paragraph text around it, and `cursor:pointer`
     shows only for a mouse, not on the touch-only WebView this page actually
     runs in — the tap target was there but had ZERO visible affordance).
     Reuses --ch-highlight, the color already reserved project-wide for
     exactly "tap this to see it move on the faces" (see its own definition
     above), plus the same dotted underline .metric-name uses so both tap
     targets in a paragraph read as one consistent interactive style. */
  .feature-hint{
    cursor:pointer; color: var(--ch-highlight); font-weight: 600;
    text-decoration: underline dotted; text-underline-offset: 2px;
  }
  /* Amber, not the page's own cream/--surface (Alex 2026-09-16: "давай
     делать бабл другим цветом... тем, который используется в качестве
     бэкграунда в about" — the native About screen's own card background,
     #F5C02E, AboutCardBg in AboutScreen.kt; border matches the native
     cheer-up bubble's #FFD35E rim for the same amber "info callout" family
     — a real color already established elsewhere in the app, not invented
     for this one box). Text stays the same dark brown the bubble/card use
     on this amber (#2A1E00) rather than --text-primary, which is tuned for
     the page's own cream background and reads too light on solid amber. */
  .metric-tooltip{
    position: fixed; max-width: 320px; font-size: 12px; line-height: 1.45;
    color: #2A1E00; background: #F5C02E; border: 1px solid #FFD35E;
    border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.18); z-index: 50;
  }
  .metric-tooltip[hidden]{ display:none; }
  /* Tapping the drawn feature directly on either face does the same thing
     as tapping its mordochka text (Alex 2026-09-15) — no visual restyle of
     the faces themselves (they're meant to read as a face, not a button
     grid), just a pointer cursor for anyone testing with a mouse. */
  #faces [data-feature]{ cursor: pointer; }

  /* Режим "только мордочка" для карточки на экране Analytics (Alex 2026-09-21):
     ?mode=face&fromMs=..&toMs=..&min=..  Страница подменяет body одной
     мордочкой периода, прозрачный фон. */
  html.face-mode, body.face-mode{ margin:0; background:transparent !important; overflow:hidden; }
  #faceOnly{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
    --surface:#FBE7A6; --text-primary:#2A1E00; --good:#1F7A3D; --border:rgba(42,30,0,0.14); }
  #faceOnly svg{ width:100% !important; height:100% !important; }
  #faceOnly.blurred svg{ filter: blur(5px); }
</style>

<body>

<div class="viz-root">
  <div class="wrap">
    <div class="card">

      <div class="title-row">

      </div>
      </div>

  <!-- Внутри .viz-root, а не снаружи — иначе токены --surface/--border/--text-*

  <div class="popover" id="periodPopover"></div>

<script>
let DATA = null;

const AIM = 3000.0;
const ACC_ORD = {ds:1, cs:2, ms:3};

// Английские названия — не изобретены заново, а взяты из уже установленного
// словаря приложения (About screen, GetQuestSummaryUseCase.kt, аналитический
// экран): Excitation/Inhibition — устоявшаяся "павловская пара" (комментарий
// в коде), Luck Coefficient — дословно из the myth.docx, Pace of Learning —
// название реального экрана аналитики, Feedback Use — формулировка из
// cheer_ups.docx ("use the last attempt's result to set up the next one").
// early/late: Alex explicitly asked twice for "Overwhelming"/"Overrelaxed"
// (2026-09-08) — flagged once that Excitation/Inhibition were already the
// project's established terms, he insisted, using his exact wording.
const METRICS = [
  {key:"eff",        label:"Скорость обучения",              label_en:"Pace of Learning",       favorable:"up"},
  {key:"hit",         label:"Точность попадания в цель",       label_en:"Hit Rate",                favorable:"up"},
  {key:"early",       label:"Возбуждение",                      label_en:"Overwhelming",            favorable:"down"},
  {key:"late",        label:"Торможение",                       label_en:"Overrelaxed",             favorable:"down"},
  {key:"gcv",         label:"Разброс ошибки",                   label_en:"Error Stability",         favorable:"down"},
  {key:"focus",       label:"Устойчивость состояния",           label_en:"State Steadiness",        favorable:"down"},
  {key:"consist",     label:"Использование обратной связи",     label_en:"Feedback Use",            favorable:"up"},
  {key:"lucky",       label:"Коэффициент удачи",                label_en:"Luck Coefficient",        favorable:"up"},
];
const FLAT_EPS = 0.12; // ±12% относительного изменения считается шумом

// Тот же тон, что в narrative_engine_ru_relative.py (голос Алекса, cheer_ups.docx

// Порт 1:1, чтобы текст на этой странице и текстовый движок никогда не расходились

// переходами, не только "за этим стоит") → конкретный ответ.

// METRICS — оно разное: у early/late/gcv/focus благоприятно

// направления числа:
//   благоприятный сдвиг → "вы что-то нашли/нащупали — попробуйте осознать,
//     что именно, и закрепить это осознанно";
//   неблагоприятный сдвиг → "что-то было упущено — постарайтесь вспомнить,

// Формулировки внутри каждого полюса намеренно разные (не шаблонная фраза
// x18), но держатся этой пары глаголов — "нашли/осознать/закрепить" vs
// "упустили/вспомнить/восстановить" — везде.
const PHRASES = {
  early: { // favorable: down — down хороший, up плохой
    up:   "усилилось на {d}. Вы чаще были перевозбуждены и торопили момент, вместо того чтобы дождаться его. Что-то из привычного спокойствия было упущено — постарайтесь вспомнить, что раньше помогало сдерживать этот порыв, и попробуйте перед действием один медленный вдох-выдох.",
    down: "снизилось на {d}. Вы стали реже перевозбуждаться и торопить момент — это в вашу пользу. Вы нашли то, что помогает сохранять спокойствие — постарайтесь осознать, что именно, и повторяйте это осознанно.",

    up:   "вырос на {d}: размер ваших ошибок стал менее предсказуемым — промахи то маленькие, то крупные. Часть прежней стабильности была упущена — постарайтесь вспомнить, что раньше давало ресурс на стабильность, и по возможности снизьте нагрузку в других сферах.",

function narrate(rows, scopeAfter, scopeBefore, lang, historicalDist){
  const order = ["eff","hit","early","late","gcv","focus","consist","lucky"];
  const table = lang === "en" ? PHRASES_EN : PHRASES;
  const steadyTable = lang === "en" ? STEADY_PHRASES_EN : STEADY_PHRASES;
  const labelKey = lang === "en" ? "label_en" : "label";
  const linkTextKey = lang === "en" ? "text_en" : "text";
  // Подзаголовки + один <p> на показатель (Alex 2026-09-11: "сложно понять
  // структуру текста, дал бы подзаголовки") — раньше все сдвиги склеивались
  // в один сплошной абзац.
  const items = [];
  const steadyItems = [];
  const rawDirByKey = {}; // для CROSS_LINKS — сырое направление, не favorable-mapped
  // Legend merge (Alex 2026-09-15): the metric name becomes a tap-tooltip
  // sourced from the legend's own "what this parameter means" half, and the
  // sentence is followed by a мордочка icon + the legend's "how the feature
  // reacts" half — tapping that text animates the feature, tapping the icon
  // shows the FULL legend sentence in the same tooltip and animates too.
  // Absolute было/стало (was/now), IN the same chip/pill as the % change,
  // not tacked onto the end of the sentence (Alex 2026-09-18, correcting
  // the first attempt at this: "они должны быть рядом с процентами, на
  // одной плашке" — one pill, not a separate clause three lines later).
  // Reuses fmtVal(), the SAME per-metric formatter the data table already
  // uses (%, ×, ms — whichever fits that key), so the two can't drift into
  // different units for the same metric.
  // Skipped entirely for metrics whose own NATIVE unit is already percent
  // (hit/focus/consist/eff/gcv — see fmtVal's own %-branch) — Alex
  // 2026-09-18, third pass: "там где параметр измеряется в процентах не
  // надо значения показывать" — showing "+50.0% (0.5%→0.7%)" puts two
  // different percentages (the CHANGE and the raw VALUE) right next to
  // each other in the same pill, which reads as one confusing number, not
  // two distinct ones. ms/×-valued metrics (early/late/lucky) keep it —
  // no such collision there.
  const CH_PERCENT_METRICS = new Set(["hit", "focus", "consist", "eff", "gcv"]);
  const beforeAfterTxt = r => `${fmtVal(r.key, r.before)}→${fmtVal(r.key, r.after)}`;
  const chipAndName = (r, key, chipClass, chipLabel) => {
    const halves = legendHalvesForKey(key, lang);
    const nameHtml = halves
      ? `<b class="metric-name" data-tip="${halves.param}">${r[labelKey]}</b>`
      : `<b>${r[labelKey]}</b>`;
    const faceHtml = halves
      ? ` <span class="feature-icon" data-key="${key}" data-tip="${halves.row.desc}" role="button" tabindex="0">🙂</span> <span class="feature-hint" data-key="${key}" role="button" tabindex="0">${halves.feature}</span>`
      : "";
    const valsHtml = CH_PERCENT_METRICS.has(key) ? "" : ` <span class="chip-vals">(${beforeAfterTxt(r)})</span>`;
    const chip = `<span class="inline-chip ${chipClass}">${chipLabel}${valsHtml}</span>`;
    return {chip, nameHtml, faceHtml};
  };
  order.forEach(key => {
    const r = rows.find(x => x.key === key);
    // delta === null — недостаточно данных для сравнения вообще (нет "до"
    // или "после"); тут действительно нечего сказать, молчим как и раньше.
    if (!r || r.delta === null) return;
    if (Math.abs(r.delta) >= FLAT_EPS*100){
      const rawDir = r.delta > 0 ? "up" : "down"; // направление СЫРОГО числа, не "хорошо/плохо"
      rawDirByKey[key] = rawDir;
      const tmpl = table[key][rawDir];
      if (!tmpl) return;
      const deltaTxt = Math.abs(r.delta).toFixed(1) + "%";
      const text = tmpl.replace("{d}", deltaTxt).replace("{S}", "в этот период");
      // Inline chip (Alex 2026-09-13: "вписать карточки в текст") — the
      // number that used to live in a separate tile now sits right inside
      // the sentence, before the metric name. r.dir is always "good" or
      // "critical" here (never "flat"/"na") since we only reach this branch
      // when |delta| already cleared FLAT_EPS.
      const {chip, nameHtml, faceHtml} = chipAndName(r, key, r.dir, pctLabel(r.delta));
      items.push(`<p>${chip}${nameHtml} ${text}${faceHtml}</p>`);
    } else {
      // Не сдвинулось (Alex 2026-09-12: "комментировать надо не только
      // изменённые параметры, но и те что остались неизменными — поощрять
      // если хорошо, призывать улучшить если плохо"). "Хорошо/плохо" —
      // ОТНОСИТЕЛЬНО ЛИЧНОЙ исторической медианы игрока (historicalDist),
      // не выдуманного порога; если истории мало (< 2 недельных бакета) —
      // молчим, как и для delta === null, а не гадаем.
      const med = historicalDist && historicalDist[key] && historicalDist[key].length >= 2
        ? median(historicalDist[key]) : null;
      if (med === null || r.after === null) return;
      const isGood = r.favorable === "up" ? r.after >= med : r.after <= med;
      const {chip, nameHtml, faceHtml} = chipAndName(r, key, "flat", "≈");
      steadyItems.push(`<p>${chip}${nameHtml} ${steadyTable[key][isGood ? "good" : "poor"]}${faceHtml}</p>`);
    }
  });
  if (!items.length && !steadyItems.length){
    return lang === "en"
      ? `<p>Not enough history yet to say what held steady or what shifted.</p>`
      : `<p>Пока недостаточно истории, чтобы сказать, что сдвинулось, а что осталось стабильным.</p>`;
  }
  const crossItems = [];
  CROSS_LINKS.forEach(link => {
    const [ka, kb] = link.keys;
    if (rawDirByKey[ka] !== link.want[0] || rawDirByKey[kb] !== link.want[1]) return;
    const ra = rows.find(x => x.key === ka), rb = rows.find(x => x.key === kb);
    if (!ra || !rb) return;
    crossItems.push(`<p>${link[linkTextKey](ra[labelKey], rb[labelKey])}</p>`);
  });
  const headingWhat = lang === "en" ? "Here's how you're doing:" : "Вот как вы справляетесь:";
  const headingSteady = lang === "en" ? "Holding steady" : "Держится стабильно";
  const headingLinks = lang === "en" ? "How they connect" : "Связи между показателями";
  let out = "";
  if (items.length) out += `<h4>${headingWhat}</h4>` + items.join("");
  if (steadyItems.length) out += `<h4>${headingSteady}</h4>` + steadyItems.join("");
  if (crossItems.length) out += `<h4>${headingLinks}</h4>` + crossItems.join("");
  return out;
}

function geomMean(values){
  const pos = values.filter(v => v > 0);
  if (!pos.length) return 0;
  return Math.exp(pos.reduce((s,v)=>s+Math.log(v),0)/pos.length);
}

// Most frequent rounded ERROR (not duration) on one side — same idea as the
// native app's "Modes of Deviation" (top repeating early/late deviation,
// count>=2 so a single unrepeated attempt can't pass as a "mode"). Rounded
// to the SAME precision grid as `hit` above (factor=10^accOrd) so it's
// comparable across deci/centi/milli levels. Returns the mode's absolute
// magnitude, or null if nothing repeats on that side.
function modeOfSide(errs, factor, sidePredicate){
  const counts = new Map();
  errs.filter(sidePredicate).forEach(e => {
    const r = Math.round(e*factor)/factor;
    counts.set(r, (counts.get(r)||0)+1);
  });
  let best = null, bestCount = 1; // require count >= 2 to count as a real mode
  counts.forEach((c, v) => {
    if (c > bestCount || (c === bestCount && best !== null && Math.abs(v) < Math.abs(best))){
      best = v; bestCount = c;
    }
  });
  return best === null ? null : Math.abs(best);
}

// Attempts whose duration missed the 3.000s aim by more than this are
// outliers, not signal (Alex 2026-09-16: "все что больше 500 мс от 3.000 мы
// считаем выбросом и не принимаем в расчет") — excluded from the deviation-
// MAGNITUDE family below (early/late/mode/tail/CV/gcv — everything computed
// straight FROM the raw ms error) before those stats are built. Deliberately
// NOT applied to: n/hit/wins (a huge miss is still a real miss for hit
// rate's own denominator — dropping it would inflate hit rate, not clean it
// up), lucky (same denominator reasoning), focus/consist (sign-change /
// did-it-get-closer comparisons between consecutive attempts, not a
// magnitude reading), earlyShare/lateShare (still legitimately an early or
// late miss, just an extreme one — which side it fell on doesn't stop being
// true because it was big). Flag it if that scope turns out too narrow.
const CH_OUTLIER_MS = 500;

function metricsFor(attempts, accOrd){
  const n = attempts.length;
  if (n === 0) return null;
  const errs = attempts.map(a => a.e);
  const devErrs = errs.filter(e => Math.abs(e) <= CH_OUTLIER_MS);

  const early = geomMean(devErrs.filter(e=>e<0).map(e=>-e));
  const late  = geomMean(devErrs.filter(e=>e>0));
  const factor = Math.pow(10, accOrd);
  const earlyMode = modeOfSide(devErrs, factor, e => e < 0);
  const lateMode  = modeOfSide(devErrs, factor, e => e > 0);
  // How OFTEN each side happens, not how BIG it is when it does — a
  // genuinely separate statistic from early/late's own geomean (Alex
  // 2026-09-14: "одному параметру соответствует ОДНА черта лица" — brow and
  // eye-openness used to BOTH react to the same early/late magnitude, which
  // is two facial features driven by one parameter; eye-openness now reacts
  // to this instead, so each row in the legend maps to exactly one feature).
  const earlyCnt = errs.filter(e=>e<0).length, lateCnt = errs.filter(e=>e>0).length;
  const sideTotal = earlyCnt + lateCnt;
  const earlyShare = sideTotal ? earlyCnt/sideTotal : null;
  const lateShare  = sideTotal ? lateCnt/sideTotal  : null;

  const aimR = Math.round(AIM/1000*factor);
  let wins = 0;
  attempts.forEach(a => { if (Math.round((a.e+AIM)/1000*factor) === aimR) wins++; });
  const hit = 100*wins/n;

  // earlyTail/lateTail are the SAME two numbers range_span sums together
  // (P3 and P97) — kept separate instead of combined, so each can drive its
  // own side of a paired feature (Alex 2026-09-14: ears — the single worst
  // miss caused specifically by rushing vs specifically by over-relaxing).
  // range_span as a combined figure is no longer used on the face at all
  // (head roundness now shows hit instead — see CH_FEATURES/CH_SYMMETRIC).
  // Percentiled over devErrs (outlier-excluded, see CH_OUTLIER_MS) — indexed
  // by devErrs' OWN length, not the outer n, so P3/P97 stay meaningful
  // percentiles of the array actually being sliced rather than reaching past
  // its end (or under-reaching) whenever attempts and devErrs differ in size.
  const sortedDev = devErrs.slice().sort((a,b)=>a-b);
  const dn = sortedDev.length;
  const loIdx = Math.min(Math.max(Math.floor(dn*0.03),0), dn-1);
  const hiIdx = Math.min(Math.max(Math.floor(dn*0.97),0), dn-1);
  const earlyTail = dn ? Math.abs(sortedDev[loIdx]) : 0;
  const lateTail = dn ? Math.abs(sortedDev[hiIdx]) : 0;
  // lucky's own dispersion/slots stay on the RAW (unfiltered) range — that's
  // a separate, not-yet-decided theoretical question (see chat), so this
  // outlier exclusion doesn't reach into it by accident just because it
  // shares earlyTail/lateTail's old source variables.
  const sortedErr = errs.slice().sort((a,b)=>a-b);
  const rawLoIdx = Math.min(Math.max(Math.floor(n*0.03),0), n-1);
  const rawHiIdx = Math.min(Math.max(Math.floor(n*0.97),0), n-1);
  const rangeSpan = Math.abs(sortedErr[rawLoIdx]) + Math.abs(sortedErr[rawHiIdx]);
  const slots = Math.max(Math.floor(rangeSpan/1.0),1) + 1;
  const dispersion = 1/slots;
  const luckyWins = attempts.filter(a => Math.abs(a.e) < 0.5).length;
  const lucky = dispersion>0 ? (luckyWins/n)/dispersion : 0;

  // session groups, sorted by attempt-number, for focus/consistency/SC
  const bySession = {};
  attempts.forEach(a => { (bySession[a.s] ||= []).push(a); });
  const groups = Object.values(bySession).map(g => g.slice().sort((a,b)=>a.n-b.n));

  let alt=0, valid=0;
  groups.forEach(g => { for(let i=1;i<g.length;i++){ const ea=g[i-1].e, eb=g[i].e; if(ea!==0&&eb!==0){ valid++; if((ea<0)!==(eb<0)) alt++; } } });
  const focus = valid? 100*alt/valid : null;

  let drops=0, pairs=0;
  groups.forEach(g => { for(let i=1;i<g.length;i++){ pairs++; if(Math.abs(g[i].e) < Math.abs(g[i-1].e)) drops++; } });
  const consist = pairs? 100*drops/pairs : null;

  const absErr = devErrs.map(Math.abs).filter(v=>v>0);
  let gcv = 0;
  if (absErr.length){
    const ln = absErr.map(Math.log);
    const lnMean = ln.reduce((s,v)=>s+v,0)/ln.length;
    const lnStd = Math.sqrt(ln.reduce((s,v)=>s+(v-lnMean)**2,0)/ln.length);
    gcv = (Math.exp(lnStd)-1)*100;
  }
  // Same geometric-CV formula as gcv above, but scoped to ONE side only —
  // gcv is "how consistent is my error size overall", this is "how
  // consistent is it specifically when I'm early" vs "...when I'm late"
  // (Alex 2026-09-14: eye width is a PAIRED feature, so it needs a genuinely
  // paired early/late statistic, not the single "hit" value it had before —
  // magnitude already went to brow, frequency to eyeOpen, mode to pupils,
  // this is the 4th distinct one). null when a side has under 2 attempts —
  // a "spread" of one value isn't meaningful.
  function cvOfSide(vals){
    const abs = vals.filter(v=>v>0);
    if (abs.length < 2) return null;
    const ln = abs.map(Math.log);
    const lnMean = ln.reduce((s,v)=>s+v,0)/ln.length;
    const lnStd = Math.sqrt(ln.reduce((s,v)=>s+(v-lnMean)**2,0)/ln.length);
    return (Math.exp(lnStd)-1)*100;
  }
  const earlyCV = cvOfSide(devErrs.filter(e=>e<0).map(e=>-e));
  const lateCV  = cvOfSide(devErrs.filter(e=>e>0));

  const levelFactor = Math.pow(10, accOrd-3);
  const peakScm = 99*levelFactor;
  const scored = [];
  groups.forEach(g => {
    for(let i=1;i<g.length-1;i++){
      const p=g[i-1].e, c=g[i].e, nx=g[i+1].e;
      const tPrev=Math.abs(p), tCurr=Math.abs(c), tNext=Math.abs(nx);
      const denom = 3*tCurr + tPrev + tNext + Math.abs(c-nx) + Math.abs(c-p) - Math.abs(nx-p)/3 + 1;
      scored.push(99/denom*levelFactor);
    }
  });
  const eff = scored.length ? (scored.reduce((s,v)=>s+v,0)/scored.length)/peakScm*100 : null;

  return {n, early, late, earlyMode, lateMode, earlyShare, lateShare, earlyCV, lateCV, earlyTail, lateTail, hit, lucky, focus, consist, gcv, eff};
}

// Понедельник недели, которой принадлежит дата — ключ бакета для
// historicalDistribution() ниже.
function weekKey(dateStr){
  const d = new Date(dateStr + "T00:00:00Z");
  const day = (d.getUTCDay() + 6) % 7; // Mon=0..Sun=6
  d.setUTCDate(d.getUTCDate() - day);
  return d.toISOString().slice(0,10);
}

function median(values){
  if (!values.length) return null;
  const s = values.slice().sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length % 2 ? s[mid] : (s[mid-1]+s[mid])/2;
}

// Личное историческое распределение каждой метрики (Alex 2026-09-12: "надо
// комментировать и то что осталось неизменным — поощрять если хорошо,
// призывать улучшить если плохо" — критерий выбран явно: ОТНОСИТЕЛЬНО ЛИЧНОЙ
// ИСТОРИИ игрока, не выдуманный внешний порог). `attempts` — это уже
// server-side отфильтрованная под ТЕКУЩИЙ уровень точности история
// (report_data.php, правило D13) — недельные бакеты внутри неё не могут
// зацепить данные другого уровня, сравнение остаётся честным даже когда
// "прошлое" в этом смысле означает "пару недель назад на этом же уровне".
function historicalDistribution(attempts, accOrd){
  const buckets = {};
  attempts.forEach(a => {
    const wk = weekKey(a.t.slice(0,10));
    (buckets[wk] ||= []).push(a);
  });
  const dist = {};
  Object.values(buckets).forEach(bucketAttempts => {
    // Меньше 5 попыток в неделе — слишком шумная оценка метрики, пропускаем
    // бакет целиком, а не тянем разброс с одной-двух попыток.
    if (bucketAttempts.length < 5) return;
    const m = metricsFor(bucketAttempts, accOrd);
    if (!m) return;
    Object.keys(m).forEach(k => {
      if (k === "n" || m[k] === null) return;
      (dist[k] ||= []).push(m[k]);
    });
  });
  return dist;
}

function filterByDate(attempts, from, to){
  const f = from, t = to + "T23:59:59";
  return attempts.filter(a => a.t >= f && a.t <= t);
}

function relDelta(before, after){
  if (before === null || after === null || before <= 0) return null;
  return (after-before)/before*100;
}

function direction(favorable, delta){
  if (delta === null) return "na";
  if (Math.abs(delta) < FLAT_EPS*100) return "flat";
  const up = delta > 0;
  return (favorable === "up") === up ? "good" : "critical";
}

function fmtDate(d){ return d.toISOString().slice(0,10); }
// The ONE real-calendar "today" reference for the whole page (Alex
// 2026-09-17: "отлистать назад а потом долистать до сегодня снова
// показывается та же морда словно данные есть" — a real bug: 3 different
// functions each computed their OWN idea of "today", and only ONE of them
// (setDefaultRanges, fixed earlier the same session) used the real date;
// applyDefaultDay() and stepPeriod()'s "day" branch still anchored to
// b.max (the date of the player's OWN last attempt) — so paging the day
// picker forward to "offset 0" landed back on b.max, which silently has
// data whenever the player hasn't played YET today, contradicting the
// correct empty state the page shows on first load. Computed once here,
// used everywhere "today" means the actual calendar day, not "whatever
// the last attempt happens to be".
const REAL_TODAY = fmtDate(new Date());
function daysAgoDate(lastDate, days){
  const d = new Date(lastDate); d.setUTCDate(d.getUTCDate()-days); return fmtDate(d);
}
function startOfMonth(dateStr){ const d = new Date(dateStr+"T00:00:00Z"); d.setUTCDate(1); return fmtDate(d); }
function endOfMonth(dateStr){ const d = new Date(dateStr+"T00:00:00Z"); d.setUTCMonth(d.getUTCMonth()+1); d.setUTCDate(0); return fmtDate(d); }
function addMonthsToDate(dateStr, n){ const d = new Date(dateStr+"T00:00:00Z"); d.setUTCMonth(d.getUTCMonth()+n); return fmtDate(d); }

const RU_MONTH_NAMES = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

const EN_MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtMonthYear(dateStr, lang){
  const d = new Date(dateStr+"T00:00:00Z");
  return (lang==="en"?EN_MONTH_NAMES:RU_MONTH_NAMES)[d.getUTCMonth()] + " " + d.getUTCFullYear();
}
function fmtDayMonthShort(dateStr, lang){
  const d = new Date(dateStr+"T00:00:00Z");
  return d.getUTCDate() + " " + (lang==="en"?EN_MONTH_SHORT:RU_MONTH_SHORT)[d.getUTCMonth()];
}
// Exact-selection labels (Alex 2026-09-14: "в название над мордой выводить
// ровно то что выбрано") — "7-13 Sep" when both ends share a month, else
// "28 Aug - 3 Sep" spelled out fully so a range crossing a month boundary
// doesn't read as ambiguous.
function fmtRangeShort(from, to, lang){
  const df = new Date(from+"T00:00:00Z"), dt = new Date(to+"T00:00:00Z");
  if (from === to) return fmtDayMonthShort(from, lang);
  if (df.getUTCMonth() === dt.getUTCMonth() && df.getUTCFullYear() === dt.getUTCFullYear()){
    return df.getUTCDate() + "–" + dt.getUTCDate() + " " + (lang==="en"?EN_MONTH_SHORT:RU_MONTH_SHORT)[dt.getUTCMonth()];
  }
  return fmtDayMonthShort(from, lang) + " – " + fmtDayMonthShort(to, lang);
}

function presetRangeFrom(key, refDate, minDate){
  switch(key){
    case "today":     return {from:refDate, to:refDate};
    // "Day" defaults to yesterday (Alex 2026-09-15) — same range as the old
    // standalone "yesterday" preset, just reachable via the "day" menu entry
    // now instead of its own row.
    case "day":       { const y = daysAgoDate(refDate,1); return {from:y, to:y}; }
    case "yesterday": { const y = daysAgoDate(refDate,1); return {from:y, to:y}; }
    case "daybefore": { const d = daysAgoDate(refDate,2); return {from:d, to:d}; }
    case "week":      return {from:daysAgoDate(refDate,6), to:refDate};
