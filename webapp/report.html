// labelBefore/labelAfter are the SAME relative-period strings ("yesterday",
// "about a week ago"...) already shown in the ptag sentence above — Alex
// 2026-09-13: "убрать before и after, указать конкретные периоды типа вчера
// и сегодня" — generic Before/After didn't say WHICH periods were being
// compared. Now each face-label IS the period picker itself (Alex
// 2026-09-13: "переключатели периодов спусти под лица. под левое то что
// сравниваем, под правое то с чем сравниваем") — replaces the old single
// sentence above the faces. Order: LEFT is always the period being examined
// ("after"/current — data-which="A"), RIGHT is always the reference it's
// compared against ("before" — data-which="B"), fixed regardless of which
// one is chronologically earlier. wireFaces() (below) attaches the actual
// click handlers after this HTML is inserted.
// scaleMax is a FIXED per-metric ceiling (this player's own historical max,
// see render()) — Alex 2026-09-14, real bug found: each face used to be
// normalized against the OTHER currently-selected period (chFaceParams(set,
// beforeSet, afterSet) for BOTH), so picking a different comparison period
// visibly shifted the "current" face even though its own data never
// changed — "выбор периода сравнения не может изменять текущего лица" was
// exactly backwards from what it looked like: the CURRENT face WAS
// changing, just because the scale it was drawn against moved under it.
// Both faces now normalize against the SAME stable scaleMax instead, so
// each one depends only on its own period's data — picking a different
// period on one side can no longer move the other side at all.
// Persistent ‹› pager flanking a face's own label (Alex 2026-09-15: "сделай
// листалку недель и месяцов для второй морды" — the popover's own showWeekPicker()/
// showMonthPicker() already had working ‹›arrows, but only after two taps
// (label → "Week"/"Month" in the menu → then the arrows); this exposes the
// same step logic directly on the label itself once a week/month is already
// selected, so paging through history doesn't need reopening the popover
// each time). Only rendered when that side's current selection actually IS
// a week or month (state.aSel/bSel.type) — a "Today" or "Custom" selection
// has no natural "next" to step to, so no arrows show for those.
function periodNavArrow(which, dir){
  const sel = which === "A" ? state.aSel : state.bSel;
  if (!sel || (sel.type !== "week" && sel.type !== "month" && sel.type !== "day")) return "";
  const b = playerBounds();
  const to = which === "A" ? state.aTo : state.bTo;
  let disabled, emptyCandidate = false;
  if (sel.type === "week"){
    disabled = dir < 0 ? daysAgoDate(to, 13) < b.min : to >= b.max;
    if (!disabled){
      let end = dir < 0 ? daysAgoDate(to, 7) : daysAgoDate(to, -7);
      if (end > b.max) end = b.max;
      const from = daysAgoDate(end, 6);
      emptyCandidate = attemptsCountInRange(from, end) === 0;
    }
  } else if (sel.type === "day"){
    // dir<0 ("‹") steps one day further BACK (higher dayOffset); dir>0 ("›")
    // steps one day toward today (lower dayOffset) — can't go past today.
    disabled = dir < 0 ? daysAgoDate(to, 1) < b.min : sel.dayOffset <= 0;
    if (!disabled){
      const candidate = dir < 0 ? daysAgoDate(to, 1) : daysAgoDate(to, -1);
      emptyCandidate = attemptsCountInRange(candidate, candidate) === 0;
    }
  } else {
    disabled = dir < 0 ? addMonthsToDate(sel.monthStart, -1) < startOfMonth(b.min) : sel.monthStart >= startOfMonth(b.max);
    if (!disabled){
      const shown = addMonthsToDate(sel.monthStart, dir);
      const from = shown < b.min ? b.min : shown;
      const monthTo = endOfMonth(shown) > b.max ? b.max : endOfMonth(shown);
      emptyCandidate = attemptsCountInRange(from, monthTo) === 0;
    }
  }
  disabled = disabled || emptyCandidate;
  const glyph = dir < 0 ? "‹" : "›";
  const hint = emptyCandidate ? ` title="${t().noAttemptsHint}"` : "";
  return `<button type="button" class="month-nav period-nav" data-which="${which}" data-dir="${dir}"${hint} ${disabled ? "disabled" : ""}>${glyph}</button>`;
}
// Mirrors showWeekPicker()/showMonthPicker()'s own prevBtn/nextBtn step math
// exactly, just applied immediately (and re-rendering) instead of updating a
// local `shown`/`shownEnd` inside the still-open popover.
function stepPeriod(which, dir){
  const sel = which === "A" ? state.aSel : state.bSel;
  if (!sel) return;
  const b = playerBounds();
  if (sel.type === "week"){
    const curTo = which === "A" ? state.aTo : state.bTo;
    let shownEnd = dir < 0 ? daysAgoDate(curTo, 7) : daysAgoDate(curTo, -7);
    if (shownEnd > b.max) shownEnd = b.max;
    if (shownEnd < b.min) return;
    const from = daysAgoDate(shownEnd, 6);
    // Mirrors periodNavArrow()'s own emptyCandidate check — the button is
    // already disabled for this case, but stepPeriod() stays defensive on
    // its own rather than trusting the DOM's disabled attribute alone.
    if (attemptsCountInRange(from, shownEnd) === 0) return;
    if (which === "A"){ state.aFrom = from; state.aTo = shownEnd; state.aSel = {type:"week"}; }
    else { state.bFrom = from; state.bTo = shownEnd; state.bSel = {type:"week"}; }
    render();
  } else if (sel.type === "month"){
    const shown = addMonthsToDate(sel.monthStart, dir);
    if (dir < 0 && shown < startOfMonth(b.min)) return;
    if (dir > 0 && shown > startOfMonth(b.max)) return;
    const from = shown < b.min ? b.min : shown;
    const to = endOfMonth(shown) > b.max ? b.max : endOfMonth(shown);
    if (attemptsCountInRange(from, to) === 0) return;
    if (which === "A"){ state.aFrom = from; state.aTo = to; state.aSel = {type:"month", monthStart: shown}; }
    else { state.bFrom = from; state.bTo = to; state.bSel = {type:"month", monthStart: shown}; }
    render();
  } else if (sel.type === "day"){
    const newOffset = sel.dayOffset - dir; // dir<0 ("‹") = further back = HIGHER offset
    if (newOffset < 0) return; // can't step past today into the future
    const day = daysAgoDate(REAL_TODAY, newOffset);
    if (newOffset > sel.dayOffset && day < b.min) return; // stepping further back would cross the level boundary
    if (attemptsCountInRange(day, day) === 0) return; // no attempts that day — don't land there
    if (which === "A"){ state.aFrom = day; state.aTo = day; state.aSel = {type:"day", dayOffset:newOffset}; }
    else { state.bFrom = day; state.bTo = day; state.bSel = {type:"day", dayOffset:newOffset}; }
    render();
  }
}
// Real bug, found by looking at the empty state through the user's own
// eyes (Alex 2026-09-17: "как пользователю выбрать тут другой период?"):
// the OLD version replaced the whole block -- BOTH face-label-rows, i.e.
// the only clickable controls (the period button that opens the popover,
// the ‹› pager) that could ever get a viewer OUT of the empty state --
// with a plain sentence telling them to "try a different period" and no
// way left to do it. Fixed by never dropping the label-row: each side
// renders its own label+pager unconditionally, and only the FACE itself
// (independently per side) falls back to a small placeholder when that
// side's period has no data -- so "today's empty, everything else has
// history" shows one real face and one placeholder, both still pickable.
function buildFaces(beforeSet, afterSet, lang, labelBefore, labelAfter, scaleMax){
  const S = t();
  const pBefore = beforeSet ? chFaceParams(beforeSet, {}, scaleMax) : null;
  const pAfter  = afterSet  ? chFaceParams(afterSet,  {}, scaleMax) : null;
  const faceOrEmpty = (p, faceId) => p
    ? chFaceSvg(p, 110, faceId)
    : `<div class="face-empty">${S.faceNoData}</div>`;
  // Подписи под мордами (Alex 2026-09-17: "перенеси подписи под морды").
  // Разделение на два ряда от 2026-09-18 (.faces-row + .face-labels-row,
  // выравнивание квадратов по нижнему краю через flex-end) СНЯТО 27.09.2026
  // вместе с самими столбцами: морды больше не стоят рядом, они лежат друг
  // на друге в одном кадре, и выравнивать нечего — кадр у них общий.
  // Общий кадр на обе морды — по большей из двух голов (см. chFaceSvg).
  const heads = [pAfter, pBefore].filter(Boolean).map(x => x.headH);
  const box = heads.length ? chFaceCanvasBox(Math.max(...heads)) : null;
  const bothReal = !!(pAfter && pBefore);
  // Порядок в DOM прежний: сначала A (актуальный период), потом B (сравнение).
  // render() ключует по нему state.lastFaces, а кто поверх кого — решает CSS.
  //
  // Когда данных нет только на ОДНОЙ стороне, тянуть нечего: показываем ту
  // морду, которая есть, целиком и без шва, а сообщение про пустой период —
  // под кадром. Подписи с выбором периода остаются в любом случае: это
  // единственное, чем игрок может выбраться из пустого состояния (баг от
  // 2026-09-17, см. комментарий выше — не потерять при переходе на шторку).
  const solo = pAfter || pBefore;
  const stageInner = bothReal
    ? chFaceSvg(pAfter,  110, "a", {box, cls: "face-layer now"})
      + chFaceSvg(pBefore, 110, "b", {box, cls: "face-layer past"})
      + `<div class="face-seam"></div><div class="face-grip" aria-hidden="true">⟷</div>`
    : (solo ? chFaceSvg(solo, 110, pAfter ? "a" : "b", {box, cls: "face-layer now"}) : "");
  const emptyNote = bothReal ? "" : `<div class="face-empty">${S.faceNoData}</div>`;
  return `<div class="faces-stage${bothReal ? "" : " single"}" id="facesStage"${bothReal ? ' tabindex="0" role="slider" aria-label="' + S.curtainLabel + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"' : ""}>
      ${stageInner}
    </div>
    ${emptyNote}
    <div class="face-ends">
      <div class="face-label-row" data-which="A">${periodNavArrow("A",-1)}<button class="face-label" data-which="A">${labelAfter}</button>${periodNavArrow("A",1)}</div>
      <div class="face-label-row" data-which="B">${periodNavArrow("B",-1)}<button class="face-label" data-which="B">${labelBefore}</button>${periodNavArrow("B",1)}</div>
    </div>`;
}
function wireFaces(){
  document.querySelectorAll("#faces .face-label").forEach(btn => {
    btn.addEventListener("click", e => { e.stopPropagation(); openPeriodPopover(btn, btn.dataset.which); });
  });
  document.querySelectorAll("#faces .period-nav").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      stepPeriod(btn.dataset.which, parseInt(btn.dataset.dir, 10));
    });
  });
  wireCurtain();
}

// ── Шторка между двумя мордами (Alex 2026-09-27) ──────────────────────
//
// Поведение, как он его описал: «если тапнуть по ней один раз она медленно
// начинает двигаться в другую сторону. и если оставить ее на середине то тоже
// как бы сползает в ту сторону к которой ближе находится. но можно схватить
// ее пальцем и произвольно двигать или удерживать в любой точке».
//
// Отсюда три правила:
//   • палец всегда сильнее доводчика — касание сразу останавливает движение;
//   • отпустил после перетаскивания — сползает к ближнему краю;
//   • короткий тап без движения — уезжает на противоположный край.
// Долгое удержание без движения тапом НЕ считается: человек держит нарочно,
// иначе обещание «удерживать в любой точке» не работало бы — отпустил, и её
// унесло бы на другую сторону.
//
// --curtain — сколько процентов кадра занимает слой АКТУАЛЬНОГО периода:
// 100 — целиком он, 0 — целиком период сравнения. Покой всегда на краю,
// поэтому в статике видно одно целое лицо, а половинки — только переход.
const CURTAIN_FULL_MS = 1300;   // время полного прохода; меньше — торопливо
let curtainPct = 100, curtainRaf = 0;

function wireCurtain(){
  const stage = document.getElementById("facesStage");
  if (!stage || stage.classList.contains("single")) return;

  const paint = () => {
    stage.style.setProperty("--curtain", curtainPct + "%");
    stage.setAttribute("aria-valuenow", Math.round(curtainPct));
    // У края шов гаснет: разделять там нечего, а палка по границе рамки
    // выглядит как артефакт вёрстки.
    stage.dataset.edge = (curtainPct >= 99.5 || curtainPct <= 0.5) ? "1" : "0";
    // Чей день сейчас занимает бОльшую часть кадра — по нему подсвечивается
    // подпись, пока шторка идёт (CSS, .face-label-row).
    stage.dataset.side = curtainPct >= 50 ? "A" : "B";
  };
  const set = v => { curtainPct = Math.max(0, Math.min(100, v)); paint(); };
  const stop = () => { if (curtainRaf){ cancelAnimationFrame(curtainRaf); curtainRaf = 0; } };

  // Доводчик. Длительность пропорциональна остатку пути, чтобы скорость была
  // одинаковой, откуда бы шторка ни шла.
  const glideTo = target => {
    stop();
    const from = curtainPct, dist = Math.abs(target - from);
    if (dist < 0.5){ set(target); return; }
    const dur = CURTAIN_FULL_MS * (dist / 100), t0 = performance.now();
    const ease = t => (t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2);
    const step = now => {
      const t = Math.min(1, (now - t0) / dur);
      set(from + (target - from) * ease(t));
      curtainRaf = t < 1 ? requestAnimationFrame(step) : 0;
    };
    curtainRaf = requestAnimationFrame(step);
  };
  const nearEdge  = () => (curtainPct >= 50 ? 100 : 0);
  const otherEdge = () => (curtainPct >= 50 ? 0 : 100);

  let dragging = false, moved = false, startX = 0, startT = 0;
  const pctFrom = e => {
    const r = stage.getBoundingClientRect();
    return ((e.clientX - r.left) / r.width) * 100;
  };

  stage.addEventListener("pointerdown", e => {
    stop();
    dragging = true; moved = false;
    startX = e.clientX; startT = performance.now();
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", e => {
    if (!dragging) return;
    if (!moved && Math.abs(e.clientX - startX) < 6) return;   // ещё тап, а не жест
    moved = true;
    set(pctFrom(e));
  });
  const release = () => {
    if (!dragging) return;
    dragging = false;
    const quick = performance.now() - startT < 300;
    glideTo(!moved && quick ? otherEdge() : nearEdge());
  };
  ["pointerup", "pointercancel"].forEach(t => stage.addEventListener(t, release));

  stage.addEventListener("keydown", e => {
    const step = e.shiftKey ? 12 : 4;
    if (e.key === "ArrowLeft"){ stop(); set(curtainPct - step); e.preventDefault(); }
    if (e.key === "ArrowRight"){ stop(); set(curtainPct + step); e.preventDefault(); }
    if (e.key === " " || e.key === "Enter"){ glideTo(otherEdge()); e.preventDefault(); }
  });

  // Перерисовка списка морд обнуляет узлы — начинаем от актуального периода.
  curtainPct = 100;
  paint();
}

// Real, existing Wikipedia articles (not guessed) — Alex 2026-09-14: "можно
// в конце дать мелким шрифтом ссылку на чернова в вики, что по его
// методике". The row-by-row legend panel this used to sit at the bottom of
// is gone (Alex 2026-09-15: "совмещаем легенду и раздел «Что изменилось»"
// meant MERGE, not duplicate — the separate "How to read these faces"
// toggle + its own panel were removed once their content and interactivity
// moved into "Here's how you're doing" itself) — this small credit line is
// the one piece of that panel with no narrate() equivalent, so it now sits
// on its own under the faces.
const CH_CREDIT = {
  // Ссылкой служит само название метода, без хвоста «подробнее в Википедии»
  // (Alex 2026-09-27). Название и есть то, о чём человек пойдёт читать —
  // отдельное приглашение только занимает строку.
  ru: `Метод основан на <a href="https://ru.wikipedia.org/wiki/Лица_Чернова" target="_blank" rel="noopener">лицах Чернова</a> (Herman Chernoff, 1973).`,
  en: `Based on <a href="https://en.wikipedia.org/wiki/Chernoff_face" target="_blank" rel="noopener">Chernoff faces</a> (Herman Chernoff, 1973).`,
};

// Applies an already-computed param set (chFaceParams()/chFaceParamsAt())
// onto an EXISTING rendered <svg>'s elements, in place — used every frame of
// chAnimateLegend()'s demo sweep so the face visibly moves instead of being
// rebuilt from scratch 60 times a second. Mirrors chFaceSvg()'s own
// attribute math exactly (same chFaceGeometry() call) so a mid-animation
// frame and a fresh render() never disagree about where anything sits.
function chApplySvgParams(svg, p, cx){
  const cy = chHeadCy(p.headH);
  const box = chFaceCanvasBox(p.headH);
  const {eyeY, base, pupilL, pupilRv, ntx, nty, nbx, nby, fx, fy, mouthBaseY, mouthLen, smile} = chFaceGeometry(p, cx, cy);
  const bh = p.browHalf;
  const my = cy + mouthBaseY;

  // Кадр пересчитывается вместе с головой на каждом кадре анимации, как и
  // при первом рендере (chFaceSvg) — иначе живой прогон в легенде показывал
  // бы холст того размера, с которым страница загрузилась, пока сама голова
  // растёт и сжимается: тот же класс расхождения, что баг с незапоминающимся
  // cy от 17.09.2026 (см. историю chHeadCy).
  // Исключение: кадр закреплён (шторка, см. chFaceSvg) — там пересчитывать
  // его нельзя, две наложенные морды обязаны жить в одном viewBox, иначе во
  // время прогона одна поедет относительно другой.
  if (svg.dataset.vbY === undefined){
    svg.setAttribute("viewBox", `0 ${box.viewBoxY.toFixed(1)} 220 ${box.viewBoxH.toFixed(1)}`);
  }

  const head = svg.querySelector('ellipse[data-feature~="headW"]');
  if (head){ head.setAttribute("rx", p.headW.toFixed(1)); head.setAttribute("ry", p.headH.toFixed(1)); head.setAttribute("cy", cy.toFixed(1)); }

  const ears = svg.querySelectorAll('circle[data-feature~="ears"]');
  if (ears[0]){ ears[0].setAttribute("cx",(cx-p.headW).toFixed(1)); ears[0].setAttribute("cy",eyeY); ears[0].setAttribute("r",p.earRadL.toFixed(1)); }
  if (ears[1]){ ears[1].setAttribute("cx",(cx+p.headW).toFixed(1)); ears[1].setAttribute("cy",eyeY); ears[1].setAttribute("r",p.earRadR.toFixed(1)); }

  // :not([data-hit-overlay]) excludes the invisible fat hit-targets added
  // 2026-09-16 (see their own comment near chHitLine/chHitPath) — without
  // it these selectors would match 4 elements instead of 2 and brows[0]/[1]
  // index access would grab the wrong one.
  const browLX1 = (cx-p.browDx-bh).toFixed(1), browLY1 = base.toFixed(1), browLX2 = (cx-p.browDx+bh).toFixed(1), browLY2 = (base+p.dropL).toFixed(1);
  const browRX1 = (cx+p.browDx-bh).toFixed(1), browRY1 = (base+p.dropR).toFixed(1), browRX2 = (cx+p.browDx+bh).toFixed(1), browRY2 = base.toFixed(1);
  const brows = svg.querySelectorAll('line[data-feature~="brow"]:not([data-hit-overlay])');
  if (brows[0]){ brows[0].setAttribute("x1",browLX1); brows[0].setAttribute("y1",browLY1); brows[0].setAttribute("x2",browLX2); brows[0].setAttribute("y2",browLY2); }
  if (brows[1]){ brows[1].setAttribute("x1",browRX1); brows[1].setAttribute("y1",browRY1); brows[1].setAttribute("x2",browRX2); brows[1].setAttribute("y2",browRY2); }
  const browHits = svg.querySelectorAll('line[data-feature~="brow"][data-hit-overlay]');
  if (browHits[0]){ browHits[0].setAttribute("x1",browLX1); browHits[0].setAttribute("y1",browLY1); browHits[0].setAttribute("x2",browLX2); browHits[0].setAttribute("y2",browLY2); }
  if (browHits[1]){ browHits[1].setAttribute("x1",browRX1); browHits[1].setAttribute("y1",browRY1); browHits[1].setAttribute("x2",browRX2); browHits[1].setAttribute("y2",browRY2); }

  // Tag-agnostic (Alex 2026-09-16: optimal eyes render as a <path> "lens"
  // instead of a plain <ellipse> — chFaceSvg() decides which tag based on
  // p.optimal at initial render, and that flag is stable for the life of
  // this <svg> since it's built from REAL data only, never the demo
  // override — so whichever tag is actually in the DOM here just needs its
  // own attributes kept in sync, not swapped).
  const eyes = svg.querySelectorAll('[data-feature~="eyeWidth"]');
  const updateEye = (el, cxEye, rxV, ryV) => {
    if (!el) return;
    if (el.tagName === "ellipse"){
      el.setAttribute("cx", cxEye.toFixed(1)); el.setAttribute("cy", eyeY);
      el.setAttribute("rx", rxV.toFixed(1)); el.setAttribute("ry", ryV.toFixed(1));
    } else {
      el.setAttribute("data-eye-rx", rxV.toFixed(1)); el.setAttribute("data-eye-ry", ryV.toFixed(1));
      el.setAttribute("d", chEyeLensPath(cxEye, eyeY, rxV, ryV));
    }
  };
  updateEye(eyes[0], cx-p.eyeDx, p.eyeRxL, p.openL);
  updateEye(eyes[1], cx+p.eyeDx, p.eyeRxR, p.openR);

  // Pupil clip shapes (Alex 2026-09-17) -- same outline as the eyes just
  // updated above, kept in lockstep so a legend demo that resizes an eye
  // (eyeWidth/eyeOpen/eyeDx) doesn't leave the pupil's clip mask pointing
  // at the eye's OLD shape mid-sweep.
  updateEye(svg.querySelector('[data-clip-eye="L"]'), cx-p.eyeDx, p.eyeRxL, p.openL);
  updateEye(svg.querySelector('[data-clip-eye="R"]'), cx+p.eyeDx, p.eyeRxR, p.openR);

  // Optimal eyes' pupil sits at the lens shape's own true vertical center
  // (chEyePupilCenterY), not the plain ellipse's eyeY — see chEyeLensPath's
  // own comment for the closed-form derivation (Alex 2026-09-16).
  const pupils = svg.querySelectorAll('circle[data-feature~="pupilR"]');
  const pupilL_cy = (p.optimal && p.optimal.eyeL) ? chEyePupilCenterY(eyeY, p.openL) : eyeY;
  const pupilR_cy = (p.optimal && p.optimal.eyeR) ? chEyePupilCenterY(eyeY, p.openR) : eyeY;
  if (pupils[0]){ pupils[0].setAttribute("cx",(cx-p.eyeDx).toFixed(1)); pupils[0].setAttribute("cy",pupilL_cy.toFixed(1)); pupils[0].setAttribute("r",pupilL.toFixed(1)); }
  if (pupils[1]){ pupils[1].setAttribute("cx",(cx+p.eyeDx).toFixed(1)); pupils[1].setAttribute("cy",pupilR_cy.toFixed(1)); pupils[1].setAttribute("r",pupilRv.toFixed(1)); }

  const noseBX2 = nbx.toFixed(1), noseBY2 = nby.toFixed(1), noseFX2 = fx.toFixed(1), noseFY2 = fy.toFixed(1);
  const noseLines = svg.querySelectorAll('line[data-feature~="noseTilt"]:not([data-hit-overlay])');
  if (noseLines[0]){ noseLines[0].setAttribute("x1",ntx); noseLines[0].setAttribute("y1",nty); noseLines[0].setAttribute("x2",noseBX2); noseLines[0].setAttribute("y2",noseBY2); }
  if (noseLines[1]){ noseLines[1].setAttribute("x1",noseBX2); noseLines[1].setAttribute("y1",noseBY2); noseLines[1].setAttribute("x2",noseFX2); noseLines[1].setAttribute("y2",noseFY2); }
  const noseHits = svg.querySelectorAll('line[data-feature~="noseTilt"][data-hit-overlay]');
  if (noseHits[0]){ noseHits[0].setAttribute("x1",ntx); noseHits[0].setAttribute("y1",nty); noseHits[0].setAttribute("x2",noseBX2); noseHits[0].setAttribute("y2",noseBY2); }
  if (noseHits[1]){ noseHits[1].setAttribute("x1",noseBX2); noseHits[1].setAttribute("y1",noseBY2); noseHits[1].setAttribute("x2",noseFX2); noseHits[1].setAttribute("y2",noseFY2); }

  const mouthD = `M ${(cx-mouthLen/2).toFixed(1)} ${my} Q ${cx} ${(my+smile).toFixed(1)} ${(cx+mouthLen/2).toFixed(1)} ${my}`;
  const mouth = svg.querySelector('path[data-feature~="mouthLen"]:not([data-hit-overlay])');
  if (mouth){
    mouth.setAttribute("data-mouth-len", mouthLen.toFixed(1));
    mouth.setAttribute("data-smile", smile.toFixed(1));
    mouth.setAttribute("d", mouthD);
  }
  const mouthHit = svg.querySelector('path[data-feature~="mouthLen"][data-hit-overlay]');
  if (mouthHit) mouthHit.setAttribute("d", mouthD);
}

// "actual" n for a legend row's metric(s) — the real, un-overridden fraction
// chFaceParamsAt() would otherwise compute — used as the sweep's start/end
// point so the demo always returns to what the real data actually draws.
// Returns {L, R} — for a symmetric (paired) row these are genuinely
// different real values (each side's own metric); for a singular "feature"
// row there's only one instance, so L and R are the same number and the
// seesaw schedule below never actually gets used for those.
function chActualN(anim, set_, before, after){
  if (anim.feature){
    const cfg = CH_FEATURES[anim.feature];
    const n = cfg.metric === "__overall__" ? chOverall(set_, before, after) : chNorm(cfg.metric, set_, before, after);
    return {L: n, R: n};
  }
  const cfg = CH_SYMMETRIC[anim.symmetric[0]];
  return {L: chNorm(cfg.metricL, set_, before, after), R: chNorm(cfg.metricR, set_, before, after)};
}
function chBuildOverride(anim, nL, nR){
  return anim.feature ? {feature: anim.feature, n: nL} : {symmetric: anim.symmetric, nL, nR};
}
function chSmoothstep(x){ return x*x*(3-2*x); }
// Sweep schedule as fractions of the animation's own duration: start at the
// real value, glide to the high extreme (n=1, "the more X"), on to the low
// extreme (n=0, "the less X"), then settle back on the real value — one
// continuous demo shows both halves of the legend row's sentence in order.
// The RIGHT side of a paired feature uses the INVERTED schedule (Alex
// 2026-09-14: "анимируй их асинхронно... пока одно ухо увеличивается,
// второе уменьшается") — a seesaw, not two sides moving in lockstep, so the
// L/R independence the whole "one parameter per side" redesign is about is
// visible in the MOTION itself, not just inferred from the end state.
const CH_ANIM_SCHEDULE     = [{t:0, n:null}, {t:0.32, n:1}, {t:0.68, n:0}, {t:1, n:null}];
const CH_ANIM_SCHEDULE_INV = [{t:0, n:null}, {t:0.32, n:0}, {t:0.68, n:1}, {t:1, n:null}];
function chInterpN(schedule, raw, actualN){
  const vals = schedule.map(s => s.n === null ? actualN : s.n);
  for (let i = 0; i < schedule.length - 1; i++){
    if (raw <= schedule[i+1].t){
      const span = schedule[i+1].t - schedule[i].t || 1;
      const localT = (raw - schedule[i].t) / span;
      return vals[i] + (vals[i+1] - vals[i]) * chSmoothstep(localT);
    }
  }
  return vals[vals.length - 1];
}

// Tap/click (and keyboard) on a legend row plays a short demo DIRECTLY on
// both faces: the one feature that row explains sweeps from the real value
// up to its "the more X" extreme, down to its "the less X" extreme, and
// back — while every other feature keeps showing the real data untouched
// (Alex 2026-09-14: "показывать как это работает не стрелочками а
// изменениями в самом лице... по соответствующим уточнениям приводит к
// анимации соответствующих черт"). Replaces the older static
// directional-arrow overlay — the movement itself is now the explanation.
// No color highlight (Alex 2026-09-14, final word after trying it both
// ways: "синие обводки убери нахуй") — now that every row moves exactly
// ONE facial feature (see CH_LEGEND/CH_SYMMETRIC comments), the motion
// itself unambiguously answers "which part" without needing a stroke color
// on top of it.
let chAnimHandle = null;
function chCancelAnim(){
  if (chAnimHandle) cancelAnimationFrame(chAnimHandle);
  chAnimHandle = null;
}
function chAnimateLegend(row){
  if (!state.lastFaces || !state.lastFaces.length) return;
  chCancelAnim();
  const faces = state.lastFaces;
  const duration = 2600;
  const startTime = performance.now();

  function frame(now){
    const raw = Math.min(1, (now - startTime) / duration);
    faces.forEach(f => {
      const actual = chActualN(row.anim, f.set_, f.before, f.after);
      const nL = chInterpN(CH_ANIM_SCHEDULE, raw, actual.L);
      const nR = row.anim.feature ? nL : chInterpN(CH_ANIM_SCHEDULE_INV, raw, actual.R);
      const p = chFaceParamsAt(f.set_, f.before, f.after, chBuildOverride(row.anim, nL, nR));
      chApplySvgParams(f.svg, p, f.cx);
    });
    if (raw < 1){
      chAnimHandle = requestAnimationFrame(frame);
    } else {
      faces.forEach(f => chApplySvgParams(f.svg, chFaceParams(f.set_, f.before, f.after), f.cx));
      chAnimHandle = null;
    }
  }
  chAnimHandle = requestAnimationFrame(frame);
}
function render(){
  const S = t();
  document.getElementById("pageTitle").textContent = S.title;
  document.getElementById("pageLede").textContent = S.lede;
  document.getElementById("sampleNote").textContent = S.sampleNote;

  const player = DATA[state.player];
  const attsA = filterByDate(player.attempts, state.aFrom, state.aTo);
  const attsB = filterByDate(player.attempts, state.bFrom, state.bTo);
  const accOrd = ACC_ORD[player.acc];
  const mA = attsA.length ? metricsFor(attsA, accOrd) : null;
  const mB = attsB.length ? metricsFor(attsB, accOrd) : null;
  const historicalDist = historicalDistribution(player.attempts, accOrd);

  const buildRow = m => {
    const before = mB ? mB[m.key] : null;
    const after = mA ? mA[m.key] : null;
    const delta = relDelta(before, after);
    const dir = direction(m.favorable, delta);
    return {...m, before, after, delta, dir};
  };
  const rows = METRICS.map(buildRow);
  // The 8 face-only values get their OWN table rows too (Alex 2026-09-14) —
  // narrate()'s prose below stays scoped to just the 9 official measures
  // (unchanged), only the table gets the extra rows appended.
  const extraRows = CH_EXTRA_METRICS.map(buildRow);

  const b = playerBounds();
  const scopeAfter = describeSelection("A", state.lang);
  const scopeBefore = describeSelection("B", state.lang);

  document.getElementById("narrativeText").innerHTML = narrate(rows, scopeAfter, scopeBefore, state.lang, historicalDist);

  // Fixed per-metric ceiling for the faces — this player's own historical
  // max (reusing historicalDist, already built above for the narrative's
  // "holding steady" section) rather than whatever the two CURRENTLY
  // selected periods happen to be. See buildFaces() for why.
  const scaleMax = {};
  Object.keys(CH_FAV).forEach(k => {
    const hist = (historicalDist[k]||[]).filter(v => v != null);
    if (hist.length >= 2){
      scaleMax[k] = Math.max(...hist, 1e-9);
    } else {
      const vals = [mA ? mA[k] : null, mB ? mB[k] : null].filter(v => v != null);
      scaleMax[k] = vals.length ? Math.max(...vals, 1e-9) : 1e-9;
    }
  });
  chCancelAnim(); // about to replace the SVG nodes any running sweep is animating
  document.getElementById("faces").innerHTML = buildFaces(mB, mA, state.lang, scopeBefore, scopeAfter, scaleMax);
  wireFaces();
  // Snapshot of exactly what buildFaces() just drew, keyed to the live <svg>
  // nodes now in the DOM — chAnimateLegend() replays chFaceParamsAt() against
  // these SAME (set_, before, after) triples every frame, so a mid-sweep
  // frame is always geometrically consistent with a real render() of that
  // same data (buildFaces() draws face-col A/after first, then B/before —
  // see its own comment for why the left/right order is fixed).
  const faceSvgs = document.querySelectorAll("#faces svg");
  state.lastFaces = (mA && mB && faceSvgs.length === 2) ? [
    {svg: faceSvgs[0], set_: mA, before: {}, after: scaleMax, cx: 110},
    {svg: faceSvgs[1], set_: mB, before: {}, after: scaleMax, cx: 110},
  ] : null;
  // No JS-computed gap compensation needed here anymore (2026-09-18) — the
  // head's own crown is now pinned at a fixed y by chHeadCy() itself (see
  // its comment above), so the plain fixed CSS gap under #sampleNote is
  // already both minimal and constant for any head size, by construction.
  document.getElementById("faceCredit").innerHTML = CH_CREDIT[state.lang === "en" ? "en" : "ru"];

  document.getElementById("footNote").textContent = S.footNote(player.acc);

  renderTable(rows.concat(extraRows));
}

function fmtVal(key, v){
  if (v===null || v===undefined) return t().na;
  if (key==="hit" || key==="focus" || key==="consist" || key==="eff") return v.toFixed(1)+"%";
  if (key==="lucky") return v.toFixed(2)+"×";
  // gcv/earlyCV/lateCV are all the same geometric-CV formula (already a
  // percentage, see metricsFor()) — earlyShare/lateShare are a plain 0..1
  // fraction that needs ×100 first. Both were falling through to the "ms"
  // branch below before, which is wrong for anything that isn't a raw
  // millisecond magnitude (Alex 2026-09-14: the table needs a real row for
  // every new value the face uses, and a wrong unit is worse than none).
  if (key==="gcv" || key==="earlyCV" || key==="lateCV") return v.toFixed(1)+"%";
  if (key==="earlyShare" || key==="lateShare") return (v*100).toFixed(1)+"%";
  return v.toFixed(1)+(state.lang==="en"?" ms":" мс");
}
function plural(n){
  const m10=n%10, m100=n%100;
  if (m10===1 && m100!==11) return "ка";
  if ([2,3,4].includes(m10) && ![12,13,14].includes(m100)) return "ки";
  return "ок";
}

// Merges the legend into the table itself (Alex 2026-09-14: "совместим
// объяснялку и саму таблицу... в конце каждой характеристики подпись если х
// растет то черта х меняется так то, и кнопка показать") — every table row
// finds the ONE CH_LEGEND row that explains it (guaranteed unique, since
// each metric key drives exactly one facial feature — see CH_SYMMETRIC's
// own "one parameter, one feature" comment) and reuses that row's own desc
// text directly, so the wording can't drift between the two places.
function chLegendRowForKey(key, lang){
  return CH_LEGEND[lang === "en" ? "en" : "ru"].find(row => row.metricKeys.includes(key)) || null;
}
// Splits a legend row's desc into its two halves for a given metric key
// (Alex 2026-09-15: "первая часть поясняет смысл параметра, вторая — как
// меняется черта"). Most rows drive exactly one narrate() metric and carry
// flat paramText/featureText fields; the one row that drives TWO metrics at
// once (brow: early + late) carries paramTextByKey/featureTextByKey instead,
// keyed by which of the two this call is for. Returns null for rows that
// don't need the split (the 4 legend rows narrate() never shows a paragraph
// for — eyeOpen/eyeWidth/ears/pupilR — have neither field).
function legendHalvesForKey(key, lang){
  const row = chLegendRowForKey(key, lang);
  if (!row) return null;
  const param = row.paramTextByKey ? row.paramTextByKey[key] : row.paramText;
  const feature = row.featureTextByKey ? row.featureTextByKey[key] : row.featureText;
  return (param && feature) ? {row, param, feature} : null;
}
// Reverse lookup for tapping the DRAWN feature directly on a face (Alex
// 2026-09-15: "клик по самой черте лица должен приводить к её анимации и
// всплывашке с текстом о том какую характеристику и как отображает" — the
// mордочка/text triggers in the narrative were the forward direction, this
// is tapping the SVG itself). A clicked element's own data-feature can list
// MULTIPLE tokens (chFaceSvg's own comment: "some elements carry more than
// one token because they're the SAME geometry two different config entries
// drive", e.g. the eye ellipse's rx from eyeWidth and ry from eyeOpen) — a
// legend row matches when its OWN feature tokens are fully contained in the
// clicked element's tokens (order-independent). Returns {row,key} pairs,
// one per metricKey of every matching row (not one per row) — a row like
// brow genuinely carries two distinct characteristics (early, late) on the
// SAME line elements, so it needs the same per-key granularity the multi-row
// cases (eye/head/mouth) get.
function chLegendEntriesForFeatureTokens(dataFeatureStr, lang){
  const tokens = new Set(dataFeatureStr.split(" "));
  const rows = CH_LEGEND[lang === "en" ? "en" : "ru"].filter(row =>
    row.feature.split(" ").every(t => tokens.has(t))
  );
  const entries = [];
  rows.forEach(row => row.metricKeys.forEach(key => entries.push({row, key})));
  return entries;
}
// The metric's proper name (same label METRICS/the table/narrate() already
// use — never retyped), its psychological meaning, AND how it shows up on
// the feature — all three together (Alex 2026-09-15, two-part correction:
// "по лицу когда тюкают объяснение давать в псих терминах" asked for the
// psychological framing to lead; "куда делась вся психология? шире ж были
// фразы" caught that leading with JUST the short meaning line, on its own,
// had thrown away the fuller original text instead of building on it — this
// keeps both halves, just puts the psychological term first).
function metricLabelForKey(key, lang){
  const m = METRICS.find(x => x.key === key) || CH_EXTRA_METRICS.find(x => x.key === key);
  return m ? (lang === "en" ? m.label_en : m.label) : key;
}
function psychTextForEntry(entry, lang){
  const halves = legendHalvesForKey(entry.key, lang);
  if (!halves) return entry.row.desc; // shouldn't happen — every row now has param/feature fields
  return `${metricLabelForKey(entry.key, lang)} — ${halves.param} ${halves.feature}`;
}
function renderTable(rows){
  const S = t();
  const lang = state.lang === "en" ? "en" : "ru";
  const headRow = document.getElementById("tableHeadRow");
  headRow.innerHTML = S.tableHead.map(h => `<th>${h}</th>`).join("");
  const body = document.getElementById("dataTableBody");
  body.innerHTML = "";
  rows.forEach(r => {
    const tr = document.createElement("tr");
    const dirClass = r.dir==="good"?"dir-good":r.dir==="critical"?"dir-critical":"dir-flat";
    const dirText = S.dir[r.dir];
    const rLabel = state.lang === "en" ? r.label_en : r.label;
    tr.innerHTML = `<td>${rLabel}</td>
      <td class="num">${fmtVal(r.key, r.before)}</td>
      <td class="num">${fmtVal(r.key, r.after)}</td>
      <td class="num">${r.delta===null?"—":pctLabel(r.delta)}</td>
      <td class="${dirClass}">${dirText}</td>`;
    body.appendChild(tr);

    const capTr = document.createElement("tr");
    capTr.className = "table-caption-row";
    const capTd = document.createElement("td");
    capTd.colSpan = 5;
    const legendRow = chLegendRowForKey(r.key, lang);
    if (!legendRow) return; // every current row has a match — nothing to render otherwise
    const showLabel = lang === "en" ? "Show on the faces" : "Показать на лицах";
    capTd.innerHTML = `<span class="table-caption-text">${legendRow.desc}</span><button class="table-show-btn" data-key="${r.key}">${showLabel} ▸</button>`;
    capTr.appendChild(capTd);
    body.appendChild(capTr);
  });
  const toggleBtn = document.getElementById("tableToggle");
  const tableEl = document.getElementById("tableScroll");
  toggleBtn.textContent = tableEl.classList.contains("show") ? S.hideTable : S.showTable;
}

document.getElementById("tableToggle").addEventListener("click", () => {
  const tableEl = document.getElementById("tableScroll");
  tableEl.classList.toggle("show");
  const S = t();
  document.getElementById("tableToggle").textContent = tableEl.classList.contains("show") ? S.hideTable : S.showTable;
});

// Delegated (dataTableBody's own rows are rebuilt on every render(), a
// direct listener per-button would need re-wiring every time too — one
// listener on the table itself, matched by the click target, never needs
// re-wiring). Faces are position:sticky, so tapping "Show" way down in the
// table doesn't need any scroll — the faces are already pinned in view.
document.getElementById("dataTableBody").addEventListener("click", e => {
  const btn = e.target.closest(".table-show-btn");
  if (!btn) return;
  const lang = state.lang === "en" ? "en" : "ru";
  const row = chLegendRowForKey(btn.dataset.key, lang);
  if (row) chAnimateLegend(row);
});

// Delegated, same reasoning as dataTableBody's own listener above —
// narrativeText's paragraphs are rebuilt on every render() (Alex
// 2026-09-15: merge the legend into "Here's how you're doing"). Three
// tap targets, each independently: the metric name shows the parameter
// half in the shared tooltip; the мордочка icon shows the FULL legend
// sentence in the same tooltip AND animates; the feature-behavior text
// next to it just animates (no tooltip).
document.getElementById("narrativeText").addEventListener("click", e => {
  const lang = state.lang === "en" ? "en" : "ru";
  const nameEl = e.target.closest(".metric-name");
  if (nameEl){ showMetricTooltip(nameEl, nameEl.dataset.tip); return; }
  const iconEl = e.target.closest(".feature-icon");
  if (iconEl){
    showMetricTooltip(iconEl, iconEl.dataset.tip);
    const row = chLegendRowForKey(iconEl.dataset.key, lang);
    if (row) chAnimateLegend(row);
    return;
  }
  const hintEl = e.target.closest(".feature-hint");
  if (hintEl){
    const row = chLegendRowForKey(hintEl.dataset.key, lang);
    if (row) chAnimateLegend(row);
  }
});

// Tapping the drawn feature itself, directly on either face (Alex
// 2026-09-15). #faces persists across render()s (only its innerHTML is
// replaced by buildFaces()), so one delegated listener here covers every
// future re-render — no re-wiring needed the way wireFaces() re-attaches
// the face-label buttons each time. chFaceElementCycle tracks, per
// data-feature string, which of its possibly-several (row,key) entries
// (see chLegendEntriesForFeatureTokens's own comment — one ellipse/path can
// carry 2-3 independently-adjustable characteristics) to show NEXT —
// repeated taps on the same element step through all of them instead of
// always landing on just the first. Text shown is psychTextForEntry (the
// metric's name + what it MEANS), not the row's own visual desc — that
// visual "the more X the bigger the feature" text is what the mordochka/
// text triggers in the narrative already show.
const chFaceElementCycle = {};
document.getElementById("faces").addEventListener("click", e => {
  const el = e.target.closest("[data-feature]");
  if (!el) return;
  const df = el.getAttribute("data-feature");
  const lang = state.lang === "en" ? "en" : "ru";
  const entries = chLegendEntriesForFeatureTokens(df, lang);
  if (!entries.length) return;
  const i = (chFaceElementCycle[df] || 0) % entries.length;
  chFaceElementCycle[df] = i + 1;
  const entry = entries[i];
  showMetricTooltip(el, psychTextForEntry(entry, lang), e);
  chAnimateLegend(entry.row);
});

// Реальная загрузка вместо встроенного DATA: playerId+token из query string
// (native кладёт их в URL при клике по своей строке в лидборде — см.
// LeaderboardScreen.kt onSelectRow), report_data.php отдаёт попытки ТОЛЬКО
// этого игрока в его текущем уровне точности (см. эндпоинт).
// Режим "только мордочка" (Alex 2026-09-21): нативная карточка на Analytics
// открывает эту же страницу маленьким WebView с ?mode=face. Период приходит
// как fromMs/toMs (epoch, мс) — ровно тот набор попыток, что и в Analytics.
// Мало попыток (< min) — мордочка рисуется размытой; сколько попыток нашлось,
// страница сообщает нативу через PotFace.ready(count) (там же текст-подсказка).
// Если страница не смогла отрисовать — ready() не вызывается, нативная
// карточка остаётся со смайликом.
function renderFaceOnly(params){
  try {
    const fromMs = Number(params.get("fromMs")), toMs = Number(params.get("toMs"));
    const minAtt = Number(params.get("min")) || 30;
    const player = DATA.me;
    const accOrd = ACC_ORD[player.acc];
    const all = player.attempts;
    const inRange = all.filter(a => { const ms = Date.parse(a.t); return ms >= fromMs && ms <= toMs; });
    const count = inRange.length;
    const m = metricsFor(count ? inRange : all, accOrd);
    const hist = historicalDistribution(all, accOrd);
    const scaleMax = {};
    Object.keys(CH_FAV).forEach(k => {
      const h = (hist[k]||[]).filter(v => v != null);
      if (h.length >= 2){ scaleMax[k] = Math.max(...h, 1e-9); }
      else { scaleMax[k] = m[k] != null ? Math.max(m[k], 1e-9) : 1e-9; }
    });
    const p = chFaceParams(m, {}, scaleMax);
    document.documentElement.classList.add("face-mode");
    document.body.className = "face-mode";
    document.body.innerHTML = `<div id="faceOnly" class="${count < minAtt ? "blurred" : ""}">${chFaceSvg(p, 110, "a")}</div>`;
    if (window.PotFace && window.PotFace.ready) window.PotFace.ready(count);
  } catch (e){ /* нативная карточка останется со смайликом */ }
}

async function loadReport(){
  // Title/lede are normally set inside render(), which never runs if we
  // bail out before DATA loads — apply them once up front so an error state
  // doesn't show stale Russian placeholder text on an English-default page.
  document.getElementById("pageTitle").textContent = STR[state.lang].title;
  document.getElementById("pageLede").textContent = STR[state.lang].lede;
  document.getElementById("sampleNote").textContent = STR[state.lang].sampleNote;

  const params = new URLSearchParams(location.search);
  const playerId = params.get("playerId");
  const token = params.get("token");

  function showError(msg){
    document.getElementById("loadingMsg").hidden = true;
    const errEl = document.getElementById("errorMsg");
    errEl.textContent = msg;
    errEl.hidden = false;
  }

  if (!playerId || !token){
    showError(STR[state.lang].loadError);
    return;
  }

  let json;
  try {
    const resp = await fetch(`/api/report_data.php?playerId=${encodeURIComponent(playerId)}&token=${encodeURIComponent(token)}`);
    if (!resp.ok) throw new Error("bad status " + resp.status);
    json = await resp.json();
  } catch (e){
    showError(STR[state.lang].loadError);
    return;
  }

  if (!json || !json.ok || !Array.isArray(json.attempts) || json.attempts.length === 0){
    showError(STR[state.lang].noData);
    return;
  }

  DATA = { me: { label: json.displayName || "", acc: json.acc, attempts: json.attempts } };

  if (params.get("mode") === "face"){ renderFaceOnly(params); return; }

  document.getElementById("loadingMsg").hidden = true;
  document.getElementById("reportBody").hidden = false;

  buildLangSeg();
  setDefaultRanges();
  render();

  // Belt-and-suspenders (точный корень найден): пока document.hidden === true
  // (страница смонтирована в фоновой/ещё не показанной вкладке — воспроизведено
  // в тестовом Browser-пейне), решения makeLine() о цвете/размещении подписи
  // получаются неверными КАЖДЫЙ раз, не изредка — не разовый гонки момент,
  // а стабильно неверный результат, пока страница технически скрыта, и
  // стабильно верный, как только она видима. Значит настоящий, а не угаданный
  // триггер — сама смена видимости: перерисовываем при каждом
  // visibilitychange, когда страница становится видимой (без {once:true} —
  // дёшево и идемпотентно, лишний вызов ничего не портит). Плюс несколько
  // безусловных перерисовок в первую секунду на случай окружений, где
  // document.hidden вовсе не отражает реальное состояние видимости.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  [60, 250, 600, 1200].forEach(delay => setTimeout(render, delay));
}

loadReport();
</script>
