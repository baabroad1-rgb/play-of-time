name: Выложить сайт на хостинг

# Срабатывает, когда меняется что-то в webapp/ и это попадает в main.
# Можно запустить и руками: вкладка Actions -> этот workflow -> Run workflow
# (работает с телефона).
#
# Заливает только то, что реально нужно сайту. Документация, заметки сессий
# и отладочные файлы на сервер не уезжают.
#
# Ничего на сервере НЕ удаляет: папка downloads/ с APK и _old_builds/
# остаются нетронутыми.

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      # Документация на сервер и так не уезжает (см. exclude ниже), так что
      # выкладка из-за правки .md — это подключение к FTP ради нуля файлов.
      - '!webapp/**/*.md'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Залить webapp/ на playoftime.online
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.LOGIN }}
          password: ${{ secrets.PASSWORD }}
          protocol: ftps
          local-dir: ./webapp/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.claude/**
            **/*.md
            handoff/**
            Claude outputs/**
            _scratch_debug/**
            downloads/**
            test_p2.js
            api/config.php
            api/openrouter_key.php
            api/_dg_quota/**
            api/.htaccess
            .htaccess

      # Ключ OpenRouter для дневника Doppelgänger'а (Alex 2026-11-08): файл
      # api/openrouter_key.php не живёт в git и исключён из выкладки выше, как
      # config.php. Обычно его кладут руками файловым менеджером Beget; когда
      # тот недоступен («не могу сейчас пробиться к ним их файлменеджером») или
      # ключ меняется — его кладёт этот шаг из секрета репозитория
      # OPENROUTER_KEY (Settings → Secrets and variables → Actions). Нет
      # секрета — шаг ничего не делает. Один файл по FTPS, теми же секретами.
      - name: Положить ключ OpenRouter (если задан секрет OPENROUTER_KEY)
        env:
          KEY: ${{ secrets.OPENROUTER_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.LOGIN }}
          FTP_PASS: ${{ secrets.PASSWORD }}
        run: |
          set -u
          if [ -z "$KEY" ]; then echo "Секрета OPENROUTER_KEY нет — ключ на сервере не трогаю"; exit 0; fi
          case "$KEY" in *[!A-Za-z0-9_-]*) echo "В OPENROUTER_KEY неожиданные символы — скопирован целиком и без пробелов?"; exit 1;; esac
          umask 077
          printf "<?php return '%s';\n" "$KEY" > openrouter_key.php
          # %2F — путь от корня FTP, как server-dir: / шагом выше.
          url="ftp://$FTP_HOST/%2Fapi/openrouter_key.php"
          if ! curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASS" -T openrouter_key.php "$url"; then
            # Шаг выше (FTP-Deploy-Action) сертификат FTPS не сверяет (security: loose) —
            # если строгая проверка не прошла, делаем так же, как он.
            echo "Строгая проверка сертификата FTPS не прошла — заливаю как шаг выше, без неё"
            curl -sS --ssl-reqd --insecure --user "$FTP_USER:$FTP_PASS" -T openrouter_key.php "$url" || { rm -f openrouter_key.php; exit 1; }
          fi
          rm -f openrouter_key.php
          code=$(curl -s -o body.txt -w '%{http_code}' -X POST https://playoftime.online/api/doppelganger_diary.php -d '{}')
          echo "Проверка дневника: HTTP $code $(cat body.txt)"
          case "$code" in
            400) echo "Ключ на месте (на пустой запрос дневник и должен ответить 400 «bad playerId»)";;
            503) echo "Дневник выложен, но ключа не видит"; exit 1;;
            *)   echo "Неожиданный ответ дневника"; exit 1;;
          esac
