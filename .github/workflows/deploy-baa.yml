name: Выложить baa на хостинг

# Отдельная выкладка сайта-визитки. С выкладкой игры (deploy-web.yml) и
# measurement не связана: свой триггер, своя очередь, своя папка на сервере.
#
# Срабатывает, когда меняется baa/ и это попадает в main.
# Можно запустить и руками: вкладка Actions -> этот workflow -> Run workflow.
#
# Заливает baa/ в корень отдельного сайта на Beget:
# https://baa.playoftime.online/
# У поддомена своя папка (baa.playoftime.online/public_html), и обычный
# FTP-пользователь infousil_github в неё не попадает. Поэтому здесь свой
# FTP-аккаунт infousil_baa, домашняя папка которого и есть эта папка —
# отсюда server-dir: /. Его данные лежат в секретах BAA_LOGIN и
# BAA_PASSWORD; имя сервера записано прямо в шаге выкладки.
# Ничего на сервере не удаляет.

on:
  push:
    branches: [main]
    paths:
      - 'baa/**'
      - '.github/workflows/deploy-baa.yml'
  workflow_dispatch:

concurrency:
  group: deploy-baa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Диагностика связи с FTP Beget. Добавлена 15.11.2026: выкладка сутки
      # падала на таймауте, и из лога было не понять, на каком шаге —
      # имя не находится, порт закрыт или сервер молчит после подключения.
      # Ничего не меняет и секретов не печатает; ошибка здесь выкладку не
      # останавливает.
      - name: Проверить связь с FTP-сервером
        continue-on-error: true
        run: |
          host=infousil.beget.tech
          echo "== адрес"; getent hosts "$host" || echo "имя не находится"
          for port in 21 22 990; do
            if timeout 10 bash -c "</dev/tcp/$host/$port" 2>/dev/null; then echo "порт $port: открыт"; else echo "порт $port: не отвечает"; fi
          done
          echo "== приветствие FTP (ждём строку 220)"
          timeout 20 bash -c "exec 3<>/dev/tcp/$host/21 && head -n 1 <&3" || echo "приветствия нет"
          echo "== мой адрес"; curl -s --max-time 10 https://api.ipify.org || true; echo

      - name: Залить baa/ на baa.playoftime.online
        id: ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Имя сервера Beget записано явно, а не через секрет FTP_HOST: 14.11.2026
          # после перевыпуска сертификатов подключение по FTP_HOST стало
          # отваливаться по таймауту. Имя сервера не секрет.
          server: infousil.beget.tech
          username: ${{ secrets.BAA_LOGIN }}
          password: ${{ secrets.BAA_PASSWORD }}
          protocol: ftps
          local-dir: ./baa/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/*.md

      # Запасной путь. С вечера 14.11.2026 порт FTP (21) сервера Beget не
      # отвечает серверам GitHub, а порт SSH (22) открыт — это показал шаг
      # диагностики выше. Если обычная выкладка не подключилась, заливаем те
      # же файлы по SFTP тем же аккаунтом. Перед заливкой проверяем, что
      # попали именно в папку сайта (в ней лежит index.html), чтобы не
      # насыпать файлов не туда. Ничего на сервере не удаляет.
      - name: Залить по SFTP, если FTP не подключился
        if: steps.ftp.outcome == 'failure'
        env:
          BAA_LOGIN: ${{ secrets.BAA_LOGIN }}
          LFTP_PASSWORD: ${{ secrets.BAA_PASSWORD }}
        run: |
          set -e
          sudo apt-get install -y -q lftp >/dev/null
          conn="set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 3;"
          lftp --env-password -u "$BAA_LOGIN" -e "$conn cls -1; bye" sftp://infousil.beget.tech > /tmp/listing.txt
          echo "В папке на сервере:"; cat /tmp/listing.txt
          grep -qxE "index.html|robots.txt|revizor" /tmp/listing.txt || { echo "Это не папка сайта — не заливаю"; exit 1; }
          lftp --env-password -u "$BAA_LOGIN" -e "$conn mirror -R --verbose --exclude-glob '*.md' --exclude-glob '.git*' ./baa/ ./; bye" sftp://infousil.beget.tech

      # Заглушка Beget. 18.11.2026 после перевыпуска доменов и сертификатов Beget
      # положил в папку сайта свой index.php («Новый сайт успешно создан…»), а наш
      # index.html пропал: index.php открывается первым, и вместо сайта была
      # заглушка. Шаг убирает index.php, только если это именно та заглушка, и
      # заливает index.html заново. Другие файлы не трогает.
      - name: Убрать заглушку Beget и проверить index.html
        env:
          BAA_LOGIN: ${{ secrets.BAA_LOGIN }}
          LFTP_PASSWORD: ${{ secrets.BAA_PASSWORD }}
        run: |
          set -e
          command -v lftp >/dev/null || sudo apt-get install -y -q lftp >/dev/null
          conn="set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 3; set net:reconnect-interval-base 5;"
          lftp --env-password -u "$BAA_LOGIN" -e "$conn cls -1; bye" sftp://infousil.beget.tech > /tmp/ls.txt
          if grep -qx "index.php" /tmp/ls.txt; then
            lftp --env-password -u "$BAA_LOGIN" -e "$conn get index.php -o /tmp/remote-index.php; bye" sftp://infousil.beget.tech
            if grep -q "Новый сайт успешно создан\|successfully created and is ready" /tmp/remote-index.php; then
              lftp --env-password -u "$BAA_LOGIN" -e "$conn rm index.php; bye" sftp://infousil.beget.tech
              echo "Заглушка Beget index.php удалена"
            else
              echo "::warning title=index.php не заглушка::В папке сайта есть index.php, но это не заглушка Beget — не трогаю"
            fi
          fi
          lftp --env-password -u "$BAA_LOGIN" -e "$conn put baa/index.html -o index.html; bye" sftp://infousil.beget.tech
          echo "index.html залит"

      # Снятые с сайта папки. Выкладка ничего не удаляет, поэтому то, что убрано из
      # репозитория, удаляется здесь по списку. 18.11.2026: черновики двух вариантов
      # главной (выбран вариант Б, он стал главной).
      - name: Удалить снятые с сайта папки
        env:
          BAA_LOGIN: ${{ secrets.BAA_LOGIN }}
          LFTP_PASSWORD: ${{ secrets.BAA_PASSWORD }}
          RETIRED: draft-e2547d480f
        run: |
          command -v lftp >/dev/null || sudo apt-get install -y -q lftp >/dev/null
          conn="set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 3; set cmd:fail-exit no;"
          for d in $RETIRED; do
            lftp --env-password -u "$BAA_LOGIN" -e "$conn rm -r -f $d; bye" sftp://infousil.beget.tech && echo "убрано: $d"
          done

      # Проверка, что страница реально открывается и совпадает с репозиторием.
      # Сертификат на новом поддомене может появиться не сразу, поэтому
      # несколько попыток с паузой.
      - name: Проверить, что страница открывается
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://baa.playoftime.online/index.html?check=$GITHUB_RUN_ID" -o /tmp/index.html; then
              cmp /tmp/index.html baa/index.html
              echo "OK index.html"
              exit 0
            fi
            echo "Попытка $i не удалась, жду 30 с"
            sleep 30
          done
          echo "Страница не открылась: проверьте SSL-сертификат поддомена в панели Beget"
          exit 1
