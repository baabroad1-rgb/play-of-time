name: Выложить baa на хостинг

# Отдельная выкладка сайта-визитки. С выкладкой игры (deploy-web.yml) и
# measurement не связана: свой триггер, своя очередь, своя папка на сервере.
#
# Срабатывает, когда меняется baa/ и это попадает в main.
# Можно запустить и руками: вкладка Actions -> этот workflow -> Run workflow.
#
# Заливает baa/ в корень отдельного сайта на Beget:
# https://baa.playoftime.online/
# У поддомена своя папка (baa.playoftime.online/public_html), и обычный
# FTP-пользователь infousil_github в неё не попадает. Поэтому здесь свой
# FTP-аккаунт infousil_baa, домашняя папка которого и есть эта папка —
# отсюда server-dir: /. Его данные лежат в секретах BAA_LOGIN и
# BAA_PASSWORD; сервер тот же, что у остальных выкладок (FTP_HOST).
# Ничего на сервере не удаляет.

on:
  push:
    branches: [main]
    paths:
      - 'baa/**'
      - '.github/workflows/deploy-baa.yml'
  workflow_dispatch:

concurrency:
  group: deploy-baa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Залить baa/ на baa.playoftime.online
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.BAA_LOGIN }}
          password: ${{ secrets.BAA_PASSWORD }}
          protocol: ftps
          local-dir: ./baa/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/*.md

      # Проверка, что страница реально открывается и совпадает с репозиторием.
      # Сертификат на новом поддомене может появиться не сразу, поэтому
      # несколько попыток с паузой.
      - name: Проверить, что страница открывается
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://baa.playoftime.online/index.html?check=$GITHUB_RUN_ID" -o /tmp/index.html; then
              cmp /tmp/index.html baa/index.html
              echo "OK index.html"
              exit 0
            fi
            echo "Попытка $i не удалась, жду 30 с"
            sleep 30
          done
          echo "Страница не открылась: проверьте SSL-сертификат поддомена в панели Beget"
          exit 1
