name: Проверить сборку

# Компилирует Android-проект на любой ветке, КРОМЕ main, и ничего никуда
# не выкладывает. Нужен, чтобы крупную правку можно было проверить до того,
# как она попадёт в main и уедет игрокам: build-apk.yml срабатывает только
# на main и сразу заливает APK на хостинг.

on:
  push:
    branches-ignore: [main]
    paths:
      - 'android/**'
      # Та же причина, что в build-apk.yml: компилировать проект из-за
      # правки .md незачем.
      - '!android/**/*.md'
      - '.github/workflows/check-build.yml'
  workflow_dispatch:

concurrency:
  group: check-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Принять лицензии Android SDK
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      # Тот же ключ, что и в боевой сборке: иначе APK с ветки не поставить
      # на телефон поверх установленного, и отпечаток в логе не с чем сравнить.
      - name: Положить общий debug-ключ подписи
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "Секрет DEBUG_KEYSTORE_B64 не задан — подпись будет случайной."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n \t' | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
                  -storepass android -alias androiddebugkey 2>/dev/null | grep -i "SHA256:" || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Скомпилировать
        working-directory: android
        shell: bash
        # bash ./gradlew, а не ./gradlew: у скрипта шебанг #!/bin/sh
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Размер получившегося APK
        shell: bash
        run: |
          ls -lh android/app/build/outputs/apk/debug/*.apk
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "--- чем подписан: ---"
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256" || true
