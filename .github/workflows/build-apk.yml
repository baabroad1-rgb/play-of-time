name: Собрать APK и выложить

# Срабатывает, когда меняется код в android/ и это попадает в main.
# Можно запустить руками: вкладка Actions -> этот workflow -> Run workflow
# (работает с телефона).
#
# Что делает:
#   1. собирает debug-APK (подпись не нужна, ключ в GitHub не хранится);
#   2. возвращает в репозиторий увеличенный номер версии, чтобы нумерация
#      не сбрасывалась от сборки к сборке;
#   3. кладёт APK на хостинг в downloads/, удалив предыдущий — так решил
#      Алекс 22.09.2026: в папке всегда ровно один APK;
#   4. заводит релиз на GitHub с тем же файлом — архив версий, чтобы можно
#      было вернуться к любой прошлой сборке.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      publish_to_site:
        description: 'Класть APK на сайт (снять для служебных сборок)'
        type: boolean
        default: true

concurrency:
  group: build-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # нужен токен с правом записи, чтобы вернуть номер версии в репозиторий
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Образ runner'а урезанный: нет unzip, нет yes, нет даже /bin/sh —
      # поэтому ни android-actions/setup-android, ни sdkmanager (это sh-скрипт)
      # тут не работают. Пользуемся тем, что уже лежит в $ANDROID_HOME,
      # а лицензии кладём файлами напрямую.
      - name: Что есть в окружении
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          for t in sh bash unzip yes sudo apt-get curl java; do
            printf '%-10s %s\n' "$t" "$(command -v $t || echo НЕТ)"
          done
          echo "--- platforms:";    ls "$ANDROID_HOME/platforms"    2>/dev/null || echo нет
          echo "--- build-tools:";  ls "$ANDROID_HOME/build-tools"  2>/dev/null || echo нет
          echo "--- licenses:";     ls "$ANDROID_HOME/licenses"     2>/dev/null || echo нет

      - name: Принять лицензии Android SDK
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      # Debug-сборки подписываются ключом ~/.android/debug.keystore, и он свой
      # на каждой машине. Если собирать на GitHub с его собственным ключом,
      # Android отказывается ставить APK поверх установленного с ноутбука:
      # "App not installed as package conflicts with an existing package".
      # Поэтому кладём сюда тот же ключ, которым подписывает ноутбук Алекса —
      # Gradle подхватывает его из этого пути сам, правки build.gradle.kts не нужны.
      - name: Положить общий debug-ключ подписи
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "Секрет DEBUG_KEYSTORE_B64 не задан — сборка будет подписана"
            echo "случайным ключом GitHub и не встанет поверх установленного APK."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          # clip.exe в Git Bash добавляет к содержимому переводы строк, а иногда
          # и невидимые символы — чистим перед декодированием, иначе base64 -d
          # падает с "invalid input".
          printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n \t' | base64 -d > "$HOME/.android/debug.keystore" || {
            echo "Не удалось раскодировать DEBUG_KEYSTORE_B64."
            echo "Длина значения: ${#DEBUG_KEYSTORE_B64} символов."
            echo "Первые 16 символов: ${DEBUG_KEYSTORE_B64:0:16}"
            echo "Ожидается одна строка base64 длиной около 3000 символов."
            exit 1
          }
          ls -l "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
                  -storepass android -alias androiddebugkey | head -3

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать debug-APK
        working-directory: android
        shell: bash
        # именно `bash ./gradlew`: у скрипта шебанг #!/bin/sh, а sh в образе нет
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Найти APK и версию
        id: apk
        shell: bash
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "APK не найден"; exit 1; fi
          echo "path=$APK"               >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          # версия в имени файла — та, что была ДО автобампа
          echo "tag=v$(basename "$APK" .apk | sed 's/^play-of-time-v//')" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Чем подписан получившийся APK
        shell: bash
        # Проверка, а не украшение: до этого сборка молча подписывалась чужим
        # ключом, и выяснялось это только на телефоне ошибкой про конфликт
        # пакетов. Теперь отпечаток видно прямо в логе сборки.
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}" | grep -i "SHA-256\|SHA256" || true
          echo "--- ожидаемый отпечаток ключа из секрета: ---"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
                  -storepass android -alias androiddebugkey 2>/dev/null \
            | grep -i "SHA256:" || true

      - name: Сохранить APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Вернуть увеличенный номер версии в репозиторий
        shell: bash
        run: |
          if git diff --quiet -- android/app/version.properties; then
            echo "версия не изменилась, коммитить нечего"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/version.properties
          # [skip ci] обязателен: иначе этот коммит запустит сборку заново, по кругу
          git commit -m "Автобамп версии после сборки ${{ steps.apk.outputs.tag }} [skip ci]"
          git push

      - name: Положить APK на хостинг в downloads/
        # Служебные сборки (например мостовая версия под старым
        # идентификатором) не должны подменять приложение на сайте.
        if: github.event_name != 'workflow_dispatch' || inputs.publish_to_site
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.LOGIN }}
          FTP_PASSWORD: ${{ secrets.PASSWORD }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp --version | head -1

          # Общие настройки: FTPS разрешаем, но не требуем — если сервер его не
          # поддерживает, соединение не должно падать целиком.
          COMMON='set ftp:ssl-allow true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 20;'

          echo "=== что сейчас в downloads/ ==="
          lftp -c "$COMMON open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\"; cd /downloads; ls" || {
            echo "Не удалось подключиться или зайти в /downloads"; exit 1; }

          # Удаление старых APK не должно валить сборку: если их там нет,
          # lftp возвращает ошибку, а это нормальная ситуация.
          echo "=== убираю прежние APK (если есть) ==="
          lftp -c "$COMMON open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\"; cd /downloads; glob -a rm -f *.apk" || echo "прежних APK не было"

          echo "=== заливаю $APK ==="
          lftp -c "$COMMON open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\"; cd /downloads; put \"$APK\"; ls"

      - name: Завести релиз с этим APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ${{ steps.apk.outputs.tag }}
          body: |
            Debug-сборка, собрана автоматически.
            Что менялось — в истории коммитов и в `docs/CHANGELOG.md`.
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
