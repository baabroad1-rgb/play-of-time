<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Government Inspector — audiobook</title>
<meta name="description" content="Nikolai Gogol's comedy The Government Inspector (Revizor) as an audiobook in Russian, read by Alexander Belyshkin.">
<meta name="color-scheme" content="light">
<style>
:root { --bg: #FFFFFF; --fg: #000000; --body: "Helvetica Neue", Helvetica, Arial, sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: clamp(18px, 2.1vw, 21px); line-height: 1.4; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: clamp(28px, 6vw, 72px) 48px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.back { display: inline-block; margin-bottom: clamp(28px, 5vw, 56px); }
.intro { margin: 0 0 clamp(36px, 7vw, 80px); max-width: 21em; font-size: clamp(26px, 4.4vw, 44px); line-height: 1.14; letter-spacing: -0.02em; font-weight: 400; }
.intro strong { font-weight: 700; }
.player { border-top: 1px solid var(--fg); padding-block: 14px 26px; }
.now { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 14px; }
.now strong { font-weight: 700; }
.now span { font-variant-numeric: tabular-nums; }
audio { width: 100%; display: block; }
.err { margin: 12px 0 0; font-weight: 700; }
.acts { list-style: none; margin: 0; padding: 0; }
.acts li { border-top: 1px solid var(--fg); }
.acts button { width: 100%; display: flex; justify-content: space-between; gap: 16px; align-items: baseline; padding: 14px 0; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.acts .n { display: none; }
.acts .s { font-variant-numeric: tabular-nums; white-space: nowrap; }
.acts button:hover .t { text-decoration: underline; text-underline-offset: 0.18em; }
.acts [aria-current="true"] .t { font-weight: 700; }
.note, footer { font-size: 15px; }
.note { margin: 0; padding-block: 14px 40px; border-top: 1px solid var(--fg); }
footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; padding-top: 14px; border-top: 1px solid var(--fg); }
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../">← Alexander Belyshkin</a>
  <h1 class="intro"><strong>The Government Inspector.</strong> Gogol’s play, all five acts, read in Russian by Alexander Belyshkin.</h1>

  <section class="player" aria-label="Player">
    <div class="now"><strong id="now">Act I</strong><span id="count">1 of 5</span></div>
    <audio id="audio" controls preload="metadata"></audio>
    <p class="err" id="err" hidden>This part did not load. Try again in a moment.</p>
  </section>

  <ol class="acts" id="acts"></ol>
  <p class="note">The player remembers where you stopped on this device.</p>
  <footer><span>© 2026 Alexander Belyshkin</span><a href="../">baa.playoftime.online</a></footer>
</main>

<script>
(function () {
  var BASE = "../audio/";
  var ACTS = [
    { n: "I",   file: "Н.В. Гоголь.Ревизор.01.mp3", mb: "48.9" },
    { n: "II",  file: "Н.В. Гоголь.Ревизор.02.mp3", mb: "38.8" },
    { n: "III", file: "Н.В. Гоголь.Ревизор.03.mp3", mb: "46.4" },
    { n: "IV",  file: "Н.В. Гоголь.Ревизор.04.mp3", mb: "63.1" },
    { n: "V",   file: "Н.В. Гоголь.Ревизор.05.mp3", mb: "40.9" }
  ];
  var KEY = "revizor-position";
  var audio = document.getElementById("audio");
  var list = document.getElementById("acts");
  var now = document.getElementById("now");
  var count = document.getElementById("count");
  var err = document.getElementById("err");
  var current = 0, lastSaved = 0;

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ act: current, time: Math.floor(audio.currentTime) })); } catch (e) {} }

  ACTS.forEach(function (a, i) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span class="n">' + a.n + '</span><span class="t">Act ' + a.n + '</span><span class="s">' + a.mb + ' MB</span>';
    b.addEventListener("click", function () { select(i, 0, true); });
    li.appendChild(b); list.appendChild(li);
  });

  function select(i, time, play) {
    current = i;
    err.hidden = true;
    audio.src = BASE + encodeURIComponent(ACTS[i].file);
    now.textContent = "Act " + ACTS[i].n;
    count.textContent = (i + 1) + " of " + ACTS.length;
    Array.prototype.forEach.call(list.querySelectorAll("button"), function (b, j) {
      if (j === i) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    });
    if (time > 0) audio.addEventListener("loadedmetadata", function seek() {
      audio.removeEventListener("loadedmetadata", seek);
      audio.currentTime = time;
    });
    if (play) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }
    save();
  }

  audio.addEventListener("timeupdate", function () {
    if (Math.abs(audio.currentTime - lastSaved) >= 5) { lastSaved = audio.currentTime; save(); }
  });
  audio.addEventListener("ended", function () {
    if (current < ACTS.length - 1) select(current + 1, 0, true);
  });
  audio.addEventListener("error", function () { err.hidden = false; });

  var saved = load();
  var act = saved.act >= 0 && saved.act < ACTS.length ? saved.act : 0;
  select(act, saved.time || 0, false);
})();
</script>
</body>
</html>
