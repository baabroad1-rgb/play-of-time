<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Government Inspector — audiobook</title>
<meta name="description" content="Nikolai Gogol's comedy The Government Inspector (Revizor) as an audiobook in Russian, read by Alexander Belyshkin.">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #F3F5F4;
  --surface: #FFFFFF;
  --fg: #131A18;
  --muted: #5B6763;
  --rule: #DCE2DF;
  --accent: #2740D8;
  --accent-soft: #E6E9FB;
  --good: #1E8A4C;
  --bad: #C8372D;
  --tile-a: #1B2A8F;
  --tile-b: #10201A;
  --tile-c: #FBF7EC;
  --tile-c-fg: #1D1B16;
  --on-dark: #F2F5F3;
  --shadow: 0 1px 2px rgba(19, 26, 24, 0.05), 0 8px 24px rgba(19, 26, 24, 0.06);
  --display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1312; --surface: #171D1B; --fg: #E6EBE8; --muted: #93A09B; --rule: #29322F;
    --accent: #98A5FF; --accent-soft: #1E2547; --good: #4CC27F; --bad: #F0776C;
    --tile-a: #24349F; --tile-b: #0A1512; --tile-c: #24221C; --tile-c-fg: #EFEADB; --on-dark: #F2F5F3;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1312; --surface: #171D1B; --fg: #E6EBE8; --muted: #93A09B; --rule: #29322F;
  --accent: #98A5FF; --accent-soft: #1E2547; --good: #4CC27F; --bad: #F0776C;
  --tile-a: #24349F; --tile-b: #0A1512; --tile-c: #24221C; --tile-c-fg: #EFEADB; --on-dark: #F2F5F3;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}


.page { max-width: 720px; padding-block: 28px 56px; display: flex; flex-direction: column; gap: 28px; }
.back { align-self: flex-start; text-decoration: none; font-weight: 500; font-size: 14.5px; color: var(--muted); }
.back:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.kind { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(32px, 6vw, 52px); line-height: 1.05; letter-spacing: -0.03em; text-wrap: balance; }
.ru { margin: 10px 0 0; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 20px; color: var(--muted); }
.lede { margin: 14px 0 0; color: var(--muted); font-size: 17px; max-width: 34em; }
.player { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.now { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.now strong { font-family: var(--display); font-weight: 600; font-size: 20px; }
.now span { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
audio { width: 100%; display: block; }
.acts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.acts li { border-bottom: 1px solid var(--rule); }
.acts button {
  width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 14px 4px; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.acts button:hover .t { color: var(--accent); }
.acts .n { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: 700; font-size: 14px; }
.acts .t { font-family: var(--display); font-weight: 600; font-size: 17px; }
.acts .s { font-family: var(--mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.acts [aria-current="true"] .n { background: var(--accent); color: var(--surface); }
.acts [aria-current="true"] .t { color: var(--accent); }
.err { margin: 0; color: var(--bad); font-size: 14.5px; }
.note { margin: 0; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap page">
  <a class="back" href="../">← Alexander Belyshkin</a>
  <header>
    <p class="kind">Audiobook · in Russian</p>
    <h1>The Government Inspector</h1>
    <p class="ru">Н. В. Гоголь. «Ревизор»</p>
    <p class="lede">Nikolai Gogol's comedy in five acts, read aloud by Alexander Belyshkin.</p>
  </header>

  <section class="player" aria-label="Player">
    <div class="now"><strong id="now">Act I</strong><span id="count">1 of 5</span></div>
    <audio id="audio" controls preload="metadata"></audio>
    <p class="err" id="err" hidden>This part did not load. Try again in a moment.</p>
  </section>

  <ol class="acts" id="acts"></ol>
  <p class="note">The player remembers where you stopped on this device.</p>
</main>

<script>
(function () {
  var BASE = "../audio/";
  var ACTS = [
    { n: "I",   file: "Н.В. Гоголь.Ревизор.01.mp3", mb: "48.9" },
    { n: "II",  file: "Н.В. Гоголь.Ревизор.02.mp3", mb: "38.8" },
    { n: "III", file: "Н.В. Гоголь.Ревизор.03.mp3", mb: "46.4" },
    { n: "IV",  file: "Н.В. Гоголь.Ревизор.04.mp3", mb: "63.1" },
    { n: "V",   file: "Н.В. Гоголь.Ревизор.05.mp3", mb: "40.9" }
  ];
  var KEY = "revizor-position";
  var audio = document.getElementById("audio");
  var list = document.getElementById("acts");
  var now = document.getElementById("now");
  var count = document.getElementById("count");
  var err = document.getElementById("err");
  var current = 0, lastSaved = 0;

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ act: current, time: Math.floor(audio.currentTime) })); } catch (e) {} }

  ACTS.forEach(function (a, i) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span class="n">' + a.n + '</span><span class="t">Act ' + a.n + '</span><span class="s">' + a.mb + ' MB</span>';
    b.addEventListener("click", function () { select(i, 0, true); });
    li.appendChild(b); list.appendChild(li);
  });

  function select(i, time, play) {
    current = i;
    err.hidden = true;
    audio.src = BASE + encodeURIComponent(ACTS[i].file);
    now.textContent = "Act " + ACTS[i].n;
    count.textContent = (i + 1) + " of " + ACTS.length;
    Array.prototype.forEach.call(list.querySelectorAll("button"), function (b, j) {
      if (j === i) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    });
    if (time > 0) audio.addEventListener("loadedmetadata", function seek() {
      audio.removeEventListener("loadedmetadata", seek);
      audio.currentTime = time;
    });
    if (play) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }
    save();
  }

  audio.addEventListener("timeupdate", function () {
    if (Math.abs(audio.currentTime - lastSaved) >= 5) { lastSaved = audio.currentTime; save(); }
  });
  audio.addEventListener("ended", function () {
    if (current < ACTS.length - 1) select(current + 1, 0, true);
  });
  audio.addEventListener("error", function () { err.hidden = false; });

  var saved = load();
  var act = saved.act >= 0 && saved.act < ACTS.length ? saved.act : 0;
  select(act, saved.time || 0, false);
})();
</script>
</body>
</html>
